<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4yi-cad</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f9fafb;
    --text: #1f2937;
    --muted: #667085;
    --line: #d9dee8;
    --line-soft: #e8edf5;
    --primary: #0b6fe8;
    --primary-soft: #e7f1ff;
    --success: #157347;
    --warning: #9a6700;
    --danger: #c62828;
    --shadow: 0 1px 2px rgba(15, 23, 42, .08);
    --radius: 8px;
    font-family: Inter, "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }

  .workbench {
    height: 100vh;
    min-height: 720px;
    display: grid;
    grid-template-rows: 48px minmax(0, 1fr);
    background: var(--bg);
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(220px, 330px) minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .brand { min-width: 0; display: flex; align-items: center; gap: 9px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--primary);
    display: grid; place-items: center; color: var(--primary); font-weight: 800; font-size: 13px;
  }
  .brand-title { min-width: 0; }
  .brand-title strong { display: block; font-size: 14px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-title span { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .toolbar { min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
  .tool-separator { width: 1px; height: 22px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }
  .tool-button, .icon-button {
    min-height: 32px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 9px;
    white-space: nowrap;
  }
  .tool-button:hover, .icon-button:hover { background: var(--panel-2); }
  .tool-button.active, .icon-button.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .icon-button { width: 32px; padding: 0; border: 1px solid var(--line-soft); background: var(--panel); box-shadow: var(--shadow); }
  .toolbar svg, .panel-title svg, .tree svg, .section h3 svg, .tab-button svg {
    width: 16px;
    height: 16px;
    stroke-width: 1.9;
    flex: 0 0 auto;
  }

  .status-chip {
    border: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: var(--radius);
    padding: 6px 9px;
    color: var(--muted);
    font-size: 12px;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-chip.working {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-color: #b8d6ff;
    background: #eef6ff;
    color: var(--primary);
  }
  .status-chip.working::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 2px solid rgba(11,111,232,.22);
    border-top-color: var(--primary);
    animation: activitySpin .8s linear infinite;
    flex: 0 0 auto;
  }
  .top-actions {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .lang-button {
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .lang-button:hover { background: var(--primary-soft); color: var(--primary); }
  .top-action-button {
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .top-action-button:hover { background: var(--primary-soft); color: var(--primary); }
  .top-action-button svg { width: 15px; height: 15px; stroke-width: 2; }
  .hidden-file-input { display: none; }

  .session-history-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(15, 23, 42, .18);
    display: flex;
    justify-content: flex-end;
  }
  .session-history-panel {
    width: min(460px, 100vw);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -18px 0 36px rgba(15, 23, 42, .16);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .session-history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .session-history-header strong {
    display: block;
    font-size: 15px;
  }
  .session-history-header span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }
  .session-history-body {
    min-height: 0;
    overflow: auto;
    padding: 12px;
    display: grid;
    align-content: start;
    gap: 10px;
  }
  .session-row {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 10px;
    text-align: left;
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 10px;
  }
  .session-row:hover { border-color: #b8d6ff; background: #eef6ff; }
  .session-row.active {
    border-color: #b8d6ff;
    background: var(--primary-soft);
  }
  .session-thumb {
    width: 76px;
    aspect-ratio: 16 / 10;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--muted);
  }
  .session-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .session-thumb svg {
    width: 22px;
    height: 22px;
  }
  .session-main {
    min-width: 0;
    display: grid;
    gap: 4px;
  }
  .session-main strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }
  .session-main p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .session-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
  }
  .session-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.82);
    padding: 2px 6px;
    font-size: 11px;
  }
  .session-empty {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) clamp(320px, 24vw, 390px);
    grid-template-rows: minmax(360px, 1fr) clamp(240px, 30vh, 320px);
    grid-template-areas:
      "tree viewport props"
      "tree console props";
  }

  .panel {
    min-height: 0;
    background: var(--panel);
    border-color: var(--line);
    display: flex;
    flex-direction: column;
  }
  .left { grid-area: tree; border-right: 1px solid var(--line); }
  .right { grid-area: props; border-left: 1px solid var(--line); overflow: hidden; }
  .viewport-wrap { grid-area: viewport; min-height: 0; border-bottom: 1px solid var(--line); background: #f4f6fa; position: relative; overflow: hidden; }
  .bottom { grid-area: console; border-top: 0; background: var(--panel); overflow: hidden; }

  .panel-title {
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    font-weight: 700;
  }
  .panel-title > span { min-width: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-body { min-height: 0; overflow: auto; padding: 10px; }

  .tree { display: grid; gap: 3px; }
  .tree-item {
    width: 100%;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 0 8px;
    text-align: left;
  }
  .tree-item:hover { background: var(--panel-2); }
  .tree-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .tree-item.inactive { color: var(--muted); opacity: .7; }
  .tree-item .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 11px 12px; display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
  .tree-footer div { display: flex; justify-content: space-between; gap: 8px; }
  .tree-footer strong { color: var(--text); font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .viewport {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }
  .viewport.dragging { cursor: grabbing; }
  .viewport-content {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(900px, 100%);
    aspect-ratio: 16 / 10;
    transform-origin: 50% 50%;
  }
  .viewport svg { width: 100%; height: 100%; display: block; }
  .generated-preview {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 16px;
    position: relative;
  }
  .generated-image-frame {
    --generated-view-transform: none;
    --generated-explode-transform: none;
    position: relative;
    display: inline-grid;
    place-items: center;
    max-width: 100%;
    max-height: 100%;
    transform: var(--generated-view-transform) var(--generated-explode-transform);
    transform-origin: 50% 56%;
    transition: transform .18s ease, filter .18s ease;
  }
  .generated-preview.generated-view-top .generated-image-frame {
    --generated-view-transform: rotate(-1.5deg) scale(.985);
    filter: contrast(1.04) saturate(.98);
  }
  .generated-preview.generated-view-front .generated-image-frame {
    --generated-view-transform: perspective(900px) rotateX(7deg) scale(1.015);
  }
  .generated-preview.generated-view-right .generated-image-frame {
    --generated-view-transform: perspective(900px) rotateY(-11deg) scale(1.015);
  }
  .generated-preview.generated-exploded .generated-image-frame {
    --generated-explode-transform: translateY(-10px) scale(1.025);
    filter: contrast(1.06) saturate(1.03);
  }
  .generated-scene-frame {
    width: min(100%, 820px);
    height: min(100%, 520px);
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow);
  }
  .generated-scene-frame .generated-png-fallback,
  .cad-viewer {
    position: absolute;
    inset: 0;
  }
  .generated-scene-frame .generated-png-fallback {
    display: grid;
    place-items: center;
    transition: opacity .16s ease;
  }
  .generated-scene-frame.viewer-ready .generated-png-fallback {
    opacity: 0;
    pointer-events: none;
  }
  .cad-viewer {
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  .generated-scene-frame.viewer-ready .cad-viewer {
    opacity: 1;
    pointer-events: auto;
  }
  .cad-viewer canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  .cad-viewer-status {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 2;
    max-width: calc(100% - 20px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,.92);
    color: var(--muted);
    box-shadow: var(--shadow);
    padding: 6px 8px;
    font-size: 12px;
    pointer-events: none;
  }
  .generation-activity {
    position: absolute;
    right: 12px;
    top: 12px;
    z-index: 7;
    width: min(340px, calc(100% - 24px));
    border: 1px solid #b8d6ff;
    border-radius: var(--radius);
    background: rgba(255,255,255,.96);
    box-shadow: 0 8px 22px rgba(15, 23, 42, .12);
    padding: 11px 12px;
    color: var(--text);
    pointer-events: none;
  }
  .generation-activity header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding: 0;
    border: 0;
    background: transparent;
  }
  .generation-activity strong {
    display: block;
    font-size: 13px;
    line-height: 1.2;
  }
  .generation-activity p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }
  .activity-spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(11,111,232,.18);
    border-top-color: var(--primary);
    animation: activitySpin .8s linear infinite;
    flex: 0 0 auto;
  }
  .activity-bar {
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: #dbeafe;
  }
  .activity-bar span {
    display: block;
    width: 44%;
    height: 100%;
    border-radius: inherit;
    background: var(--primary);
    animation: activitySweep 1.2s ease-in-out infinite;
  }
  .activity-events {
    display: grid;
    gap: 5px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .activity-event {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .activity-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 0 3px rgba(11,111,232,.1);
    flex: 0 0 auto;
  }
  .activity-event span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .generated-preview img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow);
  }
  .generated-scene-frame img {
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .generated-bbox-outline {
    position: absolute;
    inset: 10% 12% 12%;
    z-index: 2;
    pointer-events: none;
    border: 2px dashed rgba(11,111,232,.88);
    border-radius: 8px;
    box-shadow: 0 0 0 5px rgba(11,111,232,.08);
  }
  .generated-dim {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    text-shadow: 0 1px 0 #fff;
  }
  .generated-dim::before,
  .generated-dim::after {
    content: "";
    position: absolute;
    background: var(--primary);
    box-shadow: 0 0 0 2px rgba(255,255,255,.8);
  }
  .generated-dim-x {
    left: 18%;
    right: 18%;
    bottom: 6%;
    height: 1px;
    border-top: 2px solid var(--primary);
  }
  .generated-dim-x::before,
  .generated-dim-x::after {
    width: 2px;
    height: 14px;
    top: -8px;
  }
  .generated-dim-x::before { left: 0; }
  .generated-dim-x::after { right: 0; }
  .generated-dim-y {
    right: 6%;
    top: 22%;
    bottom: 22%;
    width: 1px;
    border-left: 2px solid var(--primary);
  }
  .generated-dim-y::before,
  .generated-dim-y::after {
    width: 14px;
    height: 2px;
    left: -8px;
  }
  .generated-dim-y::before { top: 0; }
  .generated-dim-y::after { bottom: 0; }
  .generated-dim span {
    position: absolute;
    padding: 3px 6px;
    border: 1px solid #cfe4ff;
    border-radius: 6px;
    background: rgba(255,255,255,.94);
    white-space: nowrap;
  }
  .generated-dim-x span { left: 50%; top: 8px; transform: translateX(-50%); }
  .generated-dim-y span { left: 10px; top: 50%; transform: translateY(-50%); }
  .generated-measure {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
  }
  .generated-measure span {
    display: inline-block;
    border: 1px solid #cfe4ff;
    border-radius: 999px;
    background: rgba(255,255,255,.95);
    padding: 4px 8px;
    box-shadow: var(--shadow);
  }
  .generated-measure-distance {
    left: 24%;
    right: 24%;
    bottom: 14%;
    height: 0;
    border-top: 2px solid var(--primary);
  }
  .generated-measure-distance span { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); }
  .generated-measure-diameter {
    left: 45%;
    top: 43%;
    width: 18%;
    aspect-ratio: 1;
    border: 2px solid var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(11,111,232,.1);
  }
  .generated-measure-diameter span { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 8px); }
  .generated-measure-angle {
    left: 19%;
    top: 62%;
    width: 82px;
    height: 52px;
    border-left: 2px solid var(--primary);
    border-bottom: 2px solid var(--primary);
    border-bottom-left-radius: 8px;
  }
  .generated-measure-angle span { position: absolute; left: 18px; top: 10px; }
  .generated-selection-marker {
    position: absolute;
    left: var(--marker-x);
    top: var(--marker-y);
    width: var(--marker-w);
    height: var(--marker-h);
    z-index: 5;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border: 3px solid rgba(11,111,232,.95);
    border-radius: 999px;
    background: rgba(11,111,232,.08);
    box-shadow: 0 0 0 5px rgba(11,111,232,.12), 0 0 0 1px rgba(255,255,255,.9) inset;
  }
  .generated-selection-marker::after {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid rgba(11,111,232,.6);
    border-radius: inherit;
    animation: markerPulse 1.35s ease-in-out infinite;
  }
  .generated-marker-length,
  .generated-marker-width {
    height: 10%;
    border-radius: 999px;
  }
  .generated-marker-height {
    width: 10%;
    border-radius: 999px;
  }
  .generated-marker-diameter {
    aspect-ratio: 1;
    height: auto;
  }
  @keyframes markerPulse {
    0%, 100% { opacity: .25; transform: scale(.96); }
    50% { opacity: .9; transform: scale(1.04); }
  }
  @keyframes activitySpin {
    to { transform: rotate(360deg); }
  }
  @keyframes activitySweep {
    0% { transform: translateX(-110%); }
    55%, 100% { transform: translateX(230%); }
  }
  .generated-placeholder {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,.72);
    padding: 18px 20px;
    max-width: 420px;
    color: var(--muted);
    text-align: center;
  }
  .generated-placeholder strong { display: block; color: var(--text); margin-bottom: 6px; }
  .generated-selection-callout {
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    z-index: 3;
    max-width: min(360px, calc(100% - 32px));
    border: 1px solid #cfe4ff;
    border-radius: var(--radius);
    background: rgba(255,255,255,.96);
    box-shadow: var(--shadow);
    padding: 8px 10px;
    color: var(--primary);
    font-size: 12px;
    line-height: 1.3;
  }
  .generated-selection-callout strong {
    display: block;
    color: var(--primary);
    font-size: 13px;
  }
  .generated-selection-callout span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
  }
  .view-badge-row { position: absolute; left: 12px; top: 12px; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .view-badge {
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 650;
  }
  .measure-card {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 4;
    max-width: min(330px, calc(100% - 24px));
    background: rgba(255,255,255,.94);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px 12px;
    font-size: 12px;
  }
  .measure-card strong { display: block; margin-bottom: 3px; }
  .measure-card span { color: var(--muted); }
  .axis-readout {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 4;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .feature-shape { cursor: pointer; transition: opacity .15s ease; }
  .feature-shape:hover { opacity: .86; }
  .feature-selected { stroke: var(--primary); stroke-width: 3; }
  .dim-line { stroke: var(--primary); stroke-width: 1.3; marker-start: url(#arrow); marker-end: url(#arrow); }
  .dim-label { fill: var(--primary); font: 700 12px system-ui, sans-serif; }
  .bbox { fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 7 5; }

  .properties-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  #properties { min-height: 0; overflow: auto; flex: 1; }
  .feature-meta { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
  .feature-meta strong { display: block; font-size: 14px; }
  .feature-meta span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .version-pill { border-radius: 999px; background: var(--panel-2); color: var(--muted); padding: 4px 8px; font-size: 12px; font-weight: 650; }
  .rename-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 8px; margin-top: 12px; }
  .text-input, .param-input, .command-input, .select-input {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    min-width: 0;
  }
  .text-input { height: 36px; padding: 0 10px; }
  .param-input { width: 92px; height: 32px; text-align: right; padding: 0 9px; }
  .select-input { height: 32px; min-width: 112px; padding: 0 8px; }
  .feature-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .typed-action-button {
    min-height: 30px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 700;
  }
  .typed-action-button:hover:not(:disabled) { background: var(--primary-soft); color: var(--primary); border-color: #bdd8ff; }
  .typed-action-button.active { background: var(--primary-soft); color: var(--primary); border-color: #bdd8ff; }
  .typed-action-button:disabled { opacity: .48; cursor: not-allowed; }
  .typed-action-button svg { width: 14px; height: 14px; stroke-width: 2; }
  .typed-action-toggle {
    min-height: 30px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 650;
  }
  .typed-action-toggle input { margin: 0; }
  .sketch-tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  .sketch-tool-row label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 650; }

  .section { padding: 14px; border-bottom: 1px solid var(--line); }
  .section h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .section-note { margin: -4px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .selected-param-summary {
    border: 1px solid #cfe4ff;
    border-radius: var(--radius);
    background: var(--primary-soft);
    padding: 9px 10px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .selected-param-summary strong { display: block; color: var(--primary); font-size: 13px; }
  .selected-param-summary span { display: block; margin-top: 3px; color: var(--muted); }
  .selected-object-summary {
    border: 1px solid #cfe4ff;
    border-radius: var(--radius);
    background: var(--primary-soft);
    padding: 9px 10px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .selected-object-summary strong { display: block; color: var(--primary); font-size: 13px; }
  .selected-object-summary span { display: block; margin-top: 3px; color: var(--muted); }
  .readonly-property {
    min-height: 34px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(72px, auto);
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line-soft);
    padding: 7px 0;
    font-size: 12px;
  }
  .readonly-property:first-of-type { border-top: 0; }
  .readonly-property span:first-child {
    min-width: 0;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .readonly-property strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .subelement-grid { display: grid; gap: 6px; }
  .subelement-row {
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .subelement-row:hover,
  .subelement-row.active { border-color: #9fc8ff; background: var(--primary-soft); }
  .subelement-row.warning { border-color: #ffe1a6; background: #fff8e8; }
  .subelement-row.error { border-color: #f4b8b8; background: #fff0f0; }
  .subelement-row.info { border-color: #cfe4ff; background: #f5f9ff; }
  .subelement-row strong,
  .subelement-row span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .subelement-row span { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .diagnostic-list { display: grid; gap: 6px; margin-top: 10px; }
  .diagnostic-row {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    padding: 7px 9px;
    font-size: 12px;
    line-height: 1.35;
  }
  .diagnostic-row strong { display: block; margin-bottom: 2px; }
  .diagnostic-row span { display: block; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .diagnostic-row.warning { border-color: #ffe1a6; background: #fff8e8; color: var(--warning); }
  .diagnostic-row.error { border-color: #f4b8b8; background: #fff0f0; color: var(--danger); }
  .diagnostic-row.info { border-color: #cfe4ff; background: #f5f9ff; color: var(--primary); }
  .sketch-preview-review {
    border: 1px solid #f4b8b8;
    border-radius: var(--radius);
    background: #fff7f7;
    padding: 9px 10px;
    margin: 10px 0;
  }
  .sketch-preview-review strong { display: block; font-size: 13px; color: var(--danger); }
  .sketch-preview-review span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .sketch-solver-strip {
    min-height: 38px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    margin: 10px 0;
    font-size: 12px;
  }
  .sketch-solver-strip.error { border-color: #f4b8b8; background: #fff0f0; }
  .sketch-solver-strip.warning { border-color: #ffe1a6; background: #fff8e8; }
  .sketch-solver-strip.info { border-color: #cfe4ff; background: #f5f9ff; }
  .sketch-solver-strip strong,
  .sketch-solver-strip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .constraint-glyph-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    padding: 9px 10px;
    margin: 10px 0;
    display: grid;
    gap: 8px;
  }
  .constraint-glyph-card.error { border-color: #f4b8b8; background: #fff7f7; }
  .constraint-glyph-card.warning { border-color: #ffe1a6; background: #fffaf0; }
  .constraint-glyph-header {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 9px;
    align-items: center;
  }
  .constraint-glyph-mark {
    width: 46px;
    height: 38px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--primary-soft);
    color: var(--primary);
    display: grid;
    place-items: center;
    font: 750 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .constraint-glyph-card.error .constraint-glyph-mark { background: #fff0f0; color: var(--danger); border-color: #f4b8b8; }
  .constraint-glyph-card.warning .constraint-glyph-mark { background: #fff8e8; color: var(--warning); border-color: #ffe1a6; }
  .constraint-glyph-copy { min-width: 0; display: grid; gap: 3px; font-size: 12px; }
  .constraint-glyph-copy strong,
  .constraint-glyph-copy span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .constraint-glyph-copy span { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .constraint-ref-grid { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .constraint-ref-chip {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    min-height: 28px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap;
  }
  .constraint-ref-chip:hover,
  .constraint-ref-chip.active { background: var(--primary-soft); border-color: #9fc8ff; color: var(--primary); }
  .constraint-ref-chip:disabled { cursor: default; opacity: 0.58; }
  .constraint-ref-chip.error { background: #fff0f0; border-color: #f4b8b8; color: var(--danger); }
  .constraint-ref-chip.warning { background: #fff8e8; border-color: #ffe1a6; color: var(--warning); }
  .param-row {
    min-height: 42px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 36px;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line-soft);
  }
  .param-row:first-of-type { border-top: 0; }
  .param-row label { font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .param-row label span { color: var(--muted); font-weight: 550; }
  .unit { font-size: 12px; color: var(--muted); }
  .kv-list { display: grid; gap: 8px; }
  .kv {
    min-height: 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-size: 12px;
  }
  .kv span { color: var(--muted); }
  .kv strong { font-weight: 650; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .bottom-tabs {
    flex: 0 0 42px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 360px);
    align-items: center;
    gap: 10px;
    padding: 0 10px;
  }
  .tab-list { display: flex; gap: 4px; min-width: 0; overflow-x: auto; }
  .tab-button {
    border: 0;
    min-height: 30px;
    border-radius: var(--radius);
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    white-space: nowrap;
  }
  .tab-button.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .command-form { display: grid; grid-template-columns: minmax(0, 1fr) 86px; gap: 8px; min-width: 0; }
  .command-input { height: 32px; padding: 0 10px; }
  .primary-button {
    border: 0;
    border-radius: var(--radius);
    background: var(--primary);
    color: #fff;
    height: 32px;
    padding: 0 12px;
    font-weight: 650;
  }
  .bottom-content { min-height: 0; overflow: auto; padding: 10px 12px; }
  .history-list, .log-list { display: grid; gap: 8px; }
  .chat-panel { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 100%; }
  .chat-list { display: grid; align-content: start; gap: 8px; }
  .chat-message {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 9px 11px;
    font-size: 13px;
  }
  .chat-message.user { background: var(--primary-soft); border-color: #cfe4ff; }
  .chat-message.activity {
    border-color: #b8d6ff;
    background: #eef6ff;
  }
  .chat-message.activity strong {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--primary);
  }
  .chat-message.activity .activity-events {
    margin-top: 7px;
  }
  .chat-message strong { display: block; margin-bottom: 3px; font-size: 12px; }
  .chat-message span { color: var(--muted); }
  .history-item, .log-item, .artifact-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 10px 12px;
  }
  .history-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
  .history-item header { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; padding: 0; border: 0; }
  .history-item p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .history-action {
    align-self: center;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--primary);
    min-height: 28px;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .history-action:hover { background: var(--primary-soft); }
  pre {
    margin: 0;
    max-height: 120px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #f8fafc;
    padding: 10px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #263242;
  }
  .script-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .artifact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .artifact-card { min-height: 72px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .artifact-title { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 750; }
  .artifact-title span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artifact-ext { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .artifact-detail { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.25; }
  .artifact-card a { color: var(--primary); text-decoration: none; font-weight: 650; font-size: 12px; }
  .badge {
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .badge.ready { color: var(--success); background: #eaf7ef; border-color: #ccebd8; }
  .badge.queued { color: var(--warning); background: #fff7df; border-color: #ffe8a3; }
  .badge.preview { color: var(--primary); background: var(--primary-soft); border-color: #cfe4ff; }
  .badge.planned { color: var(--muted); background: #eef1f5; border-color: #dfe4ec; }
  .err { color: var(--danger); white-space: pre-wrap; }

  @media (max-width: 1100px) {
    body { overflow: auto; }
    .workbench { min-height: 1100px; height: auto; }
    .topbar { grid-template-columns: minmax(150px, 1fr); align-items: start; padding: 9px 10px; }
    .toolbar { order: 2; }
    .top-actions { order: 3; justify-content: flex-start; width: 100%; }
    .status-chip { max-width: none; flex: 1; }
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 250px 470px 390px 230px;
      grid-template-areas:
        "tree"
        "viewport"
        "props"
        "console";
      overflow: visible;
    }
    .left, .right { grid-row: auto; border: 0; border-bottom: 1px solid var(--line); }
    .right { border-left: 0; }
    .viewport-wrap { min-height: 470px; }
    .axis-readout { display: none; }
    .bottom-tabs { grid-template-columns: 1fr; height: auto; padding: 7px 10px; }
    .script-grid, .artifact-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="workbench">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-title">
        <strong id="brandTitle">4yi-cad Workbench</strong>
        <span id="subtitle">DesignState v1</span>
      </div>
    </div>
    <nav class="toolbar" aria-label="CAD toolbar" id="toolbar"></nav>
    <div class="top-actions">
      <div class="status-chip" id="status">loading design state</div>
      <input class="hidden-file-input" id="freeCadImportInput" type="file" accept=".FCStd,.fcstd,.step,.stp,.iges,.igs,.brep" onchange="importFreeCadModelFile(this.files && this.files[0]); this.value = '';" />
      <button class="top-action-button" id="newSessionButton" type="button" onclick="startNewWorkbenchSession()" title="Start a new workbench session"><span data-icon="redo"></span><span id="newSessionButtonText">New Session</span></button>
      <button class="top-action-button" id="sessionHistoryButton" type="button" onclick="openSessionHistory()" title="Open previous workbench sessions"><span data-icon="undo"></span><span id="sessionHistoryButtonText">Sessions</span></button>
      <button class="top-action-button" id="importButton" type="button" onclick="openFreeCadImportPicker()" title="Import FCStd, STEP, IGES, or BREP"><span data-icon="download"></span><span id="importButtonText">Import</span></button>
      <button class="lang-button" id="localeToggle" type="button" onclick="toggleLocale()">中文</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel left">
      <div class="panel-title"><span data-icon="layers"><span id="modelTreeTitle">Project / Model Tree</span></span></div>
      <div class="panel-body tree" id="featureTree"></div>
      <div class="tree-footer">
        <div><span id="activeFeatureLabel">Active feature</span><strong id="activeFeature">Base plate</strong></div>
        <div><span id="latestPatchLabel">Latest patch</span><strong id="latestPatch">none</strong></div>
      </div>
    </aside>

    <section class="viewport-wrap">
      <div class="view-badge-row">
        <div class="view-badge" id="selectionBadge">Object: Base plate</div>
        <div class="view-badge" id="headBadge">Head preview</div>
      </div>
      <div class="viewport" id="viewport">
        <div class="viewport-content" id="viewportContent"></div>
      </div>
      <div class="measure-card">
        <strong id="measureTitle">Distance</strong>
        <span id="measureText">Plate envelope: 60 x 40 x 14 mm</span>
      </div>
      <div class="axis-readout" id="axisReadout">X 60 / Y 40 / Z 14 mm</div>
    </section>

    <aside class="panel right">
      <div class="panel-title"><span data-icon="sliders"><span id="propertiesTitle">Properties / Parameters</span></span></div>
      <div id="properties"></div>
    </aside>

    <section class="panel bottom">
      <div class="bottom-tabs">
        <div class="tab-list" id="bottomTabs"></div>
        <form class="command-form" id="commandForm">
          <input class="command-input" id="commandInput" placeholder="Chat / modify: 把四个孔改成 6mm" />
          <button class="primary-button" id="applyButton" type="submit">Apply</button>
        </form>
      </div>
      <div class="bottom-content" id="bottomContent"></div>
    </section>
  </main>
  <div id="sessionHistoryDrawer"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const I18N = {
  en: {

    cadqueryScript: "CadQuery script",

    engine: "Engine",

    rollbackPreview: "Rollback preview",

    renderedFromEngine: "Rendered from {engine} output",
    waitingGeneratedPreview: "Waiting for generated preview",
    generatedPreviewTitle: "Generated model preview",
    generatedPreviewHint: "The CAD agent will replace the default DesignState viewport with its rendered PNG when generation succeeds.",
    activityTitle: "Generating CAD model",
    activityRewriteTitle: "Updating current CAD model",
    activitySubtitle: "The agent is working on the model.",

function sanitizeChatHistory(history) {
  if (!Array.isArray(history)) return [];
  return history
    .filter((item) => item && (item.role === "user" || item.role === "assistant") && typeof item.content === "string")
    .slice(-CHAT_HISTORY_MAX_MESSAGES)
    .map((item) => ({ role: item.role, content: item.content.trim().slice(0, CHAT_HISTORY_MAX_CHARS) }))
    .filter((item) => item.content);
}

function initialLocale() {
  const stored = localStorage.getItem("4yi-cad.locale");
  if (stored === "en" || stored === "zh") return stored;
  return navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
}

let currentLocale = initialLocale();

function i18nPath(locale, key) {
  return key.split(".").reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : undefined), I18N[locale]);
}

function t(key, vars = {}) {
  const raw = i18nPath(currentLocale, key) ?? i18nPath("en", key) ?? key;
  return String(raw).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
}

function generationActivityEventText(item) {
  if (!item) return "";
  if (item.key) return t(item.key, item.vars || {});
  return item.text || "";
}

function generationActivityTitle(activity = state.generationActivity) {
  return activity?.mode === "rewrite" ? t("activityRewriteTitle") : t("activityTitle");
}

function generationActivityCurrentText(activity = state.generationActivity) {
  return generationActivityEventText(activity?.events?.[0]) || t("activitySubtitle");
}

function startGenerationActivity(prompt, mode = "create") {
  state.generationActivity = {
    active: true,
    mode,
    prompt,
    phase: "submitting",
    events: [],
    startedAt: Date.now(),
    updatedAt: Date.now(),
  };
  pushGenerationActivity("activitySubmitting", {}, "submitting");
}

function pushGenerationActivity(key, vars = {}, phase = "working") {
  const activity = state.generationActivity;
  if (!activity) return;
  const normalizedVars = vars || {};
  const last = activity.events[0];
  const sameLast = last && last.key === key && JSON.stringify(last.vars || {}) === JSON.stringify(normalizedVars);
  activity.active = true;
  activity.phase = phase;
  activity.updatedAt = Date.now();
  if (sameLast) {
    last.at = activity.updatedAt;
    return;
  }
  activity.events.unshift({ key, vars: normalizedVars, phase, at: activity.updatedAt });
  activity.events = activity.events.slice(0, GENERATION_ACTIVITY_MAX_EVENTS);
}

function finishGenerationActivity(ok) {
  const activity = state.generationActivity;
  if (!activity) return;
  activity.active = false;
  activity.phase = ok ? "done" : "failed";
  activity.updatedAt = Date.now();
  activity.events.unshift({
    key: ok ? "activityDone" : "activityFailed",
    vars: {},
    phase: activity.phase,
    at: activity.updatedAt,
  });
  activity.events = activity.events.slice(0, GENERATION_ACTIVITY_MAX_EVENTS);
}

function clearGenerationActivity() {
  state.generationActivity = null;
}

function renderGenerationActivityEvents(activity = state.generationActivity, limit = 4) {
  const events = activity?.events?.slice(1, limit + 1) || [];
  if (!events.length) return "";
  return `<div class="activity-events">${events.map((item) => `
    <div class="activity-event"><span class="activity-dot"></span><span>${escapeHtml(generationActivityEventText(item))}</span></div>
  `).join("")}</div>`;
}

function renderGenerationActivityOverlay() {
  const activity = state.generationActivity;
  if (!activity?.active) return "";
  return `<div class="generation-activity" aria-live="polite">
    <header>
      <span class="activity-spinner"></span>
      <div>
        <strong>${escapeHtml(generationActivityTitle(activity))}</strong>
        <p>${escapeHtml(generationActivityCurrentText(activity))}</p>
      </div>
    </header>
    <div class="activity-bar"><span></span></div>
    ${renderGenerationActivityEvents(activity)}
  </div>`;
}

function renderGenerationActivityChatMessage() {
  const activity = state.generationActivity;
  if (!activity?.active) return "";
  return `<article class="chat-message activity" aria-live="polite">
    <strong><span class="activity-spinner"></span>${escapeHtml(generationActivityTitle(activity))}</strong>
    <span>${escapeHtml(generationActivityCurrentText(activity))}</span>
    ${renderGenerationActivityEvents(activity, 3)}
  </article>`;
}

function icon(name) {
  return iconSvg[name] || iconSvg.box;
}

function withIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((node) => {
    const name = node.getAttribute("data-icon");
    if (!node.dataset.iconDone) {
      node.insertAdjacentHTML("afterbegin", icon(name));
      node.dataset.iconDone = "1";
    }
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function formatNumber(value) {
  const n = Number(value);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function normalizeEngine(value) {
  return value === "freecad" ? "freecad" : "cadquery";
}

function engineLabel(engine = state.engine) {
  return normalizeEngine(engine) === "freecad" ? t("engineFreeCAD") : t("engineCadQuery");
}

function scriptTitle(engine = state.engine) {
  return normalizeEngine(engine) === "freecad" ? t("freecadScript") : t("cadqueryScript");
}

function clampParameter(name, value) {
  const [min, max] = parameterLimits[name] || [-Infinity, Infinity];
  return Math.min(max, Math.max(min, Number(value)));
}

function persistWorkbenchSession() {
  if (!state.designState) return;
  try {
    localStorage.setItem(WORKBENCH_SESSION_STORAGE_KEY, JSON.stringify(sessionSnapshot()));
  } catch (error) {
    try {
      localStorage.setItem(
        WORKBENCH_SESSION_STORAGE_KEY,
        JSON.stringify(sessionSnapshot({ includeHeavyArtifacts: false }))
      );
    } catch (innerError) {
      console.warn("Unable to persist 4yi-cad workbench session", innerError || error);
    }
  }
}

function restoreWorkbenchSession() {
  try {
    const raw = localStorage.getItem(WORKBENCH_SESSION_STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (
      !saved
      || saved.schema_version !== "4yi-cad.workbench-session/v1"
      || !saved.designState
      || saved.designState.schema_version !== "4yi-cad.design/v1"
    ) {

      return false;
    }

    state.designState = saved.designState;
    state.script = saved.script || "";
    state.patch = saved.patch || null;
    state.logs = Array.isArray(saved.logs) && saved.logs.length ? saved.logs : [t("log.workbenchStarting")];
    state.history = Array.isArray(saved.history) ? saved.history : [];
    state.artifacts = saved.artifacts && typeof saved.artifacts === "object" ? saved.artifacts : {};
    state.artifactRefs = saved.artifactRefs && typeof saved.artifactRefs === "object" ? saved.artifactRefs : {};
    state.previewPng = saved.previewPng || null;
    state.engine = normalizeEngine(saved.engine);
    state.freecadVersion = saved.freecadVersion || "";
    state.exportStatus = saved.exportStatus || "notReady";
    state.previewMode = saved.previewMode === "generated" ? "generated" : "design_state";
    state.generatedPrompt = saved.generatedPrompt || "";
    state.generatedParameters = Array.isArray(saved.generatedParameters) ? saved.generatedParameters : [];
    state.documentSummary = saved.documentSummary && typeof saved.documentSummary === "object" ? saved.documentSummary : null;
    state.selectedGeneratedParameterName = saved.selectedGeneratedParameterName || "";
    state.selectedFreeCadObjectName = saved.selectedFreeCadObjectName || "";
    state.selectedFreeCadSubelement = saved.selectedFreeCadSubelement && typeof saved.selectedFreeCadSubelement === "object" ? saved.selectedFreeCadSubelement : null;
    state.selectedFreeCadAssemblyJoint = saved.selectedFreeCadAssemblyJoint && typeof saved.selectedFreeCadAssemblyJoint === "object" ? saved.selectedFreeCadAssemblyJoint : null;
    state.selectedFreeCadSketchElement = saved.selectedFreeCadSketchElement && typeof saved.selectedFreeCadSketchElement === "object" ? saved.selectedFreeCadSketchElement : null;
    state.sketchCoincidenceAnchor = saved.sketchCoincidenceAnchor && typeof saved.sketchCoincidenceAnchor === "object" ? saved.sketchCoincidenceAnchor : null;
    state.sketchGeometryConstraintAnchor = saved.sketchGeometryConstraintAnchor && typeof saved.sketchGeometryConstraintAnchor === "object" ? saved.sketchGeometryConstraintAnchor : null;
    state.sketchEditTool = ["select", "line", "circle", "arc"].includes(saved.sketchEditTool) ? saved.sketchEditTool : "select";
    state.sketchSnapEnabled = saved.sketchSnapEnabled !== false;
    state.sketchSnapSize = Number.isFinite(Number(saved.sketchSnapSize)) && Number(saved.sketchSnapSize) > 0 ? Number(saved.sketchSnapSize) : 1;
    state.assemblyConnectorAnchor = saved.assemblyConnectorAnchor && typeof saved.assemblyConnectorAnchor === "object" ? saved.assemblyConnectorAnchor : null;
    state.viewMode = saved.viewMode || "iso";
    state.generatedViewerFitMode = saved.generatedViewerFitMode === "selection" ? "selection" : "all";
    state.selectionMode = ["object", "face", "edge", "vertex"].includes(saved.selectionMode)
      ? saved.selectionMode
      : "feature";
    state.measureMode = saved.measureMode || "distance";
    state.showBBox = saved.showBBox !== false;
    state.showDims = saved.showDims !== false;
    state.exploded = saved.exploded === true;
    state.selectedFeatureId = saved.selectedFeatureId || state.designState.selected_feature_id || "base_plate";
    state.designState.selected_feature_id = state.selectedFeatureId;
    state.bottomTab = saved.bottomTab || "chat";
    state.serverSessionId = saved.serverSessionId || localStorage.getItem(SERVER_SESSION_ID_STORAGE_KEY) || "";
    state.activeServerVersionId = saved.activeServerVersionId || "";
    if (state.serverSessionId) {
      localStorage.setItem(SERVER_SESSION_ID_STORAGE_KEY, state.serverSessionId);
    }
    state.chatHistory = sanitizeChatHistory(saved.chatHistory);
    state.chatMessages = Array.isArray(saved.chatMessages) && saved.chatMessages.length
      ? saved.chatMessages
      : [{ role: "assistant", key: "chat.initial" }];
    state.viewport = { scale: 1, tx: 0, ty: 0, dragging: false, x: 0, y: 0 };
    return true;
  } catch (error) {
    localStorage.removeItem(WORKBENCH_SESSION_STORAGE_KEY);
    console.warn("Unable to restore 4yi-cad workbench session", error);
    return false;
  }
}

function artifactRefsFromMetadata(metadata = {}) {
  const refs = metadata?.artifact_refs;
  return refs && typeof refs === "object" ? refs : {};
}

function artifactRef(key) {
  return state.artifactRefs && typeof state.artifactRefs === "object" ? state.artifactRefs[key] : null;
}

function artifactMime(key) {
  return {
    preview: "image/png",
    step: "application/step",
    stl: "model/stl",
    fcstd: "application/vnd.freecad",
    viewer_scene: "application/json",
    techdraw_pdf: "application/pdf",
    techdraw_svg: "image/svg+xml",
    techdraw_dxf: "image/vnd.dxf",
    feature_tree: "application/json",
  }[key] || "application/octet-stream";
}

function bytesToBase64(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

async function fetchArtifactRefB64(ref) {
  if (!ref?.url) return null;
  const res = await fetch(ref.url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const bytes = new Uint8Array(await res.arrayBuffer());
  return bytesToBase64(bytes);
}

async function hydrateArtifactRefs(refs = {}) {
  const artifacts = {};
  let previewPng = null;
  await Promise.all(Object.entries(refs).map(async ([key, ref]) => {
    try {
      const data = await fetchArtifactRefB64(ref);
      if (!data) return;
      if (key === "preview") previewPng = data;
      else artifacts[key] = data;
    } catch (error) {
      console.warn("Unable to hydrate artifact", key, error);
    }
  }));
  return { previewPng, artifacts };
}

function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

async function generatedStlArrayBuffer() {
  if (state.artifacts.stl) return base64ToArrayBuffer(state.artifacts.stl);
  const b64 = await fetchArtifactRefB64(artifactRef("stl"));
  return b64 ? base64ToArrayBuffer(b64) : null;
}

async function generatedViewerSceneData() {
  const b64 = state.artifacts.viewer_scene || await fetchArtifactRefB64(artifactRef("viewer_scene"));
  if (!b64) return null;
  try {
    const text = new TextDecoder().decode(base64ToArrayBuffer(b64));
    const scene = JSON.parse(text);
    return scene?.schema === "freecad.viewer_scene.v1" ? scene : null;
  } catch (error) {
    console.warn("Unable to parse FreeCAD viewer scene", error);
    return null;
  }
}

async function loadThreeModules() {
  if (!threeModulePromise) {
    threeModulePromise = Promise.all([
      import("/static/vendor/three/three.module.js"),
      import("/static/vendor/three/STLLoader.js"),
      import("/static/vendor/three/OrbitControls.js"),
    ]).then(([THREE, stlModule, controlsModule]) => ({
      THREE,
      STLLoader: stlModule.STLLoader,
      OrbitControls: controlsModule.OrbitControls,
    }));
  }
  return threeModulePromise;
}

function disposeThreeObject(object) {
  if (!object?.traverse) return;
  object.traverse((child) => {
    if (child.geometry?.dispose) child.geometry.dispose();
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    materials.filter(Boolean).forEach((material) => {
      if (material.map?.dispose) material.map.dispose();
      if (material.dispose) material.dispose();
    });
  });
}

function disposeGeneratedCadViewer() {
  generatedViewerToken += 1;
  if (!generatedViewerRuntime) return;
  if (generatedViewerRuntime.animationId) cancelAnimationFrame(generatedViewerRuntime.animationId);
  if (generatedViewerRuntime.resizeObserver) generatedViewerRuntime.resizeObserver.disconnect();
  if (generatedViewerRuntime.controls?.dispose) generatedViewerRuntime.controls.dispose();
  if (generatedViewerRuntime.scene) disposeThreeObject(generatedViewerRuntime.scene);
  if (generatedViewerRuntime.renderer?.dispose) generatedViewerRuntime.renderer.dispose();
  generatedViewerRuntime = null;
}

function resizeGeneratedViewer(renderer, camera, container) {
  const rect = container.getBoundingClientRect();
  const width = Math.max(240, Math.round(rect.width || 720));
  const height = Math.max(180, Math.round(rect.height || 450));
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}

function generatedCameraVector(THREE, mode, radius) {
  if (mode === "top") return new THREE.Vector3(0, 0, radius);
  if (mode === "front") return new THREE.Vector3(0, -radius, radius * 0.08);
  if (mode === "right") return new THREE.Vector3(radius, 0, radius * 0.08);
  return new THREE.Vector3(radius * 0.72, -radius, radius * 0.66);
}

function generatedCameraUpVector(THREE, mode) {
  if (mode === "top") return new THREE.Vector3(0, 1, 0);
  return new THREE.Vector3(0, 0, 1);
}

function freeCadTriplet(value) {
  if (!Array.isArray(value) || value.length < 3) return null;
  const numbers = value.slice(0, 3).map(Number);
  return numbers.every(Number.isFinite) ? numbers : null;
}

function freeCadPickPadding() {
  const size = freeCadTriplet(state.documentSummary?.geometry?.bbox?.size);
  const maxSize = size ? Math.max(...size.map(Math.abs), 1) : 100;
  return Math.max(0.5, maxSize * 0.018);
}

function freeCadBboxInfo(bbox, fallbackCenter = null, padding = freeCadPickPadding()) {
  const min = freeCadTriplet(bbox?.min);
  const max = freeCadTriplet(bbox?.max);
  if (min && max) {
    const size = min.map((value, index) => Math.max(0, max[index] - value));
    const center = min.map((value, index) => value + size[index] / 2);
    return { min, max, size, center };
  }
  const center = freeCadTriplet(fallbackCenter);
  if (!center) return null;
  const half = padding / 2;
  return {
    min: center.map((value) => value - half),
    max: center.map((value) => value + half),
    size: [padding, padding, padding],
    center,
  };
}

function freeCadExpandedPickInfo(info, kind, padding = freeCadPickPadding()) {
  if (!info) return null;
  const minByKind = {
    Object: 0.001,
    Face: padding * 0.5,
    Edge: padding,
    Vertex: padding * 1.4,
  }[kind] || padding;
  return {
    ...info,
    size: info.size.map((value) => Math.max(Math.abs(Number(value) || 0), minByKind)),
  };
}

function generatedViewerModelPointToWorld(THREE, point, sceneCenter, modelScale) {
  const triplet = freeCadTriplet(point) || [0, 0, 0];
  return new THREE.Vector3(
    (triplet[0] - sceneCenter.x) * modelScale,
    (triplet[1] - sceneCenter.y) * modelScale,
    (triplet[2] - sceneCenter.z) * modelScale
  );
}

function freeCadObjectFocusInfo(name = state.selectedFreeCadObjectName) {
  const obj = freeCadObjectByName(name);
  return freeCadBboxInfo(obj?.shape?.bbox);
}

function selectedFreeCadFocusInfo(viewerScene = null) {
  if (state.generatedViewerFitMode !== "selection") return null;
  const objectName = state.selectedFreeCadObjectName;
  if (!objectName) return null;
  const obj = freeCadObjectByName(objectName);
  const sceneObject = viewerSceneObjectByName(viewerScene, objectName);
  const selectedSubelement = selectedFreeCadSubelementRef();
  if (selectedSubelement) {
    const subelement = obj ? freeCadSubelementByRef(obj, selectedSubelement.reference, selectedSubelement.stableId) : null;
    const subelementInfo = freeCadBboxInfo(subelement?.bbox, subelement?.center);
    if (subelementInfo) return subelementInfo;
    const scenePoint = viewerSceneSubelementPoint(sceneObject, selectedSubelement.reference);
    const scenePointInfo = freeCadBboxInfo(null, scenePoint);
    if (scenePointInfo) return scenePointInfo;
  }
  return freeCadObjectFocusInfo(objectName) || freeCadBboxInfo(sceneObject?.bbox);
}

function applyGeneratedViewerCamera(runtime, focusInfo = null) {
  if (!runtime?.camera || !runtime?.controls || !runtime?.THREE || !runtime?.sceneBbox) return;
  const { THREE, camera, controls, sceneBbox, sceneCenter, modelScale } = runtime;
  const focus = focusInfo || sceneBbox;
  const target = generatedViewerModelPointToWorld(THREE, focus.center || sceneBbox.center, sceneCenter, modelScale);
  const size = freeCadTriplet(focus.size) || freeCadTriplet(sceneBbox.size) || [1, 1, 1];
  const scaledMaxDim = Math.max(...size.map((value) => Math.abs(Number(value) || 0) * modelScale), 0.5);
  const fovRad = THREE.MathUtils.degToRad(camera.fov || 38);
  const distance = Math.max(2.6, (scaledMaxDim / (2 * Math.tan(fovRad / 2))) * 1.65);
  const direction = generatedCameraVector(THREE, state.viewMode, 1).normalize();
  camera.up.copy(generatedCameraUpVector(THREE, state.viewMode));
  controls.target.copy(target);
  camera.position.copy(target.clone().add(direction.multiplyScalar(distance)));
  camera.near = Math.max(0.01, distance / 1000);
  camera.far = Math.max(1000, distance * 24);
  camera.lookAt(target);
  camera.updateProjectionMatrix();
  controls.minDistance = Math.max(0.12, distance / 80);
  controls.maxDistance = Math.max(20, distance * 10);
  controls.update();
}

function freeCadSelectionColor(kind) {
  return {
    Object: 0x64748b,
    Face: 0x0b6fe8,
    Edge: 0xf59e0b,
    Vertex: 0x22c55e,
  }[kind] || 0x64748b;
}

function clampUnit(value, fallback) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.max(0.05, Math.min(1, number)) : fallback;
}

function colorNumberFromHex(value, fallback) {
  const match = String(value || "").trim().match(/^#?([0-9a-fA-F]{6})$/);
  return match ? parseInt(match[1], 16) : fallback;
}

function colorNumberFromRgb(value, fallback) {
  if (!Array.isArray(value) || value.length < 3) return fallback;
  const channels = value.slice(0, 3).map(Number);
  if (!channels.every(Number.isFinite)) return fallback;
  return channels.reduce((acc, raw) => {
    const channel = raw > 1 ? raw / 255 : raw;
    return (acc << 8) + Math.max(0, Math.min(255, Math.round(channel * 255)));
  }, 0);
}

function freeCadStyleColorValue(style, hexKey, rgbKey, fallback) {
  const fromHex = colorNumberFromHex(style?.[hexKey], null);
  if (fromHex !== null) return fromHex;
  return colorNumberFromRgb(style?.[rgbKey], fallback);
}

function freeCadSemanticRoleFromText(text) {
  const token = String(text || "").toLowerCase();
  if (/人工湖|水景|水系|湖|河|池|lake|pond|water|river|pool/.test(token)) return "water";
  if (/儿童|游乐|playground|play|kids|child/.test(token)) return "play";
  if (/绿化|绿地|草坪|景观|花园|公园|green|garden|park|landscape|lawn/.test(token)) return "green";
  if (/道路|主干道|环路|步道|路_|_路|road|street|drive|path|walkway|loop/.test(token)) return "road";
  if (/会所|公建|配套|amenity|club|clubhouse|facility|podium/.test(token)) return "amenity";
  if (/住宅|高层|楼|别墅|建筑|塔楼|building|tower|villa|house|residential/.test(token)) return "building";
  if (/地块|场地|底板|基地|plot|site|base|slab/.test(token)) return "plot";
  return "generic";
}

function freeCadInferredSemanticRole(obj) {
  const explicit = obj?.style?.semantic_role || obj?.style?.semanticRole;
  if (explicit) return String(explicit).toLowerCase();
  return freeCadSemanticRoleFromText([
    obj?.name,
    obj?.label,
    obj?.type_id,
    obj?.kind,
  ].filter(Boolean).join(" "));
}

function freeCadViewerObjectStyle(obj) {
  const rawStyle = obj?.style && typeof obj.style === "object" ? obj.style : {};
  const role = freeCadInferredSemanticRole(obj);
  const defaults = {
    water: [0x38bdf8, 0x0369a1, 0x0ea5e9, 0.54, 0.52],
    green: [0x86c47a, 0x3f7f4f, 0x16a34a, 0.70, 0.40],
    play: [0xf4b860, 0xb45309, 0xf59e0b, 0.76, 0.46],
    road: [0x56616f, 0x263241, 0x475569, 0.82, 0.44],
    amenity: [0xd8a35d, 0x9a5d1f, 0xc97a24, 0.84, 0.46],
    building: [0xb9c2cc, 0x334155, 0x475569, 0.90, 0.34],
    plot: [0xd7e5cf, 0x75856f, 0x6b7c62, 0.66, 0.42],
    generic: [0x8f9aa6, 0x334155, 0x475569, 0.84, 0.30],
  }[role] || [0x8f9aa6, 0x334155, 0x475569, 0.84, 0.30];
  const color = freeCadStyleColorValue(rawStyle, "color", "color_rgb", defaults[0]);
  const edgeColor = freeCadStyleColorValue(rawStyle, "edge_color", "edge_color_rgb", defaults[1]);
  const pointColor = freeCadStyleColorValue(rawStyle, "point_color", "point_color_rgb", defaults[2]);
  const opacity = clampUnit(rawStyle.opacity, defaults[3]);
  return {
    role,
    color,
    edgeColor,
    pointColor,
    opacity,
    edgeOpacity: defaults[4],
  };
}

function freeCadSubelementMatchesSelection(objectName, reference, kind, stableId = "") {
  const selected = state.selectedFreeCadSubelement;
  return Boolean(selected)
    && normalizeFreeCadToken(selected.objectName) === normalizeFreeCadToken(objectName)
    && (
      normalizeFreeCadToken(selected.reference) === normalizeFreeCadToken(reference)
      || (stableId && normalizeFreeCadToken(selected.stableId) === normalizeFreeCadToken(stableId))
    )
    && (!kind || normalizeFreeCadToken(selected.kind) === normalizeFreeCadToken(kind));
}

function addFreeCadBoxTarget(THREE, group, options) {
  const info = freeCadExpandedPickInfo(options.info, options.kind);
  if (!info) return null;
  const geometry = new THREE.BoxGeometry(info.size[0], info.size[1], info.size[2]);
  const material = new THREE.MeshBasicMaterial({
    color: options.color,
    transparent: true,
    opacity: options.opacity,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const box = new THREE.Mesh(geometry, material);
  box.position.set(info.center[0], info.center[1], info.center[2]);
  box.userData.freeCadSelection = {
    type: options.type,
    objectName: options.objectName,
    reference: options.reference || "",
    kind: options.kind,
    stableId: options.stableId || "",
    priority: options.priority,
  };
  box.renderOrder = options.renderOrder || 4;
  group.add(box);

  if (options.outline) {
    const edgeGeometry = new THREE.EdgesGeometry(geometry);
    const edgeMaterial = new THREE.LineBasicMaterial({
      color: options.color,
      transparent: true,
      opacity: options.outlineOpacity,
    });
    const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
    edges.position.copy(box.position);
    edges.renderOrder = (options.renderOrder || 4) + 1;
    group.add(edges);
  }
  return box;
}

function addFreeCadSemanticObjectVisuals(THREE, group) {
  const targets = [];
  const selectedName = normalizeFreeCadToken(state.selectedFreeCadObjectName);
  const opacityByRole = {
    water: 0.58,
    green: 0.48,
    play: 0.58,
    road: 0.42,
    amenity: 0.62,
    building: 0.74,
    plot: 0.34,
    generic: 0.0,
  };
  for (const obj of freeCadSelectableShapeObjects()) {
    const objectName = freeCadObjectKey(obj);
    const info = freeCadBboxInfo(obj?.shape?.bbox);
    if (!objectName || !info) continue;
    const objectStyle = freeCadViewerObjectStyle(obj);
    const selected = selectedName && normalizeFreeCadToken(objectName) === selectedName;
    if (!selected && objectStyle.role === "generic") continue;
    const minSize = Math.max(0.01, freeCadPickPadding() * 0.08);
    const size = info.size.map((value) => Math.max(Math.abs(Number(value) || 0), minSize));
    const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    const opacity = selected
      ? Math.max(0.78, Math.min(0.96, objectStyle.opacity))
      : opacityByRole[objectStyle.role] ?? 0.46;
    const material = new THREE.MeshStandardMaterial({
      color: selected ? 0x60a5fa : objectStyle.color,
      roughness: 0.62,
      metalness: 0.02,
      transparent: true,
      opacity,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(info.center[0], info.center[1], info.center[2]);
    mesh.userData.freeCadSelection = {
      type: "object",
      objectName,
      kind: "Object",
      priority: selected ? -1 : 8,
    };
    mesh.renderOrder = selected ? 6 : 1;
    group.add(mesh);
    targets.push(mesh);

    const edgeGeometry = new THREE.EdgesGeometry(geometry, 24);
    const edgeMaterial = new THREE.LineBasicMaterial({
      color: selected ? 0x0b6fe8 : objectStyle.edgeColor,
      transparent: true,
      opacity: selected ? 0.96 : Math.max(0.32, objectStyle.edgeOpacity),
    });
    const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
    edges.position.copy(mesh.position);
    edges.renderOrder = selected ? 7 : 2;
    group.add(edges);
  }
  return targets;
}

function viewerSceneHasFaceMeshes(scene) {
  return Array.isArray(scene?.objects)
    && scene.objects.some((obj) => Array.isArray(obj.faces) && obj.faces.some((face) => Array.isArray(face.vertices) && Array.isArray(face.triangles)));
}

function viewerSceneHasEdgeGeometry(scene) {
  return Array.isArray(scene?.objects)
    && scene.objects.some((obj) => Array.isArray(obj.edges) && obj.edges.some((edge) => Array.isArray(edge.points) && edge.points.length >= 2));
}

function viewerSceneHasVertexGeometry(scene) {
  return Array.isArray(scene?.objects)
    && scene.objects.some((obj) => Array.isArray(obj.vertices) && obj.vertices.some((vertex) => Array.isArray(vertex.point) && vertex.point.length >= 3));
}

function addViewerSceneFaceMeshes(THREE, group, scene) {
  if (!viewerSceneHasFaceMeshes(scene)) return [];
  const targets = [];
  const selectedObjectName = normalizeFreeCadToken(state.selectedFreeCadObjectName);
  for (const obj of scene.objects || []) {
    const objectName = obj.name || obj.label || "";
    const objectSelected = selectedObjectName && normalizeFreeCadToken(objectName) === selectedObjectName;
    const objectStyle = freeCadViewerObjectStyle(obj);
    for (const face of obj.faces || []) {
      const reference = face.reference || face.name || "";
      const vertices = Array.isArray(face.vertices) ? face.vertices : [];
      const triangles = Array.isArray(face.triangles) ? face.triangles : [];
      if (!objectName || !reference || !vertices.length || !triangles.length) continue;
      const positions = [];
      for (const triangle of triangles) {
        const indices = Array.isArray(triangle) ? triangle.slice(0, 3).map(Number) : [];
        if (indices.length !== 3 || !indices.every(Number.isFinite)) continue;
        for (const index of indices) {
          const vertex = vertices[index];
          if (!Array.isArray(vertex) || vertex.length < 3) continue;
          positions.push(Number(vertex[0]) || 0, Number(vertex[1]) || 0, Number(vertex[2]) || 0);
        }
      }
      if (positions.length < 9) continue;
      const stableId = face.stable_id || face.stableId || "";
      const selected = freeCadSubelementMatchesSelection(objectName, reference, "Face", stableId);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.computeVertexNormals();
      const faceOpacity = selected ? 0.97 : objectSelected ? Math.max(objectStyle.opacity, 0.88) : objectStyle.opacity;
      const material = new THREE.MeshStandardMaterial({
        color: selected ? 0x2f80ed : objectStyle.color,
        roughness: 0.58,
        metalness: 0.04,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: faceOpacity,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData.freeCadSelection = {
        type: "subelement",
        objectName,
        reference,
        kind: "Face",
        stableId,
        legacyStableId: face.legacy_stable_id || face.legacyStableId || "",
        stableReference: face.stable_reference || face.stableReference || "",
        signature: face.signature || null,
        signatureVersion: face.signature_version || face.signatureVersion || null,
        stability: face.stability || "",
        priority: 0,
      };
      mesh.renderOrder = selected ? 7 : 2;
      group.add(mesh);
      targets.push(mesh);

      if (selected || objectSelected) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(geometry, 28),
          new THREE.LineBasicMaterial({
            color: selected ? 0x0b6fe8 : objectStyle.edgeColor,
            transparent: true,
            opacity: selected ? 0.85 : 0.56,
          })
        );
        edges.renderOrder = selected ? 9 : 3;
        group.add(edges);
      }
    }
  }
  return targets;
}
