<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4yi-cad</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f9fafb;
    --text: #1f2937;
    --muted: #667085;
    --line: #d9dee8;
    --line-soft: #e8edf5;
    --primary: #0b6fe8;
    --primary-soft: #e7f1ff;
    --success: #157347;
    --warning: #9a6700;
    --danger: #c62828;
    --shadow: 0 1px 2px rgba(15, 23, 42, .08);
    --radius: 8px;
    font-family: Inter, "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }

  .workbench {
    height: 100vh;
    min-height: 720px;
    display: grid;
    grid-template-rows: 48px minmax(0, 1fr);
    background: var(--bg);
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(220px, 330px) minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .brand { min-width: 0; display: flex; align-items: center; gap: 9px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--primary);
    display: grid; place-items: center; color: var(--primary); font-weight: 800; font-size: 13px;
  }
  .brand-title { min-width: 0; }
  .brand-title strong { display: block; font-size: 14px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-title span { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .toolbar { min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
  .tool-separator { width: 1px; height: 22px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }
  .tool-button, .icon-button {
    min-height: 32px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 9px;
    white-space: nowrap;
  }
  .tool-button:hover, .icon-button:hover { background: var(--panel-2); }
  .tool-button.active, .icon-button.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .icon-button { width: 32px; padding: 0; border: 1px solid var(--line-soft); background: var(--panel); box-shadow: var(--shadow); }
  .toolbar svg, .panel-title svg, .tree svg, .section h3 svg, .tab-button svg {
    width: 16px;
    height: 16px;
    stroke-width: 1.9;
    flex: 0 0 auto;
  }

  .status-chip {
    border: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: var(--radius);
    padding: 6px 9px;
    color: var(--muted);
    font-size: 12px;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-actions {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .lang-button {
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .lang-button:hover { background: var(--primary-soft); color: var(--primary); }

  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) clamp(320px, 24vw, 390px);
    grid-template-rows: minmax(360px, 1fr) clamp(240px, 30vh, 320px);
    grid-template-areas:
      "tree viewport props"
      "tree console props";
  }

  .panel {
    min-height: 0;
    background: var(--panel);
    border-color: var(--line);
    display: flex;
    flex-direction: column;
  }
  .left { grid-area: tree; border-right: 1px solid var(--line); }
  .right { grid-area: props; border-left: 1px solid var(--line); overflow: hidden; }
  .viewport-wrap { grid-area: viewport; min-height: 0; border-bottom: 1px solid var(--line); background: #f4f6fa; position: relative; overflow: hidden; }
  .bottom { grid-area: console; border-top: 0; background: var(--panel); overflow: hidden; }

  .panel-title {
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    font-weight: 700;
  }
  .panel-title > span { min-width: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-body { min-height: 0; overflow: auto; padding: 10px; }

  .tree { display: grid; gap: 3px; }
  .tree-item {
    width: 100%;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 0 8px;
    text-align: left;
  }
  .tree-item:hover { background: var(--panel-2); }
  .tree-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .tree-item.inactive { color: var(--muted); opacity: .7; }
  .tree-item .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 11px 12px; display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
  .tree-footer div { display: flex; justify-content: space-between; gap: 8px; }
  .tree-footer strong { color: var(--text); font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .viewport {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }
  .viewport.dragging { cursor: grabbing; }
  .viewport-content {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(900px, 100%);
    aspect-ratio: 16 / 10;
    transform-origin: 50% 50%;
  }
  .viewport svg { width: 100%; height: 100%; display: block; }
  .generated-preview {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 16px;
    position: relative;
  }
  .generated-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow);
  }
  .generated-placeholder {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,.72);
    padding: 18px 20px;
    max-width: 420px;
    color: var(--muted);
    text-align: center;
  }
  .generated-placeholder strong { display: block; color: var(--text); margin-bottom: 6px; }
  .generated-selection-callout {
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    z-index: 3;
    max-width: min(360px, calc(100% - 32px));
    border: 1px solid #cfe4ff;
    border-radius: var(--radius);
    background: rgba(255,255,255,.96);
    box-shadow: var(--shadow);
    padding: 8px 10px;
    color: var(--primary);
    font-size: 12px;
    line-height: 1.3;
  }
  .generated-selection-callout strong {
    display: block;
    color: var(--primary);
    font-size: 13px;
  }
  .generated-selection-callout span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
  }
  .view-badge-row { position: absolute; left: 12px; top: 12px; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .view-badge {
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 650;
  }
  .measure-card {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 4;
    max-width: min(330px, calc(100% - 24px));
    background: rgba(255,255,255,.94);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px 12px;
    font-size: 12px;
  }
  .measure-card strong { display: block; margin-bottom: 3px; }
  .measure-card span { color: var(--muted); }
  .axis-readout {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 4;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .feature-shape { cursor: pointer; transition: opacity .15s ease; }
  .feature-shape:hover { opacity: .86; }
  .feature-selected { stroke: var(--primary); stroke-width: 3; }
  .dim-line { stroke: var(--primary); stroke-width: 1.3; marker-start: url(#arrow); marker-end: url(#arrow); }
  .dim-label { fill: var(--primary); font: 700 12px system-ui, sans-serif; }
  .bbox { fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 7 5; }

  .properties-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  #properties { min-height: 0; overflow: auto; flex: 1; }
  .feature-meta { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
  .feature-meta strong { display: block; font-size: 14px; }
  .feature-meta span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .version-pill { border-radius: 999px; background: var(--panel-2); color: var(--muted); padding: 4px 8px; font-size: 12px; font-weight: 650; }
  .rename-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 8px; margin-top: 12px; }
  .text-input, .param-input, .command-input {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    min-width: 0;
  }
  .text-input { height: 36px; padding: 0 10px; }
  .param-input { width: 92px; height: 32px; text-align: right; padding: 0 9px; }
  .feature-actions { display: flex; gap: 10px; margin-top: 12px; }

  .section { padding: 14px; border-bottom: 1px solid var(--line); }
  .section h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .section-note { margin: -4px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .selected-param-summary {
    border: 1px solid #cfe4ff;
    border-radius: var(--radius);
    background: var(--primary-soft);
    padding: 9px 10px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .selected-param-summary strong { display: block; color: var(--primary); font-size: 13px; }
  .selected-param-summary span { display: block; margin-top: 3px; color: var(--muted); }
  .param-row {
    min-height: 42px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 36px;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line-soft);
  }
  .param-row:first-of-type { border-top: 0; }
  .param-row label { font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .param-row label span { color: var(--muted); font-weight: 550; }
  .unit { font-size: 12px; color: var(--muted); }
  .kv-list { display: grid; gap: 8px; }
  .kv {
    min-height: 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-size: 12px;
  }
  .kv span { color: var(--muted); }
  .kv strong { font-weight: 650; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .bottom-tabs {
    flex: 0 0 42px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 360px);
    align-items: center;
    gap: 10px;
    padding: 0 10px;
  }
  .tab-list { display: flex; gap: 4px; min-width: 0; overflow-x: auto; }
  .tab-button {
    border: 0;
    min-height: 30px;
    border-radius: var(--radius);
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    white-space: nowrap;
  }
  .tab-button.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
  .command-form { display: grid; grid-template-columns: minmax(0, 1fr) 86px; gap: 8px; min-width: 0; }
  .command-input { height: 32px; padding: 0 10px; }
  .primary-button {
    border: 0;
    border-radius: var(--radius);
    background: var(--primary);
    color: #fff;
    height: 32px;
    padding: 0 12px;
    font-weight: 650;
  }
  .bottom-content { min-height: 0; overflow: auto; padding: 10px 12px; }
  .history-list, .log-list { display: grid; gap: 8px; }
  .chat-panel { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 100%; }
  .chat-list { display: grid; align-content: start; gap: 8px; }
  .chat-message {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 9px 11px;
    font-size: 13px;
  }
  .chat-message.user { background: var(--primary-soft); border-color: #cfe4ff; }
  .chat-message strong { display: block; margin-bottom: 3px; font-size: 12px; }
  .chat-message span { color: var(--muted); }
  .history-item, .log-item, .artifact-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    padding: 10px 12px;
  }
  .history-item header { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; padding: 0; border: 0; }
  .history-item p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  pre {
    margin: 0;
    max-height: 120px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #f8fafc;
    padding: 10px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #263242;
  }
  .script-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .artifact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .artifact-card { min-height: 72px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .artifact-title { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 750; }
  .artifact-title span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artifact-ext { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .artifact-detail { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.25; }
  .artifact-card a { color: var(--primary); text-decoration: none; font-weight: 650; font-size: 12px; }
  .badge {
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .badge.ready { color: var(--success); background: #eaf7ef; border-color: #ccebd8; }
  .badge.queued { color: var(--warning); background: #fff7df; border-color: #ffe8a3; }
  .badge.preview { color: var(--primary); background: var(--primary-soft); border-color: #cfe4ff; }
  .badge.planned { color: var(--muted); background: #eef1f5; border-color: #dfe4ec; }
  .err { color: var(--danger); white-space: pre-wrap; }

  @media (max-width: 1100px) {
    body { overflow: auto; }
    .workbench { min-height: 1100px; height: auto; }
    .topbar { grid-template-columns: minmax(150px, 1fr); align-items: start; padding: 9px 10px; }
    .toolbar { order: 2; }
    .top-actions { order: 3; justify-content: flex-start; width: 100%; }
    .status-chip { max-width: none; flex: 1; }
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 250px 470px 390px 230px;
      grid-template-areas:
        "tree"
        "viewport"
        "props"
        "console";
      overflow: visible;
    }
    .left, .right { grid-row: auto; border: 0; border-bottom: 1px solid var(--line); }
    .right { border-left: 0; }
    .viewport-wrap { min-height: 470px; }
    .axis-readout { display: none; }
    .bottom-tabs { grid-template-columns: 1fr; height: auto; padding: 7px 10px; }
    .script-grid, .artifact-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="workbench">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-title">
        <strong id="brandTitle">4yi-cad Workbench</strong>
        <span id="subtitle">DesignState v1</span>
      </div>
    </div>
    <nav class="toolbar" aria-label="CAD toolbar" id="toolbar"></nav>
    <div class="top-actions">
      <div class="status-chip" id="status">loading design state</div>
      <button class="lang-button" id="localeToggle" type="button" onclick="toggleLocale()">中文</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel left">
      <div class="panel-title"><span data-icon="layers"><span id="modelTreeTitle">Project / Model Tree</span></span></div>
      <div class="panel-body tree" id="featureTree"></div>
      <div class="tree-footer">
        <div><span id="activeFeatureLabel">Active feature</span><strong id="activeFeature">Base plate</strong></div>
        <div><span id="latestPatchLabel">Latest patch</span><strong id="latestPatch">none</strong></div>
      </div>
    </aside>

    <section class="viewport-wrap">
      <div class="view-badge-row">
        <div class="view-badge" id="selectionBadge">Object: Base plate</div>
        <div class="view-badge" id="headBadge">Head preview</div>
      </div>
      <div class="viewport" id="viewport">
        <div class="viewport-content" id="viewportContent"></div>
      </div>
      <div class="measure-card">
        <strong id="measureTitle">Distance</strong>
        <span id="measureText">Plate envelope: 60 x 40 x 14 mm</span>
      </div>
      <div class="axis-readout" id="axisReadout">X 60 / Y 40 / Z 14 mm</div>
    </section>

    <aside class="panel right">
      <div class="panel-title"><span data-icon="sliders"><span id="propertiesTitle">Properties / Parameters</span></span></div>
      <div id="properties"></div>
    </aside>

    <section class="panel bottom">
      <div class="bottom-tabs">
        <div class="tab-list" id="bottomTabs"></div>
        <form class="command-form" id="commandForm">
          <input class="command-input" id="commandInput" placeholder="Chat / modify: 把四个孔改成 6mm" />
          <button class="primary-button" id="applyButton" type="submit">Apply</button>
        </form>
      </div>
      <div class="bottom-content" id="bottomContent"></div>
    </section>
  </main>
</div>

<script>

    noScriptParameters: "No editable numeric variables found in this generated script.",
    generatedParameterSelected: "{name} = {value} {unit}",
    generatedParameterGroup: "{group} group",
    regeneration: "Regeneration",
    patchMode: "Patch mode",

    svgPreview: "svg preview",
    previewReady: "preview ready",
    readyValue: "ready",

function initialLocale() {
  const stored = localStorage.getItem("4yi-cad.locale");
  if (stored === "en" || stored === "zh") return stored;
  return navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
}

let currentLocale = initialLocale();

function i18nPath(locale, key) {
  return key.split(".").reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : undefined), I18N[locale]);
}

function t(key, vars = {}) {
  const raw = i18nPath(currentLocale, key) ?? i18nPath("en", key) ?? key;
  return String(raw).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
}

function icon(name) {
  return iconSvg[name] || iconSvg.box;
}

function withIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((node) => {
    const name = node.getAttribute("data-icon");
    if (!node.dataset.iconDone) {
      node.insertAdjacentHTML("afterbegin", icon(name));
      node.dataset.iconDone = "1";
    }
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function formatNumber(value) {
  const n = Number(value);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function clampParameter(name, value) {
  const [min, max] = parameterLimits[name] || [-Infinity, Infinity];
  return Math.min(max, Math.max(min, Number(value)));
}

function dataUrl(mime, b64) {
  return `data:${mime};base64,${b64}`;
}

async function fetchJson(url, body) {
  const res = await fetch(url, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.detail || json.error || `HTTP ${res.status}`);
  return json;
}

function log(message) {
  state.logs.unshift(message);
  state.logs = state.logs.slice(0, 40);
  renderBottom();
}

function selectedFeature() {
  if (state.previewMode === "generated") {
    return { id: "generated_model", name: DEFAULT_FEATURE_NAMES.generated_model, kind: "agent", parameters: [], suppressible: false, suppressed: false };
  }
  return (state.designState?.features || []).find((f) => f.id === state.selectedFeatureId);
}

function enabledFeatureIds() {
  const ds = state.designState;
  if (!ds) return new Set();
  let activeIndex = ds.features.length - 1;
  if (ds.rollback_feature_id) {
    const idx = ds.features.findIndex((f) => f.id === ds.rollback_feature_id);
    if (idx >= 0) activeIndex = idx;
  }
  return new Set(ds.features.slice(0, activeIndex + 1).filter((f) => !f.suppressed).map((f) => f.id));
}

function featureDepth(feature) {
  const map = { design: 0, body: 1, base_plate: 2, fillet_corners: 2, hole_pattern: 2, center_boss: 2, center_hole: 3 };
  return map[feature.id] || 0;
}

function featureIcon(feature) {
  if (feature.kind === "document") return icon("code");
  if (feature.kind === "body") return icon("layers");
  if (feature.kind === "cut") return icon("ruler");
  return icon("box");
}

function featureName(feature) {
  if (!feature) return t("featureFallback");
  const defaultName = DEFAULT_FEATURE_NAMES[feature.id];
  if (!defaultName || feature.name !== defaultName) return feature.name;
  return t(`features.${feature.id}`);
}

function featureKind(kind) {
  return t(`kinds.${kind}`);
}

function parameterLabel(name) {
  return t(`params.${name}`) || name;
}

function generatedParameterLabel(param) {
  return param.label || String(param.name || "").replace(/_/g, " ");
}

function generatedParameterUnit(param) {
  return param.unit || "";
}

function selectedGeneratedParameter() {
  const params = state.generatedParameters || [];
  return params.find((param) => param.name === state.selectedGeneratedParameterName) || null;
}

function generatedParameterGroup(param) {
  if (!param) return "";
  return param.group || String(param.name || "").split("_", 1)[0] || "";
}

function generatedParameterValueText(param) {
  if (!param) return "";
  const unit = generatedParameterUnit(param);
  return t("generatedParameterSelected", {
    name: param.name,
    value: formatNumber(param.value),
    unit,
  }).trim();
}

function generatedSelectionLabel(param) {
  if (!param) return t("generatedModel");
  const group = generatedParameterGroup(param);
  return group ? `${param.name} · ${t("generatedParameterGroup", { group })}` : param.name;
}

function relatedGeneratedParameters(selected, params) {
  if (!selected) return params;
  const group = generatedParameterGroup(selected);
  const related = params.filter((param) => generatedParameterGroup(param) === group);
  return related.length ? related : [selected];
}

function safeDomId(value) {
  return String(value || "").replace(/[^a-zA-Z0-9_-]/g, "_");
}

function jsString(value) {
  return JSON.stringify(String(value || ""));
}

function exportStatusLabel(status = state.exportStatus) {
  const hasTranslation = i18nPath(currentLocale, `status.${status}`) || i18nPath("en", `status.${status}`);
  return hasTranslation ? t(`status.${status}`) : status;
}

function hasStepStlArtifacts() {
  return Boolean(state.artifacts.step && state.artifacts.stl);
}

function artifactExportStatusLabel() {
  return hasStepStlArtifacts() ? t("readyValue") : exportStatusLabel();
}

function chatText(item) {
  return item.key ? t(item.key, item.vars || {}) : item.text;

function addHistory(label, detail) {
  const version = state.designState?.version || 1;
  state.history.unshift({
    id: `${Date.now()}-${label}`,
    version,
    label,
    detail,
  });
  state.history = state.history.slice(0, 60);
}

function setStatus(key, vars = {}) {
  state.statusKey = key;
  state.statusVars = vars;
  const hasTranslation = i18nPath(currentLocale, `status.${key}`) || i18nPath("en", `status.${key}`);
  $("status").textContent = hasTranslation ? t(`status.${key}`, vars) : key;
}

function renderStaticText() {
  document.documentElement.lang = currentLocale === "zh" ? "zh-CN" : "en";
  document.title = t("appTitle");
  $("brandTitle").textContent = t("appTitle");
  $("modelTreeTitle").textContent = t("projectTree");
  $("activeFeatureLabel").textContent = t("activeFeature");
  $("latestPatchLabel").textContent = t("latestPatch");
  $("propertiesTitle").textContent = t("properties");
  $("commandInput").placeholder = t("commandPlaceholder");
  $("applyButton").textContent = t("apply");
  $("localeToggle").textContent = t("langToggle");
  $("toolbar").setAttribute("aria-label", t("toolbarLabel"));
  setStatus(state.statusKey || "loading", state.statusVars || {});
}

function setLocale(locale) {
  currentLocale = locale === "zh" ? "zh" : "en";
  localStorage.setItem("4yi-cad.locale", currentLocale);
  renderAll();
}

function toggleLocale() {
  setLocale(currentLocale === "zh" ? "en" : "zh");
}

function renderToolbar() {
  const viewButtons = [
    ["fit", "toolbar.fit", "ruler"],
    ["top", "toolbar.top", "box"],
    ["front", "toolbar.front", "ruler"],
    ["right", "toolbar.right", "box"],
    ["iso", "toolbar.iso", "ruler"],
  ];
  const modes = [
    ["feature", "toolbar.feature", "pointer"],
  ];
  const measures = [
    ["distance", "toolbar.distance", "ruler"],
    ["diameter", "toolbar.diameter", "ruler"],
    ["angle", "toolbar.angle", "ruler"],
  ];

  $("toolbar").innerHTML = [
    ...viewButtons.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, state.viewMode === value, `setView('${value}')`)),
    "<span class='tool-separator'></span>",
    toolButton(t("toolbar.bbox"), "box", state.showBBox, "toggleBBox()"),
    toolButton(t("toolbar.dims"), "ruler", state.showDims, "toggleDims()"),
    toolButton(t("toolbar.explode"), "layers", state.exploded, "toggleExplode()"),
    "<span class='tool-separator'></span>",
    ...modes.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, state.selectionMode === value, `setSelectionMode('${value}')`)),
    "<span class='tool-separator'></span>",
    ...measures.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, state.measureMode === value, `setMeasureMode('${value}')`)),
  ].join("");
}

function toolButton(label, iconName, active, action) {
  return `<button class="tool-button ${active ? "active" : ""}" type="button" onclick="${action}" title="${escapeHtml(label)}">${icon(iconName)}<span>${escapeHtml(label)}</span></button>`;
}

function renderTree() {
  const ds = state.designState;
  if (!ds) return;
  if (state.previewMode === "generated") {
    const params = state.generatedParameters || [];
    const selectedParam = selectedGeneratedParameter();
    $("featureTree").innerHTML = `
      <button class="tree-item" style="padding-left:8px" type="button" onclick="showGeneratedModel()">
        <span>⌄</span>${icon("code")}<span class="name">${escapeHtml(t("generatedDesign"))}</span>
      </button>
      <button class="tree-item ${selectedParam ? "" : "active"}" style="padding-left:34px" type="button" onclick="showGeneratedModel()">
        <span style="width:12px"></span>${icon("box")}<span class="name">${escapeHtml(state.generatedPrompt || t("agentModel"))}</span>
      </button>
      <button class="tree-item" style="padding-left:60px" type="button" onclick="showGeneratedParameters()">
        <span style="width:12px"></span>${icon("ruler")}<span class="name">${escapeHtml(t("scriptParameters"))}</span><span>${params.length}</span>
      </button>
      ${params.slice(0, 18).map((param) => `
        <button class="tree-item ${param.name === state.selectedGeneratedParameterName ? "active" : ""}" style="padding-left:84px" type="button" onclick="focusGeneratedParameter(${escapeHtml(jsString(param.name))})">
          <span style="width:12px"></span>${icon("ruler")}<span class="name">${escapeHtml(param.name)}</span>
        </button>
      `).join("")}
      <button class="tree-item" style="padding-left:60px" type="button" onclick="setBottomTab('script')">
        <span style="width:12px"></span>${icon("code")}<span class="name">${escapeHtml(t("cadqueryScript"))}</span>
      </button>
    `;
    $("activeFeature").textContent = t("generatedModel");
    $("latestPatch").textContent = params.length ? `script_parameters:${params.length}` : "agent_generation";
    return;
  }
  const enabled = enabledFeatureIds();
  $("featureTree").innerHTML = ds.features.map((feature) => {
    const depth = featureDepth(feature);
    const active = feature.id === state.selectedFeatureId;
    const inactive = !enabled.has(feature.id);
    const pad = 8 + depth * 18;
    return `
      <button class="tree-item ${active ? "active" : ""} ${inactive ? "inactive" : ""}" style="padding-left:${pad}px" type="button" onclick="selectFeature('${feature.id}')">
        ${depth < 2 ? "<span>⌄</span>" : "<span style='width:12px'></span>"}
        ${featureIcon(feature)}
        <span class="name">${escapeHtml(featureName(feature))}</span>
        ${feature.suppressed ? `<span title="suppressed">${escapeHtml(t("off"))}</span>` : ""}
      </button>
    `;
  }).join("");
  $("activeFeature").textContent = featureName(selectedFeature());
  $("latestPatch").textContent = state.patch ? `${state.patch.op}:${state.patch.name || state.patch.feature_id}` : t("none");
}

function measurementText() {
  const p = state.designState.parameters;
  const featureId = state.selectedFeatureId;
  if (state.measureMode === "diameter") {
    if (featureId === "hole_pattern") return t("measure.holes", { value: formatNumber(p.hole_d) });
    if (featureId === "center_boss") return t("measure.bossOd", { value: formatNumber(p.boss_d) });
    if (featureId === "center_hole") return t("measure.centerHole", { value: formatNumber(p.center_hole_d) });
    return t("measure.diagonal", { value: formatNumber(Math.hypot(p.plate_length, p.plate_width)) });
  }
  if (state.measureMode === "angle") {
    return featureId === "base_plate" ? t("measure.datumAngle") : t("measure.axisAngle");
  }
  if (featureId === "hole_pattern") return t("measure.holeCenters", { x: formatNumber(Math.max(0, p.plate_length - 24)), y: formatNumber(Math.max(0, p.plate_width - 24)) });
  if (featureId === "center_boss") return t("measure.bossHeight", { value: formatNumber(p.boss_h) });
  return t("measure.plateEnvelope", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(p.plate_thickness) });
}

function renderViewport() {
  const ds = state.designState;
  if (!ds) return;
  const p = ds.parameters;
  const feature = selectedFeature();
  const generated = state.previewMode === "generated";
  const generatedParam = generated ? selectedGeneratedParameter() : null;
  $("subtitle").textContent = generated ? t("generatedPreviewSubtitle") : t("designStateVersion", { version: ds.version });
  $("selectionBadge").textContent = generated ? generatedSelectionLabel(generatedParam) : t("featureBadge", { name: featureName(feature) });
  $("headBadge").textContent = generated ? t("agentPreview") : ds.rollback_feature_id ? t("rollbackPreview") : t("headPreview");
  $("measureTitle").textContent = generated ? (generatedParam ? t("selectedParameter") : t("preview")) : t(`modes.${state.measureMode}`);
  $("measureText").textContent = generated ? (generatedParam ? generatedParameterValueText(generatedParam) : state.previewPng ? t("renderedFromCadQuery") : t("waitingGeneratedPreview")) : measurementText();
  const height = p.plate_thickness + (enabledFeatureIds().has("center_boss") ? p.boss_h : 0);
  $("axisReadout").textContent = generated ? t("stepStlStatus", { status: artifactExportStatusLabel() }) : t("axisReadout", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(height) });
  $("viewportContent").innerHTML = generated ? renderGeneratedPreview() : renderModelSvg();
  applyViewportTransform();
}

function renderGeneratedPreview() {
  const selected = selectedGeneratedParameter();
  const callout = selected ? `<div class="generated-selection-callout">
    <strong>${escapeHtml(generatedSelectionLabel(selected))}</strong>
    <span>${escapeHtml(generatedParameterValueText(selected))}</span>
  </div>` : "";
  if (state.previewPng) {
    return `<div class="generated-preview">${callout}<img src="${dataUrl("image/png", state.previewPng)}" alt="Generated CAD preview" /></div>`;
  }
  return `<div class="generated-preview"><div class="generated-placeholder">
    <strong>${escapeHtml(t("generatedPreviewTitle"))}</strong>
    <span>${escapeHtml(t("generatedPreviewHint"))}</span>
  </div></div>`;
}

function renderModelSvg() {
  const ds = state.designState;
  const p = ds.parameters;
  const enabled = enabledFeatureIds();
  const mode = state.viewMode;
  if (mode === "top") return renderTopSvg(p, enabled);
  if (mode === "front") return renderFrontSvg(p, enabled);
  if (mode === "right") return renderRightSvg(p, enabled);
  return renderIsoSvg(p, enabled);
}

function shapeClass(featureId) {
  return `feature-shape ${state.selectedFeatureId === featureId ? "feature-selected" : ""}`;
}

function onShape(featureId) {
  return `onclick="selectGeometry('${featureId}')"`;
}

function svgDefs() {
  return `<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b6fe8"/></marker>
    <linearGradient id="plateTop" x1="0" x2="1"><stop offset="0" stop-color="#90c3f3"/><stop offset="1" stop-color="#4f86f7"/></linearGradient>
    <linearGradient id="plateSide" x1="0" x2="1"><stop offset="0" stop-color="#2363d6"/><stop offset="1" stop-color="#1e4fb8"/></linearGradient>
    <linearGradient id="boss" x1="0" x2="1"><stop offset="0" stop-color="#9ad3bd"/><stop offset="1" stop-color="#5f9f87"/></linearGradient>
  </defs>`;
}

function renderIsoSvg(p, enabled) {
  const selected = state.selectedFeatureId;
  const width = 720;
  const height = 450;
  const cx = 365;
  const cy = 220;
  const sx = Math.min(250, p.plate_length * 4.1);
  const sy = Math.min(168, p.plate_width * 4);
  const thick = Math.max(24, p.plate_thickness * 5);
  const bossR = Math.max(28, p.boss_d * 2.15);
  const bossH = Math.max(22, p.boss_h * 5);
  const top = [
    [cx - sx / 2, cy - sy / 2],
    [cx + sx / 2, cy - sy / 2 - 28],
    [cx + sx / 2 + 62, cy + sy / 2 - 8],
    [cx - sx / 2 + 62, cy + sy / 2 + 20],
  ];
  const bottom = top.map(([x, y]) => [x, y + thick]);
  const points = (arr) => arr.map(([x, y]) => `${x},${y}`).join(" ");
  const holeCenters = [
    [top[0][0] + 48, top[0][1] + 44],
    [top[1][0] - 34, top[1][1] + 42],
    [top[3][0] + 44, top[3][1] - 26],
    [top[2][0] - 42, top[2][1] - 34],
  ];
  const bossCx = cx + 30;
  const bossCy = cy - 10;
  const showBoss = enabled.has("center_boss");
  const showHoles = enabled.has("hole_pattern");
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(t("preview"))}">
    ${svgDefs()}
    <rect width="100%" height="100%" fill="#f6f8fb"/>
    ${grid()}
    <line x1="130" y1="340" x2="620" y2="285" stroke="#f5b84b"/>
    <line x1="130" y1="340" x2="104" y2="150" stroke="#b7eb4a"/>
    <polygon points="${points([top[0], top[1], bottom[1], bottom[0]])}" fill="url(#plateSide)"/>
    <polygon points="${points([top[1], top[2], bottom[2], bottom[1]])}" fill="#2d6fe7"/>
    <polygon class="${shapeClass("base_plate")}" ${onShape("base_plate")} points="${points(top)}" fill="url(#plateTop)" stroke="#2a5bbf"/>
    ${enabled.has("fillet_corners") ? holeCenters.map(([x, y]) => `<ellipse class="${shapeClass("fillet_corners")}" ${onShape("fillet_corners")} cx="${x}" cy="${y}" rx="25" ry="13" fill="#a8b0ba" stroke="#7a8490"/>`).join("") : ""}
    ${showHoles ? holeCenters.map(([x, y]) => `<ellipse class="${shapeClass("hole_pattern")}" ${onShape("hole_pattern")} cx="${x}" cy="${y}" rx="${Math.max(6, p.hole_d * 2.2)}" ry="${Math.max(3.5, p.hole_d * 1.25)}" fill="#39445a" stroke="#182032"/>`).join("") : ""}
    ${showBoss ? `<ellipse class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${bossCx}" cy="${bossCy + bossH}" rx="${bossR}" ry="${bossR * .38}" fill="#4f8f78" opacity=".9"/>
      <rect x="${bossCx - bossR}" y="${bossCy}" width="${bossR * 2}" height="${bossH}" fill="url(#boss)" opacity=".85"/>
      <ellipse class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${bossCx}" cy="${bossCy}" rx="${bossR}" ry="${bossR * .38}" fill="#9bd3bd" stroke="#4e8b75"/>
      ${enabled.has("center_hole") ? `<ellipse class="${shapeClass("center_hole")}" ${onShape("center_hole")} cx="${bossCx}" cy="${bossCy}" rx="${Math.max(18, p.center_hole_d * 2.2)}" ry="${Math.max(7, p.center_hole_d)}" fill="#111827" stroke="#05070c"/>` : ""}` : ""}
    ${state.showBBox ? `<polygon class="bbox" points="${points([[top[0][0]-10, top[0][1]-10], [top[1][0]+10, top[1][1]-10], [bottom[2][0]+10, bottom[2][1]+10], [bottom[3][0]-10, bottom[3][1]+10]])}"/>` : ""}
    ${state.showDims ? isoDims(p, top, bottom, bossCx, bossCy) : ""}
    ${renderFeatureCallouts(p, enabled, {
      base_plate: [top[0][0] + 14, top[0][1] + 10, top[0][0] - 110, top[0][1] - 32],
      fillet_corners: [holeCenters[0][0] - 18, holeCenters[0][1] - 8, holeCenters[0][0] - 108, holeCenters[0][1] - 34],
      hole_pattern: [holeCenters[1][0] + 10, holeCenters[1][1] - 8, holeCenters[1][0] + 56, holeCenters[1][1] - 42],
      center_boss: [bossCx + bossR * .65, bossCy, bossCx + 84, bossCy - 44],
      center_hole: [bossCx + 18, bossCy - 2, bossCx + 58, bossCy - 36],
    })}
  </svg>`;
}

function renderFeatureCallouts(p, enabled, anchors) {
  const featureId = state.selectedFeatureId;
  if (!anchors[featureId] || !enabled.has(featureId)) return "";
  const text = featureCalloutText(p, featureId);
  if (!text) return "";
  return svgCallout(text, ...anchors[featureId]);
}

function featureCalloutText(p, featureId) {
  const mode = state.measureMode;
  if (featureId === "base_plate") {
    if (mode === "distance" && state.showDims) return "";
    if (mode === "angle") return t("callout.datumAngle");
    if (mode === "diameter") return t("callout.diagonal", { value: formatNumber(Math.hypot(p.plate_length, p.plate_width)) });
    return t("callout.plate", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(p.plate_thickness) });
  }
  if (featureId === "fillet_corners") return t("callout.fillet", { value: formatNumber(p.corner_radius) });
  if (featureId === "hole_pattern") {
    if (mode === "distance") return t("callout.spacing", { x: formatNumber(Math.max(0, p.plate_length - 24)), y: formatNumber(Math.max(0, p.plate_width - 24)) });
    if (mode === "angle") return t("callout.holeAxes");
    return t("callout.holeDia", { value: formatNumber(p.hole_d) });
  }
  if (featureId === "center_boss") {
    if (mode === "distance") return t("callout.height", { value: formatNumber(p.boss_h) });
    if (mode === "angle") return t("callout.axis");
    return t("callout.dia", { value: formatNumber(p.boss_d) });
  }
  if (featureId === "center_hole") return t("callout.dia", { value: formatNumber(p.center_hole_d) });
  return "";
}

function svgCallout(text, x, y, labelX, labelY) {
  const width = Math.max(78, Math.min(190, text.length * 7.2 + 18));
  return `
    <line class="dim-line" x1="${x}" y1="${y}" x2="${labelX}" y2="${labelY + 5}"/>
    <rect x="${labelX - 8}" y="${labelY - 18}" width="${width}" height="26" rx="6" fill="rgba(255,255,255,.94)" stroke="#cfe4ff"/>
    <text class="dim-label" x="${labelX}" y="${labelY}">${text}</text>
  `;
}

function grid() {
  let out = "";
  for (let i = -8; i <= 12; i++) {
    out += `<line x1="${60 + i * 48}" y1="390" x2="${260 + i * 48}" y2="110" stroke="#dfe5ee" stroke-width="1"/>`;
    out += `<line x1="${80 + i * 52}" y1="128" x2="${620 + i * 12}" y2="390" stroke="#e6ebf2" stroke-width="1"/>`;
  }
  return out;
}

function isoDims(p, top, bottom, bossCx, bossCy) {
  return `
    <line class="dim-line" x1="${bottom[0][0]}" y1="${bottom[0][1] + 26}" x2="${bottom[1][0]}" y2="${bottom[1][1] + 26}"/>
    <text class="dim-label" x="${(bottom[0][0] + bottom[1][0]) / 2}" y="${(bottom[0][1] + bottom[1][1]) / 2 + 42}">${formatNumber(p.plate_length)} mm</text>
    <line class="dim-line" x1="${bottom[2][0] + 20}" y1="${bottom[2][1]}" x2="${bottom[1][0] + 20}" y2="${bottom[1][1]}"/>
    <text class="dim-label" x="${bottom[2][0] + 34}" y="${(bottom[2][1] + bottom[1][1]) / 2}">${formatNumber(p.plate_width)} mm</text>
    <line class="dim-line" x1="${top[0][0] - 28}" y1="${top[0][1]}" x2="${bottom[0][0] - 28}" y2="${bottom[0][1]}"/>
    <text class="dim-label" x="${top[0][0] - 70}" y="${(top[0][1] + bottom[0][1]) / 2}">${formatNumber(p.plate_thickness)} mm</text>
  `;
}

function renderTopSvg(p, enabled) {
  const w = 720, h = 450, x = 180, y = 110, plateW = 360, plateH = 230;
  const holes = [[x+58,y+52],[x+plateW-58,y+52],[x+58,y+plateH-52],[x+plateW-58,y+plateH-52]];
  return `<svg viewBox="0 0 ${w} ${h}">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" rx="${enabled.has("fillet_corners") ? Math.max(6, p.corner_radius * 3) : 2}" fill="#6faaf5" stroke="#2a5bbf"/>
    ${enabled.has("hole_pattern") ? holes.map(([hx, hy]) => `<circle class="${shapeClass("hole_pattern")}" ${onShape("hole_pattern")} cx="${hx}" cy="${hy}" r="${Math.max(7, p.hole_d * 2.8)}" fill="#39445a"/>`).join("") : ""}
    ${enabled.has("center_boss") ? `<circle class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${x+plateW/2}" cy="${y+plateH/2}" r="${Math.max(35, p.boss_d * 2.2)}" fill="#8bc6ad" stroke="#4e8b75"/>
      ${enabled.has("center_hole") ? `<circle class="${shapeClass("center_hole")}" ${onShape("center_hole")} cx="${x+plateW/2}" cy="${y+plateH/2}" r="${Math.max(12, p.center_hole_d * 2.2)}" fill="#111827"/>` : ""}` : ""}
    ${state.showBBox ? `<rect class="bbox" x="${x-8}" y="${y-8}" width="${plateW+16}" height="${plateH+16}"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-22}" y="${y+plateH+57}">${formatNumber(p.plate_length)} mm</text><line class="dim-line" x1="${x+plateW+34}" y1="${y}" x2="${x+plateW+34}" y2="${y+plateH}"/><text class="dim-label" x="${x+plateW+48}" y="${y+plateH/2}">${formatNumber(p.plate_width)} mm</text>` : ""}
    ${renderFeatureCallouts(p, enabled, {
      base_plate: [x + 10, y + 10, x + 24, y - 28],
      fillet_corners: [x + 8, y + 8, x + 28, y - 28],
      hole_pattern: [holes[1][0], holes[1][1], holes[1][0] + 36, holes[1][1] - 32],
      center_boss: [x + plateW / 2 + Math.max(35, p.boss_d * 2.2), y + plateH / 2, x + plateW / 2 + 76, y + plateH / 2 - 56],
      center_hole: [x + plateW / 2 + 12, y + plateH / 2, x + plateW / 2 + 52, y + plateH / 2 + 62],
    })}
  </svg>`;
}

function renderFrontSvg(p, enabled) {
  const x = 150, y = 250, plateW = 420, plateH = Math.max(34, p.plate_thickness * 5);
  const bossH = Math.max(30, p.boss_h * 6), bossW = Math.max(100, p.boss_d * 5);
  return `<svg viewBox="0 0 720 450">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" fill="#4f86f7" stroke="#2a5bbf"/>
    ${enabled.has("center_boss") ? `<rect class="${shapeClass("center_boss")}" ${onShape("center_boss")} x="${x+plateW/2-bossW/2}" y="${y-bossH}" width="${bossW}" height="${bossH}" fill="url(#boss)" stroke="#4e8b75"/>` : ""}
    ${state.showBBox ? `<rect class="bbox" x="${x-10}" y="${enabled.has("center_boss") ? y-bossH-10 : y-10}" width="${plateW+20}" height="${plateH+(enabled.has("center_boss") ? bossH : 0)+20}"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-22}" y="${y+plateH+58}">${formatNumber(p.plate_length)} mm</text>` : ""}
  </svg>`;
}

function renderRightSvg(p, enabled) {
  const x = 190, y = 250, plateW = 340, plateH = Math.max(34, p.plate_thickness * 5);
  const bossH = Math.max(30, p.boss_h * 6), bossW = Math.max(100, p.boss_d * 5);
  return `<svg viewBox="0 0 720 450">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" fill="#4f86f7" stroke="#2a5bbf"/>
    ${enabled.has("center_boss") ? `<rect class="${shapeClass("center_boss")}" ${onShape("center_boss")} x="${x+plateW/2-bossW/2}" y="${y-bossH}" width="${bossW}" height="${bossH}" fill="url(#boss)" stroke="#4e8b75"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-20}" y="${y+plateH+58}">${formatNumber(p.plate_width)} mm</text>` : ""}
  </svg>`;
}

function renderProperties() {
  const ds = state.designState;
  const feature = selectedFeature();
  if (!ds || !feature) return;
  if (state.previewMode === "generated") {
    $("properties").innerHTML = `
      <div class="properties-head">
        <div class="feature-meta">
          <div><strong>${escapeHtml(t("generatedModel"))}</strong><span>${escapeHtml(t("agent"))} · ${state.previewPng ? escapeHtml(t("previewReady")) : escapeHtml(t("waiting"))}</span></div>
          <div class="version-pill">AI</div>
        </div>
        <div class="rename-row">

function artifactCards() {
  const artifacts = [
    ["step", "artifact.stepTitle", ".step", "artifact.sandboxExport", "ready", true],
    ["stl", "artifact.stlTitle", ".stl", "artifact.sandboxExport", "ready", true],
    ["feature_tree", "artifact.featureTreeTitle", ".json", "artifact.liveJson", "ready", true],
    ["fcstd", "artifact.fcstdTitle", ".FCStd", "artifact.plannedFreecad", "planned", false],
    ["pdf", "artifact.pdfTitle", ".pdf", "artifact.plannedTechdraw", "planned", false],
    ["svg", "artifact.svgTitle", ".svg", "artifact.plannedProjection", "planned", false],
  ];
  return artifacts.map(([key, titleKey, ext, detailKey, readyStatus, implemented]) => {
    const value = key === "feature_tree" ? btoa(unescape(encodeURIComponent(JSON.stringify(exportStateSnapshot(), null, 2)))) : state.artifacts[key];
    const status = value ? readyStatus : (implemented ? "notReady" : "planned");
    const href = value ? dataUrl(key === "stl" ? "model/stl" : key === "feature_tree" ? "application/json" : "application/step", value) : "";
    const download = key === "feature_tree" ? "feature-tree.json" : `model.${key}`;
    return `<article class="artifact-card">
      <div>
        <div class="artifact-title"><span>${escapeHtml(t(titleKey))}</span><span class="artifact-ext">${escapeHtml(ext)}</span></div>
        <span class="artifact-detail">${escapeHtml(t(detailKey))}</span>
      </div>
      ${href ? `<a href="${href}" download="${download}">${escapeHtml(t("download"))}</a>` : `<span class="badge ${status === "planned" ? "planned" : "queued"}">${escapeHtml(t(`artifact.${status}`))}</span>`}
    </article>`;
  });
}

async function commitParameter(name, value) {
  const patch = { op: "update_parameter", name, value: clampParameter(name, value) };
  await applyPatches(
    [patch],
    t("history.parameterPanel", { name: parameterLabel(name) }),
    `${parameterLabel(name)} = ${formatNumber(patch.value)} ${t("unitMm")}`
  );
}

async function commitGeneratedParameter(name, rawValue) {
  const value = Number(rawValue);
  if (!Number.isFinite(value) || !state.script) return false;
  const param = (state.generatedParameters || []).find((item) => item.name === name);
  const unit = param ? generatedParameterUnit(param) : t("unitMm");
  const previous = {
    script: state.script,
    previewPng: state.previewPng,
    artifacts: { ...state.artifacts },
    generatedParameters: [...(state.generatedParameters || [])],
    exportStatus: state.exportStatus,
    patch: state.patch,
  };

  $("applyButton").disabled = true;
  state.patch = { op: "update_script_parameter", name, value };
  state.exportStatus = "rendering";
  state.previewPng = null;
  setStatus("updatingPreview");
  renderAll();

  try {
    const rendered = await fetchJson("/api/script/patch", {
      script: previous.script,
      patches: [{ name, value }],
    });
    if (!rendered.ok) throw new Error(rendered.error || t("log.unknownError"));
    state.previewMode = "generated";
    state.script = rendered.script;
    state.generatedParameters = rendered.parameters || [];
    state.selectedGeneratedParameterName = name;
    state.previewPng = rendered.preview_png_b64 || null;
    state.artifacts = rendered.exports || {};
    state.exportStatus = "ready";
    addHistory(
      t("history.scriptParameter", { name }),
      t("history.scriptParameterDetail", { name, value: formatNumber(value), unit })
    );
    log(t("log.scriptParameterUpdated", { name, value: formatNumber(value), unit }));
    setStatus("previewExportReady");
    return true;
  } catch (error) {
    state.script = previous.script;
    state.previewPng = previous.previewPng;
    state.artifacts = previous.artifacts;
    state.generatedParameters = previous.generatedParameters;
    state.exportStatus = previous.exportStatus;
    state.patch = previous.patch;
    setStatus("patchFailed");
    log(t("log.scriptPatchFailed", { message: error.message }));
    return false;
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

async function applyPatches(patches, label, detail) {
  state.previewMode = "design_state";
  state.generatedPrompt = "";
  state.selectedGeneratedParameterName = "";
  setStatus("applyingPatch");
  try {
    const patched = await fetchJson("/api/design/patch", {
      design_state: state.designState,
      patches,
    });
    state.designState = patched.design_state;
    state.selectedFeatureId = state.designState.selected_feature_id;
    state.script = patched.script;
    state.patch = patches[patches.length - 1] || null;
    addHistory(label, detail);
    await renderDesign();
  } catch (error) {
    setStatus("patchFailed");
    log(t("log.patchFailed", { message: error.message }));
  }
  renderAll();
}

async function renderDesign() {
  setStatus("updatingPreview");
  state.exportStatus = "rendering";
  try {
    const rendered = await fetchJson("/api/design/render", { design_state: state.designState });
    state.script = rendered.script;
    if (rendered.preview_png_b64) state.previewPng = rendered.preview_png_b64;
    if (rendered.exports) state.artifacts = { ...state.artifacts, ...rendered.exports };
    state.exportStatus = rendered.ok ? "ready" : "unavailable";
    if (!rendered.ok) log(t("log.exportUnavailable", { message: rendered.error || t("log.unknownError") }));
    setStatus(rendered.ok ? "previewExportReady" : "previewUpdated");
  } catch (error) {
    state.exportStatus = "unavailable";
    setStatus("previewUpdated");
    log(t("log.exportUnavailable", { message: error.message }));
  }
}

function parseConversationalPatch(text) {
  const normalized = text.toLowerCase();
  const exact = normalized.match(/\b(plate_length|plate_width|plate_thickness|corner_radius|hole_d|boss_d|boss_h|center_hole_d)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if (exact) return { op: "update_parameter", name: exact[1], value: clampParameter(exact[1], Number(exact[2])) };
  const value = extractCommandValue(text);
  if (value === null) return null;
  const pairs = [
    ["center_hole_d", [/中心孔/, /center\s*hole/]],
    ["hole_d", [/孔/, /hole/, /holes/, /孔径/, /diameter/]],
    ["boss_d", [/boss.*d/, /boss.*diameter/, /凸台.*直径/, /凸台.*d/]],
    ["boss_h", [/boss.*h/, /boss.*height/, /凸台.*高度/, /凸台.*h/]],
    ["plate_length", [/plate_length/, /length/, /长度/, /长/]],
    ["plate_width", [/plate_width/, /width/, /宽度/, /宽/]],
    ["plate_thickness", [/plate_thickness/, /thickness/, /厚度/, /厚/]],
    ["corner_radius", [/corner/, /fillet/, /radius/, /圆角/, /倒角/]],
  ];
  const found = pairs.find(([, patterns]) => patterns.some((pattern) => pattern.test(normalized)));
  if (!found) return null;
  return { op: "update_parameter", name: found[0], value: clampParameter(found[0], value) };
}

function parseGeneratedParameterPatch(text) {
  const params = state.generatedParameters || [];
  if (!params.length) return null;
  const exact = text.match(/\b([A-Za-z_]\w*)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if (exact) {
    const target = params.find((param) => param.name.toLowerCase() === exact[1].toLowerCase());
    if (target) return { name: target.name, value: Number(exact[2]) };
  }

  const value = extractCommandValue(text);
  if (value === null) return null;
  const target = bestGeneratedParameterMatch(text, params);
  return target ? { name: target.name, value } : null;
}

function bestGeneratedParameterMatch(text, params) {
  const normalized = text.toLowerCase();
  const compactText = normalized.replace(/[\s_-]+/g, "");
  const dimension = requestedDimension(normalized);
  let best = null;
  for (const param of params) {
    const name = String(param.name || "");
    const lowerName = name.toLowerCase();
    const label = generatedParameterLabel(param).toLowerCase();
    const compactName = lowerName.replace(/[\s_-]+/g, "");
    let score = 0;

    if (normalized.includes(lowerName) || compactText.includes(compactName)) score += 120;
    score += componentScore(normalized, lowerName);
    if (dimension) score += dimensionScore(lowerName, label, dimension);
    if (dimension === "length" || dimension === "width" || dimension === "depth") {
      score += primarySizeBonus(param, params);
    }
    if (dimension === "height") score += verticalSizeBonus(param, params);

    if (!best || score > best.score) best = { param, score };
  }
  return best && best.score >= 30 ? best.param : null;
}

function requestedDimension(normalized) {
  const checks = [
    ["diameter", /直径|孔径|diam|diameter/],
    ["radius", /半径|圆角|radius|rad/],
    ["thickness", /厚度|厚|thick|thickness/],
    ["height", /高度|高|height/],
    ["depth", /深度|进深|depth|deep/],
    ["gap", /间隙|间距|缝|gap|spacing|space/],
    ["count", /数量|个数|几个|count|number|qty|num/],
    ["length", /长度|长|length|long/],
    ["width", /宽度|宽|width|wide/],
  ];
  return checks.find(([, pattern]) => pattern.test(normalized))?.[0] || null;
}

function componentScore(normalized, name) {
  const checks = [
    [/沙发|sofa/, /(^|_)sofa($|_)/],
    [/座|坐垫|座垫|seat/, /seat|cushion/],
    [/靠背|背|back/, /back/],
    [/扶手|arm/, /arm/],
    [/腿|脚|leg/, /leg/],
    [/垫|cushion/, /cushion/],
  ];
  return checks.reduce((total, [textPattern, namePattern]) => {
    return total + (textPattern.test(normalized) && namePattern.test(name) ? 35 : 0);
  }, 0);
}

function dimensionScore(name, label, dimension) {
  const haystack = `${name} ${label}`;
  const byDimension = {
    length: [/length|len|long|(?:^|_)l(?:$|_|\b)|\bl\b/, 65, /width|(?:^|_)w(?:$|_|\b)|\bw\b/, 35],
    width: [/width|wide|(?:^|_)w(?:$|_|\b)|\bw\b/, 65, /length|len|(?:^|_)l(?:$|_|\b)|\bl\b/, 25],
    depth: [/depth|deep|(?:^|_)d(?:$|_|\b)|\bd\b/, 65],
    height: [/height|(?:^|_)h(?:$|_|\b)|\bh\b/, 65],
    thickness: [/thick|thickness|(?:^|_)t(?:$|_|\b)|\bt\b/, 65],
    diameter: [/diam|dia|hole|(?:^|_)d(?:$|_|\b)|\bd\b/, 65],
    radius: [/radius|rad|(?:^|_)r(?:$|_|\b)|\br\b/, 65],
    gap: [/gap|spacing|space/, 65],
    count: [/count|num|qty|(?:^|_)n(?:$|_|\b)|\bn\b/, 65],
  };
  const rules = byDimension[dimension] || [];
  let score = 0;
  for (let i = 0; i < rules.length; i += 2) {
    if (rules[i].test(haystack)) score += rules[i + 1];
  }
  return score;
}

function primarySizeBonus(param, params) {
  const values = params.map((item) => Number(item.value)).filter(Number.isFinite);
  const max = Math.max(...values, 1);
  const value = Number(param.value);
  return Number.isFinite(value) ? Math.min(25, (value / max) * 25) : 0;
}

function verticalSizeBonus(param, params) {
  const heights = params
    .filter((item) => /height|(^|_)h($|_)/.test(String(item.name || "").toLowerCase()))
    .map((item) => Number(item.value))
    .filter(Number.isFinite);
  const max = Math.max(...heights, 1);
  const value = Number(param.value);
  return Number.isFinite(value) ? Math.min(20, (value / max) * 20) : 0;
}

function extractCommandValue(text) {
  const unitMatches = [...text.matchAll(/(-?\d+(?:\.\d+)?)\s*(?:mm|毫米)/gi)];
  if (unitMatches.length) return Number(unitMatches[unitMatches.length - 1][1]);
  const targetMatch = text.match(/(?:改成|改为|设为|设置为|变成|to|at)\s*(-?\d+(?:\.\d+)?)/i);
  if (targetMatch) return Number(targetMatch[1]);
  const numbers = [...text.matchAll(/-?\d+(?:\.\d+)?/g)];
  if (!numbers.length) return null;
  return Number(numbers[numbers.length - 1][0]);
}

async function submitCommand(event) {
  event.preventDefault();
  const input = $("commandInput");
  const text = input.value.trim();
  if (!text) return;
  const generatedPatch = state.previewMode === "generated" ? parseGeneratedParameterPatch(text) : null;
  const patch = state.previewMode === "generated" ? null : parseConversationalPatch(text);
  input.value = "";
  state.chatMessages.unshift({ role: "user", text });
  setBottomTab("chat");
  if (generatedPatch) {
    const ok = await commitGeneratedParameter(generatedPatch.name, generatedPatch.value);
    if (ok) {
      const param = (state.generatedParameters || []).find((item) => item.name === generatedPatch.name);
      const unit = param ? generatedParameterUnit(param) : t("unitMm");
      state.chatMessages.unshift({
        role: "assistant",
        key: "chat.appliedGeneratedParameter",
        vars: {
          name: generatedPatch.name,
          value: formatNumber(generatedPatch.value),
          unit,
        },
      });
      setBottomTab("chat");
      renderAll();
    }
    return;
  }
  if (patch) {
    await applyPatches(
      [patch],
      t("history.conversation", { name: parameterLabel(patch.name) }),
      `${parameterLabel(patch.name)} = ${formatNumber(patch.value)} ${t("unitMm")}`
    );
    state.chatMessages.unshift({ role: "assistant", key: "chat.appliedPatch", vars: { name: parameterLabel(patch.name), value: formatNumber(patch.value) } });
    setBottomTab("chat");
    return;
  }
  await generateFromPrompt(text);
}

async function generateFromPrompt(prompt) {
  $("applyButton").disabled = true;
  state.previewMode = "generated";
  state.generatedPrompt = prompt;
  state.generatedParameters = [];
  state.selectedGeneratedParameterName = "";
  state.previewPng = null;
  state.artifacts = {};
  state.exportStatus = "notReady";
  state.patch = null;
  setBottomTab("logs");
  setStatus("submitting");
  let resp;
  try {
    for (let attempt = 0; attempt < 20; attempt++) {
      resp = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, history: state.chatHistory }),
      });
      if (resp.status !== 503) break;
      setStatus("waking", { attempt: attempt + 1 });
      await new Promise((r) => setTimeout(r, 3000));
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const sawDone = await readSse(resp, prompt);
    if (!sawDone) {
      setStatus("failed");
      log(t("log.streamEndedWithoutDone"));
      state.chatMessages.unshift({ role: "assistant", key: "chat.generationBad" });
      if (!state.previewPng) state.previewMode = "design_state";
    }
  } catch (error) {
    setStatus("generationFailed");
    log(t("chat.generationFailed", { message: error.message }));
    state.chatMessages.unshift({ role: "assistant", key: "chat.generationFailed", vars: { message: error.message } });
    if (!state.previewPng) state.previewMode = "design_state";
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

async function readSse(resp, prompt) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let lastScript = null;
  let sawDone = false;
  const processFrame = (frame) => {
    const dataLine = frame.split("\n").find((line) => line.startsWith("data: "));
    if (!dataLine) return;
    const ev = JSON.parse(dataLine.slice(6));
    handleAgentEvent(ev);
    if (ev.type === "script") lastScript = ev.script;
    if (ev.type === "done") sawDone = true;
  };
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const frames = buffer.split("\n\n");
    buffer = frames.pop();
    for (const frame of frames) {
      processFrame(frame);
    }
  }
  buffer += decoder.decode();
  if (buffer.trim()) processFrame(buffer);
  state.chatHistory.push({ role: "user", content: prompt });
  if (lastScript) {
    state.chatHistory.push({ role: "assistant", content: "```python\n" + lastScript + "\n```" });
  }
  return sawDone;
}

function handleAgentEvent(ev) {
  if (ev.type === "status") setStatus(ev.message);
  if (ev.type === "script") {
    state.script = ev.script;
    state.generatedParameters = Array.isArray(ev.parameters) ? ev.parameters : [];
    if (!state.generatedParameters.some((param) => param.name === state.selectedGeneratedParameterName)) {
      state.selectedGeneratedParameterName = "";
    }
    log(t("log.producedScript", { attempt: ev.attempt || 1 }));
  }
  if (ev.type === "retry") log(t("log.retry", { attempt: ev.attempt, message: ev.message }));
  if (ev.type === "preview" && ev.png_b64) {
    state.previewMode = "generated";
    state.previewPng = ev.png_b64;
    log(t("log.renderedPreview"));
    renderViewport();
  }
  if (ev.type === "artifact") {
    state.artifacts[ev.format] = ev.data_b64;
    if (hasStepStlArtifacts()) state.exportStatus = "ready";
    log(t("log.artifactReady", { format: ev.format }));
  }
  if (ev.type === "error") {
    log(ev.message);
  }
  if (ev.type === "done") {
    if (ev.ok && hasStepStlArtifacts()) state.exportStatus = "ready";
    setStatus(ev.ok ? "done" : "failed");
    addHistory(ev.ok ? t("history.agentGeneration") : t("history.agentGenerationFailed"), ev.ok ? t("history.agentDetail") : t("history.agentFailedDetail"));
    state.chatMessages.unshift({ role: "assistant", key: ev.ok ? "chat.generationOk" : "chat.generationBad" });
    if (!ev.ok && !state.previewPng) state.previewMode = "design_state";
  }
  renderBottom();
}

function applyViewportTransform() {
  const v = state.viewport;
  $("viewportContent").style.transform = `translate(calc(-50% + ${v.tx}px), calc(-50% + ${v.ty}px)) scale(${v.scale})`;
}

function installViewportGestures() {
  const viewport = $("viewport");
  viewport.addEventListener("wheel", (event) => {
    event.preventDefault();
    const next = state.viewport.scale * (event.deltaY < 0 ? 1.08 : 0.92);
    state.viewport.scale = Math.min(3.5, Math.max(.5, next));
    applyViewportTransform();
  }, { passive: false });
  viewport.addEventListener("pointerdown", (event) => {
    state.viewport.dragging = true;
    state.viewport.x = event.clientX;
    state.viewport.y = event.clientY;
    viewport.classList.add("dragging");
    viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener("pointermove", (event) => {
    if (!state.viewport.dragging) return;
    state.viewport.tx += event.clientX - state.viewport.x;
    state.viewport.ty += event.clientY - state.viewport.y;
    state.viewport.x = event.clientX;
    state.viewport.y = event.clientY;
    applyViewportTransform();
  });
  viewport.addEventListener("pointerup", () => {
    state.viewport.dragging = false;
    viewport.classList.remove("dragging");
  });
}

async function init() {
  renderStaticText();
  $("commandForm").addEventListener("submit", submitCommand);
  installViewportGestures();
  try {
    const initial = await fetchJson("/api/design/initial");
    state.designState = initial.design_state;
    state.script = initial.script;
    state.selectedFeatureId = state.designState.selected_feature_id;
    addHistory(t("history.initialTitle"), t("history.initialDetail"));
    setStatus("ready");
  } catch (error) {
    setStatus("initialUnavailable");
    log(t("log.initialFailed", { message: error.message }));
    state.designState = fallbackDesignState();
  }
  renderAll();
}

function fallbackDesignState() {
  return {
    schema_version: "4yi-cad.design/v1",
    version: 1,
    parameters: {
      plate_length: 60, plate_width: 40, plate_thickness: 8, corner_radius: 5,
      hole_d: 4.5, boss_d: 20, boss_h: 6, center_hole_d: 8,
    },
    features: [
      { id: "design", parent_id: null, name: "Design", kind: "document", parameters: [], suppressible: false, suppressed: false },
      { id: "body", parent_id: "design", name: "Body", kind: "body", parameters: [], suppressible: false, suppressed: false },
      { id: "base_plate", parent_id: "body", name: "Base plate", kind: "solid", parameters: ["plate_length", "plate_width", "plate_thickness"], suppressible: false, suppressed: false },
      { id: "fillet_corners", parent_id: "body", name: "Fillet corners", kind: "operation", parameters: ["corner_radius"], suppressible: true, suppressed: false },
      { id: "hole_pattern", parent_id: "body", name: "Hole pattern", kind: "pattern", parameters: ["hole_d"], suppressible: true, suppressed: false },
      { id: "center_boss", parent_id: "body", name: "Center boss", kind: "solid", parameters: ["boss_d", "boss_h"], suppressible: true, suppressed: false },
      { id: "center_hole", parent_id: "center_boss", name: "Center hole", kind: "cut", parameters: ["center_hole_d"], suppressible: true, suppressed: false },
    ],
    active_feature_id: "center_hole",
    selected_feature_id: "base_plate",
    rollback_feature_id: null,
  };
}

window.selectFeature = selectFeature;
window.selectGeometry = selectGeometry;
window.setView = setView;
window.toggleBBox = toggleBBox;
window.toggleDims = toggleDims;
window.toggleExplode = toggleExplode;
window.setSelectionMode = setSelectionMode;
window.setMeasureMode = setMeasureMode;
window.setBottomTab = setBottomTab;
window.commitParameter = commitParameter;
window.commitGeneratedParameter = commitGeneratedParameter;
window.renameFeature = renameFeature;
window.toggleFeature = toggleFeature;
window.showParametricDesign = showParametricDesign;
window.showGeneratedModel = showGeneratedModel;
window.showGeneratedParameters = showGeneratedParameters;
window.focusGeneratedParameter = focusGeneratedParameter;

init();
</script>
