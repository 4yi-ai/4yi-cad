async function createAssemblyJointFromSelectedConnectors(jointType, objectName, reference, stableId = "") {
  const obj = freeCadObjectByName(objectName);
  const item = obj ? freeCadSubelementByRef(obj, reference, stableId) : null;
  const connector = freeCadConnectorFromSelection(obj, reference, item?.group || item?.kind || "", item);
  const anchor = state.assemblyConnectorAnchor;
  if (!connector || !anchor || !freeCadConnectorStillExists(anchor)) return false;
  if (freeCadConnectorSame(anchor, connector) || freeCadConnectorObjectSame(anchor, connector)) return false;
  const assembly = firstFreeCadAssembly();
  const assemblyName = assembly?.name || "Assembly";
  const assemblySelector = assembly ? freeCadObjectSelector(assembly) : { name: assemblyName };
  const patches = [];
  if (!assembly) {
    patches.push({
      op: "create_assembly",
      name: assemblyName,
    });
  }
  [anchor, connector].forEach((item) => {
    patches.push({
      op: "add_part_to_assembly",
      selector: assemblySelector,
      part_selector: item.selector || { name: item.objectName },
    });
  });
  const jointPatch = {
    op: "create_joint",
    selector: assemblySelector,
    joint_type: jointType,
    name: freeCadGeneratedName([jointType, anchor.objectName, connector.objectName, "Joint"], "Joint"),
    connector1: assemblyConnectorPayload(anchor),
    connector2: assemblyConnectorPayload(connector),
    solve: true,
  };
  if (jointType === "distance") {
    const distance = assemblyConnectorDistance(anchor, connector);
    if (distance !== null) jointPatch.distance = distance;
  }
  if (jointType === "angle") {
    jointPatch.angle_degrees = 0;
  }
  patches.push(jointPatch);
  state.selectedFreeCadObjectName = freeCadObjectKey(obj);
  state.selectedFreeCadSubelement = {
    objectName: freeCadObjectKey(obj),
    reference: item?.reference || reference,
    stableId: freeCadSubelementStableId(item) || stableId || "",
    legacyStableId: freeCadSubelementLegacyStableId(item),
    stableReference: freeCadSubelementStableReference(item),
    signature: freeCadSubelementSignature(item),
    signatureVersion: freeCadSubelementSignatureVersion(item),
    stability: freeCadSubelementStability(item),
    kind: connector.kind,
    selector: freeCadObjectSelector(obj),
  };
  const patch = {
    patches,
    name: `${jointType}Joint:${freeCadConnectorDisplayName(anchor)}->${freeCadConnectorDisplayName(connector)}`,
  };
  const ok = await applyFreeCadDocumentPatch(patch, freeCadPatchDetail(patch));
  if (ok) {
    state.selectedFreeCadAssemblyJoint = { assemblyName, jointName: jointPatch.name };
    state.assemblyConnectorAnchor = null;
    persistWorkbenchSession();
    renderAll();
  }
  return ok;
}

async function commitFreeCadJointScalar(assemblyName, jointName, scalar, rawValue) {

  const update = freeCadAssemblyJointPatchBase(selected.assembly, selected.joint);
  if (scalar === "angle") {
    update.angle_degrees = value;
  } else {
    update.distance = value;
  }
  const patch = {

    name: `${freeCadJointDisplayName(selected.joint)}.${scalar}`,
    value,
    unit: scalar === "angle" ? "deg" : t("unitMm"),

function assemblyConnectorPayloadFromJointReference(reference) {
  if (!reference || typeof reference !== "object") return null;
  const obj = reference.object || reference.part || {};
  const selector = obj.name ? { name: obj.name } : obj.label ? { label: obj.label } : null;
  if (!selector) return null;
  const subelements = Array.isArray(reference.subelements)
    ? reference.subelements.filter(Boolean)
    : [reference.element, reference.reference, reference.vertex].filter(Boolean);
  const payload = { selector };
  const vertex = subelements.find((item) => /^vertex/i.test(String(item)));
  const element = subelements.find((item) => !/^vertex/i.test(String(item)));
  if (element) payload.element = element;
  if (vertex) payload.vertex = vertex;
  const frame = reference.connector_frame || reference.connectorFrame || {};
  const stableId = frame.stable_id || frame.stableId || "";
  const stableReference = frame.stable_reference || frame.stableReference || "";
  const signature = frame.signature || null;
  if (stableId) {
    if (vertex && !element) payload.stable_ids = ["", stableId];
    else payload.stable_id = stableId;
  }
  if (stableReference) {
    if (vertex && !element) payload.stable_references = ["", stableReference];
    else payload.stable_reference = stableReference;
  }
  if (signature) {
    if (vertex && !element) payload.stable_signatures = [null, signature];
    else payload.signature = signature;
  }
  return payload;
}

async function commitFreeCadJointConnector(assemblyName, jointName, slot) {
  const selected = selectedFreeCadAssemblyJointOrName(assemblyName, jointName);
  const anchor = state.assemblyConnectorAnchor;
  if (!selected || !anchor || !freeCadConnectorStillExists(anchor)) return false;
  const connector1 = assemblyConnectorPayloadFromJointReference(selected.joint.reference1);
  const connector2 = assemblyConnectorPayloadFromJointReference(selected.joint.reference2);
  if (!connector1 || !connector2) return false;
  const anchorPayload = assemblyConnectorPayload(anchor);
  const update = freeCadAssemblyJointPatchBase(selected.assembly, selected.joint);
  update.connector1 = slot === 1 ? anchorPayload : connector1;
  update.connector2 = slot === 2 ? anchorPayload : connector2;
  const patch = {
    patches: [update],
    name: `${freeCadJointDisplayName(selected.joint)}.connector${slot}`,
  };
  state.selectedFreeCadAssemblyJoint = { assemblyName: freeCadAssemblyKey(selected.assembly), jointName: freeCadJointKey(selected.joint) };
  const ok = await applyFreeCadDocumentPatch(patch, freeCadPatchDetail(patch));
  if (ok) {
    state.assemblyConnectorAnchor = null;
    persistWorkbenchSession();
    renderAll();
  }
  return ok;
}

async function commitFreeCadSketchGeometryPoint(objectName, geometryIndex, pointRole, axisIndex, rawValue) {
  const obj = freeCadObjectByName(objectName);
  const value = Number(rawValue);
  if (!obj || !freeCadObjectIsSketch(obj) || !Number.isFinite(value) || !Number.isFinite(Number(geometryIndex))) return false;
  const geometry = (Array.isArray(obj.sketch?.geometry) ? obj.sketch.geometry : [])
    .find((item) => Number(item.index) === Number(geometryIndex));
  const point = freeCadTriplet(geometry?.[pointRole]);
  const numericAxis = Number(axisIndex);
  if (!geometry || !point || numericAxis < 0 || numericAxis > 2) return false;
  point[numericAxis] = value;
  return previewAndCommitFreeCadSketchGeometryPointValue(objectName, geometryIndex, pointRole, point);
}

async function parseServerFreeCadDocumentPatch(text) {

function parseConversationalPatch(text) {
  const normalized = text.toLowerCase();
  const exact = normalized.match(/\b(plate_length|plate_width|plate_thickness|corner_radius|hole_d|boss_d|boss_h|center_hole_d)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if (exact) return { op: "update_parameter", name: exact[1], value: clampParameter(exact[1], Number(exact[2])) };
  const value = extractCommandValue(text);
  if (value === null) return null;
  const pairs = [
    ["center_hole_d", [/中心孔/, /center\s*hole/]],
    ["hole_d", [/孔/, /hole/, /holes/, /孔径/, /diameter/]],
    ["boss_d", [/boss.*d/, /boss.*diameter/, /凸台.*直径/, /凸台.*d/]],
    ["boss_h", [/boss.*h/, /boss.*height/, /凸台.*高度/, /凸台.*h/]],
    ["plate_length", [/plate_length/, /length/, /长度/, /长/]],
    ["plate_width", [/plate_width/, /width/, /宽度/, /宽/]],
    ["plate_thickness", [/plate_thickness/, /thickness/, /厚度/, /厚/]],
    ["corner_radius", [/corner/, /fillet/, /radius/, /圆角/, /倒角/]],
  ];
  const found = pairs.find(([, patterns]) => patterns.some((pattern) => pattern.test(normalized)));
  if (!found) return null;
  return { op: "update_parameter", name: found[0], value: clampParameter(found[0], value) };
}

function shouldRequestScriptRewrite(text) {
  if (!state.script) return false;
  const normalized = text.toLowerCase();
  if (/modeling\s+method|construction\s+method|建模(方法|方式)|改用/.test(normalized)) return true;
  const topologyVerb = /\b(add|insert|remove|delete|drill|bore|cut|replace|switch|convert)\b|新增|添加|增加|加入|插入|删除|去掉|移除|钻|开孔/;
  const topologyNoun = /(holes?|boss|rib|slot|pocket|cutout|counterbore|countersink|pattern|feature|sketch|loft|sweep|revolve|shell|孔|凸台|筋|肋|槽|开口|沉孔|阵列|特征|草图|放样|扫掠|旋转|抽壳)/;
  if (topologyVerb.test(normalized) && topologyNoun.test(normalized)) return true;
  if (/\b(change|set|make)\b.*\b(?:to\s+)?\d+\s+holes?\b/.test(normalized)) return true;
  if (/改成\s*\d+\s*个孔|改为\s*\d+\s*个孔/.test(normalized)) return true;
  return false;
}

function hasActiveGeneratedModel() {
  return state.previewMode === "generated" && Boolean(state.script || state.previewPng || hasInteractiveViewerArtifact());
}

function isExplicitNewModelPrompt(text) {
  const normalized = text.toLowerCase();
  return /新(建|的)?\s*(会话|模型|设计|项目|方案)|重新(设计|生成|开始)|从头(开始|来|做)|重置(当前)?(会话|模型|设计)?|清空(当前)?(会话|模型|设计)?|换(一个|个)(新)?(模型|设计|方案)|\b(start\s+over|from\s+scratch)\b|\breset\s+(?:the\s+)?(?:session|model|design)\b|\bnew\s+(?:session|model|design)\b|\b(?:create|generate|make)\s+(?:me\s+)?a\s+new\b/.test(normalized);
}

function commandModeForAgent(text, rewriteScript) {
  if (rewriteScript) return "rewrite";
  if (hasActiveGeneratedModel() && !isExplicitNewModelPrompt(text)) return "rewrite";
  return "create";
}

function buildScriptRewritePrompt(instruction) {
  return [
    "Continue editing the current CAD model. Rewrite the current CAD script for the user request; do not start a new unrelated design.",
    `User edit: ${instruction}`,
    `Current model brief: ${state.generatedPrompt || "existing generated CAD model"}`,
    `Current engine: ${state.engine}. Use the same engine unless the edit explicitly requires another engine.`,
    "Return one complete script by calling the appropriate CAD tool. Preserve the current model, named parameters, dimensions, and existing objects where practical; change only what the user requested.",
    "Current script:",
    "```python",
    state.script,
    "```",
  ].join("\n");
}

function isCreateOrScenePrompt(text) {
  const normalized = text.toLowerCase();
  const editVerb = /改成|改为|设为|设置为|变成|调整|修改|更新|增大|减小|加大|缩小|change|set|adjust|update|resize|increase|decrease/;
  const sceneNoun = /小区|社区|园区|场地|地块|总图|建筑布局|建筑群|楼栋|景观|\b(site|community|campus|neighbou?rhood|master\s+plan|building\s+layout|massing|bim|villa|residential)\b/;
  if (/生成|创建|新建|建模|制作|做一个|画一个/.test(normalized)) return true;
  if (/\b(create|generate|model)\b/.test(normalized)) return true;
  if (/\bmake\s+(?:me\s+)?(?:a|an|new)\b/.test(normalized)) return true;
  if (/\bdesign\s+(?:a|an|new)\b/.test(normalized)) return true;
  return sceneNoun.test(normalized) && !editVerb.test(normalized);
}

function shouldRouteToAgent(text) {
  const normalized = text.toLowerCase();
  if (shouldRequestScriptRewrite(text)) return true;
  if (isCreateOrScenePrompt(text)) return true;
  if (/\b(freecad|fcstd|techdraw)\b/.test(normalized)) return true;
  if (/\b(step|stl|iges|brep|obj|gltf)\b|导出|输出|导入/.test(normalized)) return true;
  if (/\d+(?:\.\d+)?\s*(?:x|×)\s*\d+(?:\.\d+)?\s*(?:x|×)\s*\d+(?:\.\d+)?/.test(normalized)) return true;
  return false;
}

function shouldUseAgentForUnmappedCommand(text, rewriteScript) {
  if (rewriteScript) return true;
  if (shouldRouteToAgent(text)) return true;
  // In generated mode, local parsers above handle deterministic parameter edits.
  // Anything left is natural-language CAD intent and should be resolved by the agent.
  return hasActiveGeneratedModel();
}

function generatedParameterNameMentioned(text, params) {
  const normalized = text.toLowerCase();
  const tokens = new Set(normalized.match(/[a-z_]\w*/g) || []);
  const compactText = normalized.replace(/[\s_-]+/g, "");
  return params.some((param) => {
    const name = String(param.name || "").toLowerCase();
    if (!name) return false;
    if (tokens.has(name)) return true;
    return name.length > 2 && compactText.includes(name.replace(/[\s_-]+/g, ""));
  });
}

function shouldParseGeneratedParameterPatch(text, params) {
  const normalized = text.toLowerCase();
  if (generatedParameterNameMentioned(text, params)) return true;
  if (/改成|改为|设为|设置为|变成|调整|修改|更新|增大|减小|加大|缩小|change|set|adjust|update|resize|increase|decrease/.test(normalized)) {
    return true;
  }
  return /(?:mm|毫米)/i.test(normalized) && Boolean(requestedDimension(normalized));
}

function parseGeneratedParameterPatch(text) {
  const params = state.generatedParameters || [];
  if (!params.length) return null;
  const exact = text.match(/\b([A-Za-z_]\w*)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if (exact) {
    const target = params.find((param) => param.name.toLowerCase() === exact[1].toLowerCase());
    if (target) return { name: target.name, value: Number(exact[2]) };
  }

  if (!shouldParseGeneratedParameterPatch(text, params)) return null;
  const value = extractCommandValue(text);
  if (value === null) return null;
  const target = bestGeneratedParameterMatch(text, params);
  return target ? { name: target.name, value } : null;
}

function parseFreeCadDocumentPatch(text) {
  if (!hasFreeCadDocumentState()) return null;
  return parseSelectedSubelementFreeCadPatch(text) || parseExactFreeCadPatch(text) || parseInferredFreeCadPatch(text);
}

function parseSelectedSubelementFreeCadPatch(text) {
  const selected = selectedFreeCadSubelementRef();
  if (!selected?.reference || !selected?.selector) return null;
  const normalized = text.toLowerCase();
  const stableId = selected.stableId || "";
  const stableReference = selected.stableReference || "";
  const signature = selected.signature || null;
  if (/\bexternal\s+geometry\b|外部几何/.test(normalized)) {
    const sketch = bestFreeCadObjectMatch(text);
    const sketchObj = sketch && freeCadObjectIsSketch(sketch) ? sketch : firstFreeCadSketchObject();
    if (!sketchObj) return null;
    return {
      patches: [{
        op: "add_external_geometry",
        selector: freeCadObjectSelector(sketchObj),
        source_selector: selected.selector,
        references: [selected.reference],
        stable_ids: stableId ? [stableId] : [],
        stable_references: stableReference ? [stableReference] : [],
        stable_signatures: signature ? [signature] : [],
        kind: selected.kind || selected.reference,
      }],
      name: `${freeCadObjectDisplayName(sketchObj)}.external:${selected.reference}`,
    };
  }
  if (/\battach\b.*\bsketch\b|附着.*草图|草图.*附着/.test(normalized)) {
    const sketch = bestFreeCadObjectMatch(text);
    const sketchObj = sketch && freeCadObjectIsSketch(sketch) ? sketch : firstFreeCadSketchObject();
    if (!sketchObj || !/^face/i.test(selected.reference)) return null;
    return {
      patches: [{
        op: "attach_sketch",
        selector: freeCadObjectSelector(sketchObj),
        support_selector: selected.selector,
        reference: selected.reference,
        stable_id: stableId,
        stable_reference: stableReference,
        signature,
        kind: selected.kind || "Face",
        map_mode: "FlatFace",
      }],
      name: `${freeCadObjectDisplayName(sketchObj)}.attach:${selected.reference}`,
    };
  }
  if (/\btechdraw\b|\bdimension\b|工程图|技术图|标注|尺寸/.test(normalized)) {
    const page = firstFreeCadTechDrawPage();
    const view = firstFreeCadTechDrawView();
    if (!page || !view) return null;
    const mode = /chain|链式/.test(normalized) ? "chain" : (/coordinate|坐标/.test(normalized) ? "coordinate" : "single");
    return {
      patches: [{
        op: "add_techdraw_dimension",
        page_selector: freeCadObjectSelector(page),
        view_selector: freeCadObjectSelector(view),
        source_selector: selected.selector,
        name: `${selected.reference}Dim`,
        dimension_type: /^edge/i.test(selected.reference) ? "Distance" : "Distance",
        dimension_mode: mode,
        reference: selected.reference,
        stable_ids: stableId ? [stableId] : [],
        stable_references: stableReference ? [stableReference] : [],
        stable_signatures: signature ? [signature] : [],
      }],
      name: `TechDrawDimension:${selected.reference}`,
    };
  }
  return null;
}

function parseExactFreeCadPatch(text) {
  const propertyMatch = text.match(/\b([A-Za-z_][\w.-]*)\s*\.\s*([A-Za-z_]\w*)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if (propertyMatch) {
    const obj = freeCadObjectByToken(propertyMatch[1]);
    if (!obj) return null;
    const property = freeCadPropertyByToken(obj, propertyMatch[2]);
    if (!property) return null;
    const value = Number(propertyMatch[3]);
    return freeCadPropertyPatchResult(obj, property, value);
  }

  const constraintMatch = text.match(/\b([A-Za-z_][\w.-]*)\s*(?:\.|:)?\s*(?:constraint|约束)\s*\[?#?(\d+)\]?\s*=\s*(-?\d+(?:\.\d+)?)/i);
  if (constraintMatch) {
    const obj = freeCadObjectByToken(constraintMatch[1]);
    if (!obj || !freeCadObjectIsSketch(obj)) return null;
    const index = Number(constraintMatch[2]);
    const value = Number(constraintMatch[3]);
    return freeCadConstraintPatchResult(obj, index, value);
  }
  return null;
}

function parseInferredFreeCadPatch(text) {
  const value = extractCommandValue(text);
  if (value === null) return null;
  const obj = bestFreeCadObjectMatch(text) || (freeCadShapeObjects().length === 1 ? freeCadShapeObjects()[0] : null);
  if (!obj) return null;

  const constraintIndex = requestedConstraintIndex(text);
  if (constraintIndex !== null && freeCadObjectIsSketch(obj)) {
    return freeCadConstraintPatchResult(obj, constraintIndex, value);
  }

  const property = inferFreeCadProperty(text, obj);
  return property ? freeCadPropertyPatchResult(obj, property, value) : null;
}

function freeCadPropertyPatchResult(obj, property, value) {
  return {
    patches: [{
      op: "set_property",
      selector: freeCadObjectSelector(obj),
      property,
      value,
    }],
    name: `${freeCadObjectDisplayName(obj)}.${property}`,
    value,
    unit: t("unitMm"),
  };
}

function freeCadConstraintPatchResult(obj, constraintIndex, value) {
  return {
    patches: [{
      op: "set_constraint_value",
      selector: freeCadObjectSelector(obj),
      constraint_index: constraintIndex,
      value,
    }],
    name: `${freeCadObjectDisplayName(obj)}.constraint#${constraintIndex}`,
    value,
    unit: t("unitMm"),
  };
}

function freeCadObjectByToken(token) {
  const normalized = normalizeFreeCadToken(token);
  return freeCadDocumentObjects().find((obj) => {
    return normalizeFreeCadToken(obj.name) === normalized
      || normalizeFreeCadToken(obj.label) === normalized;
  }) || null;
}

function bestFreeCadObjectMatch(text) {
  const normalized = normalizeFreeCadToken(text);
  let best = null;
  for (const obj of freeCadDocumentObjects()) {
    let score = 0;
    const name = normalizeFreeCadToken(obj.name);
    const label = normalizeFreeCadToken(obj.label);
    if (name && normalized.includes(name)) score += 100 + name.length;
    if (label && normalized.includes(label)) score += 90 + label.length;
    if (score && (!best || score > best.score)) best = { obj, score };
  }
  return best?.obj || null;
}

function freeCadPropertyByToken(obj, token) {
  const normalized = normalizeFreeCadToken(token);
  return freeCadPropertyNames(obj).find((name) => normalizeFreeCadToken(name) === normalized) || null;
}

function inferFreeCadProperty(text, obj) {
  const normalized = normalizeFreeCadToken(text);
  const direct = freeCadPropertyNames(obj).find((name) => {
    const token = normalizeFreeCadToken(name);
    return token && normalized.includes(token);
  });
  if (direct) return direct;

  const dimension = requestedDimension(text.toLowerCase());
  const aliases = [
    ["Length", ["length", "long", "长度", "长"]],
    ["Width", ["width", "wide", "宽度", "宽"]],
    ["Height", ["height", "高度", "高"]],
    ["Radius", ["radius", "半径", "圆角"]],
    ["Diameter", ["diameter", "diam", "直径", "孔径"]],
    ["Angle", ["angle", "角度"]],
  ];
  const candidates = freeCadPropertyNames(obj);
  for (const [property, words] of aliases) {
    if (dimension && !words.some((word) => normalizeFreeCadToken(word) === normalizeFreeCadToken(dimension))) {
      if (!words.some((word) => normalized.includes(normalizeFreeCadToken(word)))) continue;
    }
    const existing = candidates.find((name) => normalizeFreeCadToken(name) === normalizeFreeCadToken(property));
    if (existing) return existing;
  }
  return null;
}

function requestedConstraintIndex(text) {
  const match = text.match(/(?:constraint|约束)\s*\[?#?(\d+)\]?/i);
  return match ? Number(match[1]) : null;
}

function freeCadObjectIsSketch(obj) {
  return /Sketcher::SketchObject/i.test(String(obj?.type_id || "")) || Boolean(obj?.sketch);
}

function bestGeneratedParameterMatch(text, params) {
  const normalized = text.toLowerCase();
  const compactText = normalized.replace(/[\s_-]+/g, "");
  const dimension = requestedDimension(normalized);
  let best = null;
  for (const param of params) {
    const name = String(param.name || "");
    const lowerName = name.toLowerCase();
    const label = generatedParameterLabel(param).toLowerCase();
    const compactName = lowerName.replace(/[\s_-]+/g, "");
    let score = 0;

    if (normalized.includes(lowerName) || compactText.includes(compactName)) score += 120;
    score += componentScore(normalized, lowerName);
    score += generatedParameterAliasScore(normalized, lowerName);
    if (dimension) score += dimensionScore(lowerName, label, dimension);
    if (dimension === "length" || dimension === "width" || dimension === "depth") {
      score += primarySizeBonus(param, params);
    }
    if (dimension === "height") score += verticalSizeBonus(param, params);

    if (!best || score > best.score) best = { param, score };
  }
  return best && best.score >= 30 ? best.param : null;
}

function generatedParameterAliasScore(normalized, name) {
  if (!name) return 0;
  if (/中心孔|center\s*hole/.test(normalized)) {
    return name === "center_hole_d" ? 120 : 0;
  }
  if (/孔径|孔|holes?/.test(normalized)) {
    if (name === "hole_d") return 120;
    if (name === "center_hole_d") return 20;
  }
  if (/凸台|boss/.test(normalized)) {
    if (/高度|高|height/.test(normalized) && name === "boss_h") return 120;
    if (/直径|孔径|diam|diameter|d\b/.test(normalized) && name === "boss_d") return 120;
  }
  return 0;
}

function requestedDimension(normalized) {
  const checks = [
    ["diameter", /直径|孔径|孔|diam|diameter|holes?/],
    ["radius", /半径|圆角|radius|rad/],
    ["thickness", /厚度|厚|thick|thickness/],
    ["count", /层数|楼层|层|数量|个数|几个|count|number|qty|num|floors?/],
    ["height", /高度|高|height/],
    ["depth", /深度|进深|depth|deep/],
    ["gap", /间隙|间距|缝|gap|spacing|space/],
    ["length", /长度|长|length|long/],
    ["width", /宽度|宽|width|wide/],
  ];
  return checks.find(([, pattern]) => pattern.test(normalized))?.[0] || null;
}

function componentScore(normalized, name) {
  const checks = [
    [/沙发|sofa/, /(^|_)sofa($|_)/],
    [/座|坐垫|座垫|seat/, /seat|cushion/],
    [/靠背|背|back/, /back/],
    [/扶手|arm/, /arm/],
    [/腿|脚|leg/, /leg/],
    [/垫|cushion/, /cushion/],
  ];
  return checks.reduce((total, [textPattern, namePattern]) => {
    return total + (textPattern.test(normalized) && namePattern.test(name) ? 35 : 0);
  }, 0);
}

function dimensionScore(name, label, dimension) {
  const haystack = `${name} ${label}`;
  const byDimension = {
    length: [/length|len|long|(?:^|_)l(?:$|_|\b)|\bl\b/, 65, /width|(?:^|_)w(?:$|_|\b)|\bw\b/, 35],
    width: [/width|wide|(?:^|_)w(?:$|_|\b)|\bw\b/, 65, /length|len|(?:^|_)l(?:$|_|\b)|\bl\b/, 25],
    depth: [/depth|deep|(?:^|_)d(?:$|_|\b)|\bd\b/, 65],
    height: [/height|(?:^|_)h(?:$|_|\b)|\bh\b/, 65],
    thickness: [/thick|thickness|(?:^|_)t(?:$|_|\b)|\bt\b/, 65],
    diameter: [/diam|dia|hole|(?:^|_)d(?:$|_|\b)|\bd\b/, 65],
    radius: [/radius|rad|(?:^|_)r(?:$|_|\b)|\br\b/, 65],
    gap: [/gap|spacing|space/, 65],
    count: [/count|num|qty|(?:^|_)n(?:$|_|\b)|\bn\b/, 65],
  };
  const rules = byDimension[dimension] || [];
  let score = 0;
  for (let i = 0; i < rules.length; i += 2) {
    if (rules[i].test(haystack)) score += rules[i + 1];
  }
  return score;
}

function primarySizeBonus(param, params) {
  const values = params.map((item) => Number(item.value)).filter(Number.isFinite);
  const max = Math.max(...values, 1);
  const value = Number(param.value);
  return Number.isFinite(value) ? Math.min(25, (value / max) * 25) : 0;
}

function verticalSizeBonus(param, params) {
  const heights = params
    .filter((item) => /height|(^|_)h($|_)/.test(String(item.name || "").toLowerCase()))
    .map((item) => Number(item.value))
    .filter(Number.isFinite);
  const max = Math.max(...heights, 1);
  const value = Number(param.value);
  return Number.isFinite(value) ? Math.min(20, (value / max) * 20) : 0;
}

function extractCommandValue(text) {
  const unitMatches = [...text.matchAll(/(-?\d+(?:\.\d+)?)\s*(?:mm|毫米)/gi)];
  if (unitMatches.length) return Number(unitMatches[unitMatches.length - 1][1]);
  const targetMatch = text.match(/(?:改成|改为|设为|设置为|变成|to|at)\s*(-?\d+(?:\.\d+)?)/i);
  if (targetMatch) return Number(targetMatch[1]);
  const numbers = [...text.matchAll(/-?\d+(?:\.\d+)?/g)];
  if (!numbers.length) return null;
  return Number(numbers[numbers.length - 1][0]);
}

async function submitCommand(event) {
  event.preventDefault();
  const input = $("commandInput");
  const text = input.value.trim();
  if (!text) return;
  const rewriteScript = shouldRequestScriptRewrite(text);
  const createOrScenePrompt = isCreateOrScenePrompt(text);
  const serverFreeCadPatch = !rewriteScript ? await parseServerFreeCadDocumentPatch(text) : null;
  const freeCadPatch = serverFreeCadPatch || (!rewriteScript ? parseFreeCadDocumentPatch(text) : null);
  const generatedPatch = !createOrScenePrompt && !freeCadPatch && !rewriteScript && state.previewMode === "generated"
    ? parseGeneratedParameterPatch(text)
    : null;
  const patch = !createOrScenePrompt && !freeCadPatch && !generatedPatch && !rewriteScript && state.previewMode !== "generated"
    ? parseConversationalPatch(text)
    : null;
  const agentMode = commandModeForAgent(text, rewriteScript);
  const useAgent = createOrScenePrompt || (!freeCadPatch && !generatedPatch && !patch && shouldUseAgentForUnmappedCommand(text, rewriteScript));
  input.value = "";
  state.chatMessages.unshift({ role: "user", text });
  setBottomTab("chat");
  if (freeCadPatch) {
    const detail = freeCadPatchDetail(freeCadPatch);
    const ok = await applyFreeCadDocumentPatch(freeCadPatch, detail);
    if (ok) {
      state.chatMessages.unshift({
        role: "assistant",
        key: freeCadPatchHasValue(freeCadPatch) ? "chat.appliedFreeCadDocumentPatch" : "chat.appliedFreeCadTypedPatch",
        vars: freeCadPatchHasValue(freeCadPatch)
          ? {
              name: freeCadPatch.name,
              value: formatNumber(freeCadPatch.value),
              unit: freeCadPatch.unit || "",
            }
          : { name: freeCadPatch.name || freeCadPatch.intent || t("freecadScript") },
      });
      setBottomTab("chat");
      renderAll();
    }
    return;
  }
  if (generatedPatch) {
    const ok = await commitGeneratedParameter(generatedPatch.name, generatedPatch.value);
    if (ok) {
      const param = (state.generatedParameters || []).find((item) => item.name === generatedPatch.name);
      const unit = param ? generatedParameterUnit(param) : t("unitMm");
      state.chatMessages.unshift({
        role: "assistant",
        key: "chat.appliedGeneratedParameter",
        vars: {
          name: generatedPatch.name,
          value: formatNumber(generatedPatch.value),
          unit,
        },
      });
      setBottomTab("chat");
      renderAll();
    }
    return;
  }
  if (patch) {
    await applyPatches(
      [patch],
      t("history.conversation", { name: parameterLabel(patch.name) }),
      `${parameterLabel(patch.name)} = ${formatNumber(patch.value)} ${t("unitMm")}`
    );
    state.chatMessages.unshift({ role: "assistant", key: "chat.appliedPatch", vars: { name: parameterLabel(patch.name), value: formatNumber(patch.value) } });
    setBottomTab("chat");
    return;
  }
  if (useAgent) {
    await generateFromPrompt(text, { mode: agentMode });
    return;
  }
  state.chatMessages.unshift({ role: "assistant", key: "chat.commandNotUnderstood" });
  log(t("log.commandNotUnderstood"));
  setBottomTab("chat");
  renderAll();
}

async function generateFromPrompt(prompt, options = {}) {
  const mode = options.mode === "rewrite" ? "rewrite" : "create";
  const requestPrompt = mode === "rewrite" ? buildScriptRewritePrompt(prompt) : prompt;
  const previousGeneratedPrompt = state.generatedPrompt;
  const displayPrompt = mode === "rewrite" && previousGeneratedPrompt ? previousGeneratedPrompt : prompt;
  $("applyButton").disabled = true;
  startGenerationActivity(displayPrompt, mode);
  state.previewMode = "generated";
  state.generatedPrompt = displayPrompt;
  state.generatedParameters = [];
  state.documentSummary = null;
  state.generatedViewerFitMode = "all";
  state.selectedGeneratedParameterName = "";
  state.selectedFreeCadObjectName = "";
  state.selectedFreeCadSubelement = null;
  state.selectedFreeCadAssemblyJoint = null;
  state.assemblyConnectorAnchor = null;
  state.previewPng = null;
  state.artifacts = {};
  state.artifactRefs = {};
  state.engine = "cadquery";
  state.freecadVersion = "";
  state.exportStatus = "notReady";
  state.patch = mode === "rewrite" ? { op: "request_script_rewrite", instruction: prompt } : null;
  setBottomTab("chat");
  setStatus("submitting");
  renderAll();
  let resp;
  try {
    for (let attempt = 0; attempt < 20; attempt++) {
      resp = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: requestPrompt,
          history: mode === "rewrite" ? [] : sanitizeChatHistory(state.chatHistory),
        }),
      });
      if (resp.status !== 503) break;
      pushGenerationActivity("activityWaking", { attempt: attempt + 1 }, "waking");
      setStatus("waking", { attempt: attempt + 1 });
      renderViewport();
      renderBottom();
      await new Promise((r) => setTimeout(r, 3000));
    }
    if (!resp.ok) throw new Error(await responseErrorMessage(resp));
    const sawDone = await readSse(resp, prompt, { mode, instruction: prompt });
    if (!sawDone) {
      finishGenerationActivity(false);
      setStatus("failed");
      log(t("log.streamEndedWithoutDone"));
      state.chatMessages.unshift({ role: "assistant", key: "chat.generationBad" });
      if (!state.previewPng) state.previewMode = "design_state";
    }
  } catch (error) {
    finishGenerationActivity(false);
    setStatus("generationFailed");
    log(t("chat.generationFailed", { message: error.message }));
    state.chatMessages.unshift({ role: "assistant", key: "chat.generationFailed", vars: { message: error.message } });
    if (!state.previewPng) state.previewMode = "design_state";
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

async function readSse(resp, prompt, context = {}) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let lastScript = null;
  let sawDone = false;
  const processFrame = (frame) => {
    const dataLine = frame.split("\n").find((line) => line.startsWith("data: "));
    if (!dataLine) return;
    const ev = JSON.parse(dataLine.slice(6));
    handleAgentEvent(ev, context);
    if (ev.type === "script") lastScript = ev.script;
    if (ev.type === "done") sawDone = true;
  };
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const frames = buffer.split("\n\n");
    buffer = frames.pop();
    for (const frame of frames) {
      processFrame(frame);
    }
  }
  buffer += decoder.decode();
  if (buffer.trim()) processFrame(buffer);
  state.chatHistory.push({ role: "user", content: prompt });
  if (lastScript) {
    state.chatHistory.push({ role: "assistant", content: "```python\n" + lastScript + "\n```" });
  }
  return sawDone;
}

function handleAgentEvent(ev, context = {}) {
  let shouldRenderViewport = false;
  if (ev.type === "status") {
    if (ev.message === "thinking") pushGenerationActivity("activityThinking", {}, "thinking");
    if (ev.message === "rendering") pushGenerationActivity("activityRendering", {}, "rendering");
    setStatus(ev.message);
    shouldRenderViewport = true;
  }
  if (ev.type === "script") {
    state.script = ev.script;
    state.engine = normalizeEngine(ev.engine);
    state.freecadVersion = ev.freecad_version || "";
    state.generatedParameters = Array.isArray(ev.parameters) ? ev.parameters : [];
    state.documentSummary = null;
    state.generatedViewerFitMode = "all";
    state.selectedFreeCadObjectName = "";
    state.selectedFreeCadSubelement = null;
    state.selectedFreeCadAssemblyJoint = null;
    state.assemblyConnectorAnchor = null;
    if (!state.generatedParameters.some((param) => param.name === state.selectedGeneratedParameterName)) {
      state.selectedGeneratedParameterName = "";
    }
    pushGenerationActivity("activityScript", { attempt: ev.attempt || 1, engine: engineLabel() }, "script");
    pushGenerationActivity("activityRendering", {}, "rendering");
    setStatus("rendering");
    log(t("log.producedScript", { attempt: ev.attempt || 1, engine: engineLabel() }));
    shouldRenderViewport = true;
  }
  if (ev.type === "retry") {
    pushGenerationActivity("activityRetry", { attempt: ev.attempt || 1 }, "retry");
    setStatus("thinking");
    log(t("log.retry", { attempt: ev.attempt, message: ev.message }));
    shouldRenderViewport = true;
  }
  if (ev.type === "preview" && ev.png_b64) {
    state.previewMode = "generated";
    state.engine = normalizeEngine(ev.engine || state.engine);
    if (ev.freecad_version) state.freecadVersion = ev.freecad_version;
    state.previewPng = ev.png_b64;
    pushGenerationActivity("activityPreview", {}, "preview");
    log(t("log.renderedPreview"));
    renderViewport();
  }
  if (ev.type === "artifact") {
    state.engine = normalizeEngine(ev.engine || state.engine);
    if (ev.freecad_version) state.freecadVersion = ev.freecad_version;
    state.artifacts[ev.format] = ev.data_b64;
    delete state.artifactRefs[ev.format];
    if (hasStepStlArtifacts()) state.exportStatus = "ready";
    pushGenerationActivity("activityArtifact", { format: ev.format }, "artifact");
    log(t("log.artifactReady", { format: ev.format }));
    shouldRenderViewport = true;
  }
  if (ev.type === "error") {
    finishGenerationActivity(false);
    log(ev.message);
    shouldRenderViewport = true;
  }
  if (ev.type === "done") {
    state.engine = normalizeEngine(ev.engine || state.engine);
    if (ev.freecad_version) state.freecadVersion = ev.freecad_version;
    if (ev.ok && hasStepStlArtifacts()) state.exportStatus = "ready";
    finishGenerationActivity(Boolean(ev.ok));
    setStatus(ev.ok ? "done" : "failed");
    const rewrite = context.mode === "rewrite";
    const userInstruction = context.instruction || state.generatedPrompt;
    addHistory(
      ev.ok ? (rewrite ? t("history.scriptRewrite") : t("history.agentGeneration")) : t("history.agentGenerationFailed"),
      ev.ok ? (rewrite ? t("history.scriptRewriteDetail", { instruction: userInstruction }) : t("history.agentDetail")) : t("history.agentFailedDetail")
    );
    state.chatMessages.unshift({
      role: "assistant",
      key: ev.ok ? (rewrite ? "chat.scriptRewriteOk" : "chat.generationOk") : "chat.generationBad",
    });
    if (!ev.ok && !state.previewPng) state.previewMode = "design_state";
    void recordServerVersion(ev.ok ? (rewrite ? "modify" : "create") : "repair", userInstruction, ev.ok ? "ok" : "failed", ev.ok ? "" : t("chat.generationBad"));
    shouldRenderViewport = true;
  }
  if (shouldRenderViewport) renderViewport();
  renderBottom();
  persistWorkbenchSession();
}

function applyViewportTransform() {
  const v = state.viewport;
  $("viewportContent").style.transform = `translate(calc(-50% + ${v.tx}px), calc(-50% + ${v.ty}px)) scale(${v.scale})`;
}

function installViewportGestures() {
  const viewport = $("viewport");
  viewport.addEventListener("wheel", (event) => {
    event.preventDefault();
    const next = state.viewport.scale * (event.deltaY < 0 ? 1.08 : 0.92);
    state.viewport.scale = Math.min(3.5, Math.max(.5, next));
    applyViewportTransform();
  }, { passive: false });
  viewport.addEventListener("pointerdown", (event) => {
    state.viewport.dragging = true;
    state.viewport.x = event.clientX;
    state.viewport.y = event.clientY;
    viewport.classList.add("dragging");
    viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener("pointermove", (event) => {
    if (!state.viewport.dragging) return;
    state.viewport.tx += event.clientX - state.viewport.x;
    state.viewport.ty += event.clientY - state.viewport.y;
    state.viewport.x = event.clientX;
    state.viewport.y = event.clientY;
    applyViewportTransform();
  });
  viewport.addEventListener("pointerup", () => {
    state.viewport.dragging = false;
    viewport.classList.remove("dragging");
  });
}

async function init() {
  renderStaticText();
  $("commandForm").addEventListener("submit", submitCommand);
  installViewportGestures();
  if (restoreWorkbenchSession()) {
    setStatus("restored");
    if (state.serverSessionId && (!state.previewPng || !hasStepStlArtifacts())) {
      if (await restoreServerSession()) {
        renderAll();
        return;
      }
    }
    renderAll();
    return;
  }
  if (await restoreServerSession()) {
    setStatus("restored");
    renderAll();
    return;
  }
  try {
    const initial = await fetchJson("/api/design/initial");
    state.designState = initial.design_state;
    state.script = initial.script;
    state.engine = normalizeEngine(initial.engine);
    state.freecadVersion = "";
    state.selectedFeatureId = state.designState.selected_feature_id;
    addHistory(t("history.initialTitle"), t("history.initialDetail"));
    setStatus("ready");
    void recordServerVersion("create", t("history.initialDetail"));
  } catch (error) {
    setStatus("initialUnavailable");
    log(t("log.initialFailed", { message: error.message }));
    state.designState = fallbackDesignState();
    state.engine = "cadquery";
    state.freecadVersion = "";
  }
  renderAll();
}

async function startNewWorkbenchSession() {
  $("applyButton").disabled = true;
  resetClientWorkbenchSession();
  setStatus("loading");
  try {
    const initial = await fetchJson("/api/design/initial");
    state.designState = initial.design_state;
    state.script = initial.script;
    state.engine = normalizeEngine(initial.engine);
    state.freecadVersion = "";
    state.selectedFeatureId = state.designState.selected_feature_id;
    addHistory(t("history.initialTitle"), t("history.initialDetail"));
    log(t("log.newSessionStarted"));
    setStatus("ready");
    void recordServerVersion("create", t("history.initialDetail"));
  } catch (error) {
    setStatus("initialUnavailable");
    log(t("log.initialFailed", { message: error.message }));
    state.designState = fallbackDesignState();
    state.script = "";
    state.engine = "cadquery";
    state.freecadVersion = "";
    state.selectedFeatureId = state.designState.selected_feature_id;
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

      { id: "base_plate", parent_id: "body", name: "Base plate", kind: "solid", parameters: ["plate_length", "plate_width", "plate_thickness"], suppressible: false, suppressed: false },
      { id: "fillet_corners", parent_id: "body", name: "Fillet corners", kind: "operation", parameters: ["corner_radius"], suppressible: true, suppressed: false },
      { id: "hole_pattern", parent_id: "body", name: "Hole pattern", kind: "pattern", parameters: ["hole_d"], suppressible: true, suppressed: false },
      { id: "center_boss", parent_id: "body", name: "Center boss", kind: "solid", parameters: ["boss_d", "boss_h"], suppressible: true, suppressed: false },
      { id: "center_hole", parent_id: "center_boss", name: "Center hole", kind: "cut", parameters: ["center_hole_d"], suppressible: true, suppressed: false },

    rollback_feature_id: null,
  };
}
