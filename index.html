      <div class="kv"><span>External geometry</span><strong>${escapeHtml(sketch.external_geometry_count ?? 0)}</strong></div>
      <div class="kv"><span>${escapeHtml(t("sketchConstraintList"))}</span><strong>${escapeHtml(sketch.constraint_count ?? constraints.length)}</strong></div>
      <div class="kv"><span>${escapeHtml(t("solverStatus"))}</span><strong>${escapeHtml(freeCadSketchSolverText(sketch))}</strong></div>
      <div class="kv"><span>${escapeHtml(t("degreesOfFreedom"))}</span><strong>${escapeHtml(editMode.degrees_of_freedom ?? sketch.degrees_of_freedom ?? t("notAvailable"))}</strong></div>
      <div class="kv"><span>${escapeHtml(t("conflictingConstraints"))}</span><strong>${escapeHtml(String(conflictingConstraints.length))}</strong></div>
      <div class="kv"><span>${escapeHtml(t("redundantConstraints"))}</span><strong>${escapeHtml(String(redundantConstraints.length))}</strong></div>
	      <div class="kv"><span>${escapeHtml(t("sketchDiagnostics"))}</span><strong>${escapeHtml(freeCadDiagnosticsSummaryText(editMode))}</strong></div>
	    </div>
	    ${renderFreeCadSketchSolverMap(sketch, editMode, freeCadObjectKey(obj))}
	    ${renderFreeCadSketchSolverIssuePanel(obj, sketch, editMode)}
	    <div class="sketch-tool-row">
      <button class="typed-action-button ${state.sketchEditTool === "select" ? "active" : ""}" type="button" onclick="setFreeCadSketchTool('select')">${icon("pointer")} ${escapeHtml(t("sketchToolSelect"))}</button>
      <button class="typed-action-button ${state.sketchEditTool === "line" ? "active" : ""}" type="button" onclick="setFreeCadSketchTool('line')">${icon("edit")} ${escapeHtml(t("addSketchLine"))}</button>
      <button class="typed-action-button ${state.sketchEditTool === "circle" ? "active" : ""}" type="button" onclick="setFreeCadSketchTool('circle')">${icon("ruler")} ${escapeHtml(t("addSketchCircle"))}</button>
      <button class="typed-action-button ${state.sketchEditTool === "arc" ? "active" : ""}" type="button" onclick="setFreeCadSketchTool('arc')">${icon("ruler")} ${escapeHtml(t("addSketchArc"))}</button>
      <label><input type="checkbox" ${state.sketchSnapEnabled ? "checked" : ""} onchange="setFreeCadSketchSnap(this.checked)" /> ${escapeHtml(t("sketchSnap"))}</label>
    </div>
	    <div class="feature-actions">
	      <button class="icon-button" type="button" title="${escapeHtml(t("validateSketch"))}" onclick="validateFreeCadSketch(${escapeHtml(jsString(freeCadObjectKey(obj)))})">${icon("eye")}</button>
	      <button class="typed-action-button" type="button" onclick="addFreeCadSketchPrimitive(${escapeHtml(jsString(freeCadObjectKey(obj)))}, 'line')">${icon("edit")} ${escapeHtml(t("addSketchLine"))}</button>
	      <button class="typed-action-button" type="button" onclick="addFreeCadSketchPrimitive(${escapeHtml(jsString(freeCadObjectKey(obj)))}, 'circle')">${icon("ruler")} ${escapeHtml(t("addSketchCircle"))}</button>
	      <button class="typed-action-button" type="button" onclick="addFreeCadSketchPrimitive(${escapeHtml(jsString(freeCadObjectKey(obj)))}, 'arc')">${icon("ruler")} ${escapeHtml(t("addSketchArc"))}</button>
	    </div>
	    ${renderFreeCadSketchDryRunReview(obj)}
	    ${renderFreeCadDiagnostics("sketchDiagnostics", editMode)}
	    ${renderFreeCadSketchConstraintPalette(obj, geometry)}
	    ${renderFreeCadSketchGeometryList(obj, geometry)}
	    ${renderFreeCadSketchConstraintList(obj, constraints, editMode)}
	    ${renderFreeCadSketchConstraintEditor(obj, constraints, editMode)}
	    ${renderFreeCadSketchPointEditor(obj, geometry)}
    ${editableConstraints.length ? editableConstraints.map((constraint) => freeCadConstraintRow(obj, constraint)).join("") : ""}
  </section>`;
}

function freeCadSketchSolverText(sketch) {
  const editMode = sketch?.edit_mode || {};
  if (editMode.state) return editMode.state;
  const solver = sketch?.solver || {};
  if (solver.solver_status !== undefined && solver.solver_status !== null) return String(solver.solver_status);
  if (sketch.fully_constrained !== undefined && sketch.fully_constrained !== null) return sketch.fully_constrained ? "fully constrained" : "under constrained";
  if (sketch.degrees_of_freedom !== undefined && sketch.degrees_of_freedom !== null) return `${sketch.degrees_of_freedom} DOF`;
  return t("notAvailable");
}

function freeCadSketchGeometryText(item) {
  const values = [];
  if (item.construction) values.push("construction");
  if (item.solver_status) values.push(item.solver_status);
  if (Array.isArray(item.constraint_indexes) && item.constraint_indexes.length) values.push(`constraints ${item.constraint_indexes.join(",")}`);
  if (freeCadTriplet(item.start) && freeCadTriplet(item.end)) values.push(`${freeCadVectorText(item.start)} -> ${freeCadVectorText(item.end)}`);
  if (freeCadTriplet(item.center)) values.push(`center ${freeCadVectorText(item.center)}`);
  if (Number.isFinite(Number(item.radius))) values.push(`r ${formatNumber(item.radius)}`);
  if (Number.isFinite(Number(item.major_radius))) values.push(`major ${formatNumber(item.major_radius)}`);
  return values.join(" · ") || t("notAvailable");
}

function freeCadSketchGeometrySeverity(item) {
  const severity = String(item?.diagnostic_severity || "").toLowerCase();
  if (severity === "error" || /conflict|malformed|error/.test(String(item?.solver_status || "").toLowerCase())) return "error";
  if (severity === "warning" || /redundant|disabled/.test(String(item?.solver_status || "").toLowerCase())) return "warning";
  if (item?.construction) return "info";
  return "";
}

function renderFreeCadSketchGeometryList(obj, geometry) {
  if (!geometry.length) return "";
  const sketchName = freeCadObjectKey(obj);
  const issueGeometry = freeCadSketchIssueGeometryIndexes(sketchName);
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchGeometryList"))}</p>
    <div class="subelement-grid">
      ${geometry.slice(0, 24).map((item) => {
        const selected = freeCadSketchElementSelected(sketchName, "geometry", item.index);
        const previewSeverity = issueGeometry.has(Number(item.index)) ? "error" : "";
        return `<div class="subelement-row ${selected ? "active" : previewSeverity || freeCadSketchGeometrySeverity(item)}" onclick="selectFreeCadSketchElement(${escapeHtml(jsString(sketchName))}, 'geometry', ${Number(item.index) || 0})">
        <strong>#${escapeHtml(item.index ?? "")}</strong>
        <span title="${escapeHtml(freeCadSketchGeometryText(item))}">${escapeHtml([item.type || "Geometry", freeCadSketchGeometryText(item)].filter(Boolean).join(" · "))}</span>
      </div>`;
      }).join("")}
    </div>`;
}

function freeCadConstraintSeverity(constraint, editMode = null) {
  const index = Number(constraint?.index);
  const conflicts = new Set(Array.isArray(editMode?.conflicting_constraints) ? editMode.conflicting_constraints.map(Number) : []);
  const redundant = new Set(Array.isArray(editMode?.redundant_constraints) ? editMode.redundant_constraints.map(Number) : []);
  const malformed = new Set(Array.isArray(editMode?.malformed_constraints) ? editMode.malformed_constraints.map(Number) : []);
  if (Number.isFinite(index) && (conflicts.has(index) || malformed.has(index))) return "error";
  if (Number.isFinite(index) && redundant.has(index)) return "warning";
  if (constraint?.diagnostic_severity) return constraint.diagnostic_severity;
  const text = `${constraint?.status || ""} ${constraint?.solver_status || ""} ${constraint?.error || ""}`.toLowerCase();
  if (/conflict|inconsistent|over/.test(text)) return "error";
  if (/redundant|disabled/.test(text)) return "warning";
  if (/reference|virtual/.test(text)) return "info";
  return "";
}

function freeCadConstraintText(constraint) {
  const parts = [
    constraint?.status || "driving",
    constraint?.solver_status || "",
    Number.isFinite(Number(constraint?.value)) ? formatNumber(constraint.value) : "",
    constraint?.first !== undefined ? `first ${constraint.first}` : "",
    constraint?.second !== undefined ? `second ${constraint.second}` : "",
  ];
  return parts.filter(Boolean).join(" · ");
}

function freeCadConstraintGlyphText(constraint) {
  if (constraint?.glyph) return String(constraint.glyph).slice(0, 8);
  const token = normalizeFreeCadToken(constraint?.type || "");
  const glyphs = {
    horizontal: "H",
    vertical: "V",
    coincident: "C",
    distance: "D",
    distancex: "DX",
    distancey: "DY",
    radius: "R",
    diameter: "DIA",
    equal: "EQ",
    parallel: "PAR",
    perpendicular: "PERP",
    tangent: "TAN",
    pointonobject: "POO",
    angle: "ANG",
    block: "LOCK",
    symmetric: "SYM",
  };
  return glyphs[token] || String(constraint?.type || "C").toUpperCase().slice(0, 6);
}

function freeCadConstraintPointRoleFromPos(pointPos) {
  const pos = Number(pointPos);
  if (pos === 1) return "start";
  if (pos === 2) return "end";
  if (pos === 3) return "center";
  if (pos === 0) return "whole";
  return "";
}

function freeCadConstraintGeometryRefs(constraint) {
  if (!constraint) return [];
  if (Array.isArray(constraint.geometry_refs)) {
    return constraint.geometry_refs
      .filter((ref) => ref && Number.isFinite(Number(ref.geometry_index)))
      .map((ref) => ({
        slot: ref.slot || "",
        geometryIndex: Number(ref.geometry_index),
        pointRole: ref.point_role || freeCadConstraintPointRoleFromPos(ref.point_pos),
        pointPos: Number.isFinite(Number(ref.point_pos)) ? Number(ref.point_pos) : null,
        externalOrAxis: ref.external_or_axis === true || Number(ref.geometry_index) < 0,
      }));
  }
  return [
    ["first", "first", "firstPos"],
    ["second", "second", "secondPos"],
    ["third", "third", "thirdPos"],
  ].map(([slot, geometryKey, pointKey]) => {
    const geometryIndex = Number(constraint[geometryKey]);
    if (!Number.isFinite(geometryIndex)) return null;
    const pointPos = Number(constraint[pointKey]);
    return {
      slot,
      geometryIndex,
      pointRole: Number.isFinite(pointPos) ? freeCadConstraintPointRoleFromPos(pointPos) : "",
      pointPos: Number.isFinite(pointPos) ? pointPos : null,
      externalOrAxis: geometryIndex < 0,
    };
  }).filter(Boolean);
}

function freeCadConstraintInternalGeometryRefs(constraint) {
  return freeCadConstraintGeometryRefs(constraint)
    .filter((ref) => !ref.externalOrAxis && Number(ref.geometryIndex) >= 0);
}

function freeCadConstraintGeometryIndexSet(constraint) {
  return new Set(freeCadConstraintInternalGeometryRefs(constraint).map((ref) => Number(ref.geometryIndex)));
}

function freeCadSketchConstraintGeometryItems(obj, constraint) {
  return freeCadConstraintInternalGeometryRefs(constraint)
    .map((ref) => freeCadSketchGeometryByIndex(obj, ref.geometryIndex))
    .filter(Boolean);
}

function freeCadConstraintIsReference(constraint) {
  const text = `${constraint?.status || ""} ${constraint?.solver_status || ""}`.toLowerCase();
  return constraint?.reference === true || constraint?.driving === false || /reference|driven/.test(text);
}

function freeCadConstraintRefLabel(ref) {
  if (!ref) return "";
  const prefix = ref.slot ? `${ref.slot}:` : "";
  const point = ref.pointRole && ref.pointRole !== "whole" ? `.${ref.pointRole}` : "";
  return `${prefix}#${Number(ref.geometryIndex)}${point}`;
}

function freeCadSketchConstraintsForGeometry(obj, geometry) {
  const geometryIndex = Number(geometry?.index);
  if (!obj || !Number.isFinite(geometryIndex)) return [];
  return (Array.isArray(obj.sketch?.constraints) ? obj.sketch.constraints : []).filter((constraint) => {
    return freeCadConstraintGeometryRefs(constraint).some((ref) => Number(ref.geometryIndex) === geometryIndex);
  });
}

function renderFreeCadConstraintRefChips(obj, constraint, editMode = null) {
  const sketchName = freeCadObjectKey(obj);
  const issueConstraints = freeCadSketchIssueConstraintIndexes(sketchName);
  const severity = issueConstraints.has(Number(constraint?.index)) ? "error" : freeCadConstraintSeverity(constraint, editMode);
  const refs = freeCadConstraintGeometryRefs(constraint);
  if (!refs.length) return `<p class="section-note">${escapeHtml(t("constraintReferences"))}: ${escapeHtml(t("none"))}</p>`;
  return `<p class="section-note">${escapeHtml(t("constraintReferences"))}</p>
    <div class="constraint-ref-grid">
      ${refs.map((ref) => {
        const internal = !ref.externalOrAxis && Number(ref.geometryIndex) >= 0;
        const onclick = internal
          ? `selectFreeCadSketchConstraintReference(${escapeHtml(jsString(sketchName))}, ${Number(constraint.index) || 0}, ${Number(ref.geometryIndex)}, ${escapeHtml(jsString(ref.pointRole || ""))})`
          : "";
        return `<button class="constraint-ref-chip ${severity}" type="button" ${onclick ? `onclick="${onclick}"` : "disabled"} title="${escapeHtml(t("focusGeometry"))}">
          ${icon("pointer")} ${escapeHtml(freeCadConstraintRefLabel(ref))}
        </button>`;
      }).join("")}
    </div>`;
}

function renderFreeCadSketchGeometryConstraintRefs(obj, geometry) {
  const constraints = freeCadSketchConstraintsForGeometry(obj, geometry);
  if (!constraints.length) return "";
  const sketchName = freeCadObjectKey(obj);
  const issueConstraints = freeCadSketchIssueConstraintIndexes(sketchName);
  return `<p class="section-note" style="margin-top:10px">${escapeHtml(t("relatedConstraints"))}</p>
    <div class="constraint-ref-grid">
      ${constraints.slice(0, 12).map((constraint) => {
        const severity = issueConstraints.has(Number(constraint.index)) ? "error" : freeCadConstraintSeverity(constraint, obj.sketch?.edit_mode || {});
        return `<button class="constraint-ref-chip ${severity}" type="button" onclick="selectFreeCadSketchElement(${escapeHtml(jsString(sketchName))}, 'constraint', ${Number(constraint.index) || 0}, '', { preserveDryRunReview: true })" title="${escapeHtml(freeCadConstraintText(constraint))}">
          ${escapeHtml(freeCadConstraintGlyphText(constraint))} #${escapeHtml(constraint.index ?? "")}
        </button>`;
      }).join("")}
    </div>`;
}

function renderFreeCadSketchSolverMap(sketch, editMode = {}, sketchName = "") {
  const stateText = editMode.state || freeCadSketchSolverText(sketch);
  const dof = editMode.degrees_of_freedom ?? sketch?.degrees_of_freedom;
  const conflicts = Array.isArray(editMode.conflicting_constraints) ? editMode.conflicting_constraints.map(Number).filter(Number.isFinite) : [];
  const redundant = Array.isArray(editMode.redundant_constraints) ? editMode.redundant_constraints.map(Number).filter(Number.isFinite) : [];
  const malformed = Array.isArray(editMode.malformed_constraints) ? editMode.malformed_constraints.map(Number).filter(Number.isFinite) : [];
  const targetSketchName = sketchName || sketch?.name || sketch?.label || state.selectedFreeCadObjectName;
  const live = freeCadSketchLiveSolveForSketch(targetSketchName);
  const issueConstraintIndexes = [...freeCadSketchIssueConstraintIndexes(targetSketchName)];
  const issueGeometryIndexes = [...freeCadSketchIssueGeometryIndexes(targetSketchName)];
  const severity = live
    ? freeCadSketchLiveSolveSeverity(live)
    : issueConstraintIndexes.length || issueGeometryIndexes.length || conflicts.length || malformed.length ? "error" : redundant.length || Number(dof) > 0 ? "warning" : "info";
  const issueIndexes = [...new Set([...conflicts, ...malformed, ...redundant, ...issueConstraintIndexes])].slice(0, 8);
  const displayDof = live && Number.isFinite(Number(live.degreesOfFreedom)) ? live.degreesOfFreedom : dof;
  const solverText = live ? freeCadSketchLiveSolveStatusText(live) : stateText;
  const issueGeometryText = issueGeometryIndexes.length ? `${t("sketchGeometryList")} ${issueGeometryIndexes.slice(0, 6).join(", ")}` : "";
  return `<div class="sketch-solver-strip ${severity}">
    <strong>${escapeHtml(t("sketchSolverMap"))}: ${escapeHtml(solverText)}</strong>
    <span>${Number.isFinite(Number(displayDof)) ? `${escapeHtml(t("degreesOfFreedom"))} ${escapeHtml(displayDof)}` : escapeHtml(t("degreesOfFreedom"))}</span>
    ${issueGeometryText ? `<span>${escapeHtml(issueGeometryText)}</span>` : ""}
    ${issueIndexes.length ? `<div class="constraint-ref-grid" style="grid-column:1 / -1">
      ${issueIndexes.map((index) => {
        const itemSeverity = conflicts.includes(index) || malformed.includes(index) || issueConstraintIndexes.includes(index) ? "error" : "warning";
        return `<button class="constraint-ref-chip ${itemSeverity}" type="button" onclick="selectFreeCadSketchElement(${escapeHtml(jsString(targetSketchName))}, 'constraint', ${Number(index)}, '', { preserveDryRunReview: true })">
          ${itemSeverity === "error" ? "ERR" : "WARN"} #${Number(index)}
        </button>`;
      }).join("")}
    </div>` : ""}
  </div>`;
}

function freeCadSketchDryRunReviewAppliesTo(sketchName) {
  const review = state.sketchDryRunReview;
  if (!review || !sketchName) return false;
  if (normalizeFreeCadToken(review.sketchName) === normalizeFreeCadToken(sketchName)) return true;
  return (review.issues || []).some((issue) => {
    return normalizeFreeCadToken(issue.sketchName) === normalizeFreeCadToken(sketchName);
  });
}

function freeCadSketchDryRunConstraintIndexes(sketchName = "") {
  const review = state.sketchDryRunReview;
  const indexes = new Set();
  if (!review || (sketchName && !freeCadSketchDryRunReviewAppliesTo(sketchName))) return indexes;
  for (const issue of review.issues || []) {
    if (sketchName && issue.sketchName && normalizeFreeCadToken(issue.sketchName) !== normalizeFreeCadToken(sketchName)) continue;
    for (const value of issue.constraintIndexes || []) {
      const index = Number(value);
      if (Number.isFinite(index)) indexes.add(index);
    }
  }
  return indexes;
}

function freeCadSketchDryRunGeometryIndexes(sketchName = "") {
  const review = state.sketchDryRunReview;
  const indexes = new Set();
  if (!review || (sketchName && !freeCadSketchDryRunReviewAppliesTo(sketchName))) return indexes;
  for (const issue of review.issues || []) {
    if (sketchName && issue.sketchName && normalizeFreeCadToken(issue.sketchName) !== normalizeFreeCadToken(sketchName)) continue;
    for (const value of issue.geometryIndexes || []) {
      const index = Number(value);
      if (Number.isFinite(index)) indexes.add(index);
    }
  }
  for (const patch of review.patch?.patches || []) {
    if (sketchName && normalizeFreeCadToken(patch.selector?.name || patch.selector?.label) !== normalizeFreeCadToken(sketchName)) continue;
    const index = Number(patch.geometry_index ?? patch.index);
    if (Number.isFinite(index)) indexes.add(index);
  }
  return indexes;
}

function freeCadSketchIssueConstraintIndexes(sketchName = "") {
  return new Set([
    ...freeCadSketchDryRunConstraintIndexes(sketchName),
    ...freeCadSketchLiveSolveConstraintIndexes(sketchName),
  ]);
}

function freeCadSketchIssueGeometryIndexes(sketchName = "") {
  return new Set([
    ...freeCadSketchDryRunGeometryIndexes(sketchName),
    ...freeCadSketchLiveSolveGeometryIndexes(sketchName),
  ]);
}

function freeCadSketchPreviewIssueKey(issue) {
  return [
    issue.severity || "",
    issue.code || "",
    issue.message || "",
    (issue.constraintIndexes || []).join(","),
    (issue.geometryIndexes || []).join(","),
  ].join("|");
}

function freeCadSketchPreviewAddIssue(issues, issue) {
  if (!issue?.message && !issue?.code) return;
  const normalized = {
    severity: issue.severity || "warning",
    code: issue.code || "solver_preview",
    message: issue.message || issue.error || "Sketch solver preview issue",
    sketchName: issue.sketchName || "",
    constraintIndexes: (issue.constraintIndexes || []).map(Number).filter(Number.isFinite),
    geometryIndexes: (issue.geometryIndexes || []).map(Number).filter(Number.isFinite),
    status: issue.status || "",
  };
  const key = freeCadSketchPreviewIssueKey(normalized);
  if (!issues.some((item) => freeCadSketchPreviewIssueKey(item) === key)) issues.push(normalized);
}

function freeCadSketchPreviewConstraintIndexes(value) {
  return Array.isArray(value) ? value.map(Number).filter(Number.isFinite) : [];
}

function freeCadSketchPreviewAppendDiagnostics(issues, diagnostics, sketchName = "") {
  if (!diagnostics || typeof diagnostics !== "object") return;
  for (const [key, severity] of [
    ["conflicting_constraints", "error"],
    ["malformed_constraints", "error"],
    ["redundant_constraints", "warning"],
  ]) {
    const values = freeCadSketchPreviewConstraintIndexes(diagnostics[key]);
    if (values.length) {
      freeCadSketchPreviewAddIssue(issues, {
        severity,
        code: key,
        message: `${key}: ${values.join(", ")}`,
        sketchName,
        constraintIndexes: values,
      });
    }
  }
  if (Array.isArray(diagnostics.missing_point_on_point) && diagnostics.missing_point_on_point.length) {
    freeCadSketchPreviewAddIssue(issues, {
      severity: "warning",
      code: "missing_point_on_point",
      message: JSON.stringify(diagnostics.missing_point_on_point.slice(0, 4)),
      sketchName,
    });
  }
  for (const item of freeCadDiagnosticItems(diagnostics)) {
    freeCadSketchPreviewAddIssue(issues, {
      severity: item.severity || diagnostics.severity || "warning",
      code: item.code || item.status || "diagnostic",
      message: item.message || item.error || JSON.stringify(item),
      sketchName,
    });
  }
}

function freeCadSketchPreviewAppendSketchSummary(issues, sketch, sketchName = "") {
  if (!sketch) return;
  const name = sketchName || sketch.name || sketch.label || "";
  const editMode = sketch.edit_mode || {};
  freeCadSketchPreviewAppendDiagnostics(issues, editMode, name);
  const solver = sketch.solver || {};
  if (solver.error) {
    freeCadSketchPreviewAddIssue(issues, {
      severity: "error",
      code: "solver_error",
      message: solver.error,
      sketchName: name,
    });
  }
  for (const geometry of Array.isArray(sketch.geometry) ? sketch.geometry : []) {
    const severity = freeCadSketchGeometrySeverity(geometry);
    if (!severity || severity === "info") continue;
    freeCadSketchPreviewAddIssue(issues, {
      severity,
      code: geometry.solver_status || geometry.diagnostic_severity || "geometry_diagnostic",
      message: freeCadSketchGeometryText(geometry),
      sketchName: name,
      geometryIndexes: [geometry.index],
      constraintIndexes: geometry.constraint_indexes || [],
    });
  }
}

function freeCadSketchPreviewIssues(preview) {
  const issues = [];
  if (!preview) return issues;
  if (preview.ok === false || preview.error) {
    freeCadSketchPreviewAddIssue(issues, {
      severity: "error",
      code: "dry_run_failed",
      message: preview.error || t("log.unknownError"),
    });
  }
  for (const result of preview.patch_results || []) {
    const sketchName = result.sketch?.name || result.object?.name || result.object?.label || "";
    if (result.error) {
      freeCadSketchPreviewAddIssue(issues, {
        severity: "error",
        code: result.op || "patch_result",
        message: result.error,
        sketchName,
      });
    }
    if (result.valid === false) {
      freeCadSketchPreviewAddIssue(issues, {
        severity: "error",
        code: `${result.op || "sketch"}.invalid`,
        message: result.message || "Sketch is invalid after preview solve",
        sketchName,
      });
    }
    if (result.solver?.error) {
      freeCadSketchPreviewAddIssue(issues, {
        severity: "error",
        code: "solver_error",
        message: result.solver.error,
        sketchName,
      });
    }
    freeCadSketchPreviewAppendDiagnostics(issues, result.diagnostics, sketchName);
    freeCadSketchPreviewAppendSketchSummary(issues, result.sketch_summary, sketchName);
  }
  for (const obj of Array.isArray(preview.document_summary?.objects) ? preview.document_summary.objects : []) {
    if (obj?.sketch) freeCadSketchPreviewAppendSketchSummary(issues, obj.sketch, obj.name || obj.label || "");
  }
  return issues;
}

function freeCadSketchPreviewBlocksCommit(preview) {
  return freeCadSketchPreviewIssues(preview).some((issue) => {
    const severity = String(issue.severity || "").toLowerCase();
    const code = String(issue.code || "").toLowerCase();
    return severity === "error"
      || code.includes("conflict")
      || code.includes("malformed")
      || code.includes("redundant")
      || code.includes("dry_run_failed");
  });
}

function freeCadSketchReviewCanCommit(parsedPatch) {
  return (parsedPatch?.patches || []).some((patch) => {
    return !["solver_status", "validate_sketch"].includes(String(patch?.op || ""));
  });
}

function freeCadSketchDryRunReviewMessage(review) {
  const first = (review?.issues || [])[0];
  if (!first) return t("notAvailable");
  return [first.code, first.message].filter(Boolean).join(": ");
}

function renderFreeCadSketchDryRunReview(obj) {
  const sketchName = freeCadObjectKey(obj);
  const review = state.sketchDryRunReview;
  if (!review || !freeCadSketchDryRunReviewAppliesTo(sketchName)) return "";
  const issues = review.issues || [];
  const constraints = Array.from(freeCadSketchDryRunConstraintIndexes(sketchName)).slice(0, 4);
  return `<div class="sketch-preview-review">
    <strong>${escapeHtml(t("sketchDryRunReview"))}</strong>
    <span>${escapeHtml(review.patch?.name || review.detail || freeCadSketchDryRunReviewMessage(review))}</span>
    <div class="diagnostic-list">
      ${issues.slice(0, 8).map((issue) => `<div class="diagnostic-row ${freeCadDiagnosticCssClass(issue)}">
        <strong>${escapeHtml(issue.code || issue.severity || "solver_preview")}</strong>
        <span>${escapeHtml([issue.message, issue.constraintIndexes?.length ? `constraints ${issue.constraintIndexes.join(",")}` : "", issue.geometryIndexes?.length ? `geometry ${issue.geometryIndexes.join(",")}` : ""].filter(Boolean).join(" · "))}</span>
      </div>`).join("")}
    </div>
	  <div class="feature-actions" style="margin-top:10px">
	    <button class="typed-action-button" type="button" onclick="clearFreeCadSketchDryRunReview()">${icon("undo")} ${escapeHtml(t("revertDrag"))}</button>
	    ${freeCadSketchReviewCanCommit(review.patch) ? `<button class="typed-action-button" type="button" onclick="commitFreeCadSketchDryRunReview()">${icon("redo")} ${escapeHtml(t("commitAnyway"))}</button>` : ""}
	    ${constraints.map((index) => `
	      <button class="typed-action-button" type="button" onclick="resolveFreeCadSketchDryRunConstraint(${Number(index)}, 'disable')">${icon("trash")} ${escapeHtml(t("disableConstraint", { index }))}</button>
	      <button class="typed-action-button" type="button" onclick="resolveFreeCadSketchDryRunConstraint(${Number(index)}, 'reference')">${icon("ruler")} ${escapeHtml(t("makeReference", { index }))}</button>
      `).join("")}
    </div>
  </div>`;
}

function renderFreeCadSketchConstraintList(obj, constraints, editMode = null) {
  if (!constraints.length) return "";
  const sketchName = freeCadObjectKey(obj);
  const issueConstraints = freeCadSketchIssueConstraintIndexes(sketchName);
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchConstraintList"))}</p>
    <div class="subelement-grid">
      ${constraints.slice(0, 24).map((constraint) => {
        const label = `${freeCadConstraintGlyphText(constraint)} ${constraint.name || constraint.type || "Constraint"}`;
        const selected = freeCadSketchElementSelected(sketchName, "constraint", constraint.index);
        const previewSeverity = issueConstraints.has(Number(constraint.index)) ? "error" : "";
        return `<div class="subelement-row ${selected ? "active" : previewSeverity || freeCadConstraintSeverity(constraint, editMode)}" onclick="selectFreeCadSketchElement(${escapeHtml(jsString(sketchName))}, 'constraint', ${Number(constraint.index) || 0})">
          <strong>#${escapeHtml(constraint.index ?? "")}</strong>
          <span title="${escapeHtml(freeCadConstraintText(constraint))}">${escapeHtml([label, freeCadConstraintText(constraint)].filter(Boolean).join(" · "))}</span>
          <button class="icon-button" type="button" title="${escapeHtml(t("removeConstraint"))}" onclick="event.stopPropagation(); removeFreeCadSketchConstraint(${escapeHtml(jsString(sketchName))}, ${Number(constraint.index) || 0})">${icon("trash")}</button>
        </div>`;
      }).join("")}
    </div>`;
}

function freeCadSketchConstraintButton(labelKey, iconName, onclick, disabled = false, title = "") {
  return `<button class="typed-action-button" type="button" ${disabled ? "disabled" : `onclick="${escapeHtml(onclick)}"`} title="${escapeHtml(title || t(labelKey))}">
    ${icon(iconName)} ${escapeHtml(t(labelKey))}
  </button>`;
}

function freeCadSketchConstraintActionButton(label, iconName, onclick, disabled = false, title = "") {
  return `<button class="typed-action-button" type="button" ${disabled ? "disabled" : `onclick="${escapeHtml(onclick)}"`} title="${escapeHtml(title || label)}">
    ${icon(iconName)} ${escapeHtml(label)}
  </button>`;
}

function freeCadSketchIssueRowKey(row) {
  return [
    row.source || "",
    row.code || "",
    row.severity || "",
    (row.constraintIndexes || []).join(","),
    (row.geometryIndexes || []).join(","),
    row.message || "",
  ].join("|");
}

function freeCadSketchConstraintGeometryIndexes(obj, constraintIndex) {
  const constraint = freeCadSketchConstraintByIndex(obj, constraintIndex);
  return freeCadConstraintInternalGeometryRefs(constraint).map((ref) => Number(ref.geometryIndex)).filter(Number.isFinite);
}

function freeCadSketchIssueAddRow(rows, row) {
  const normalized = {
    source: row.source || "",
    code: row.code || "solver_issue",
    severity: row.severity || "warning",
    message: row.message || "",
    constraintIndexes: (row.constraintIndexes || []).map(Number).filter(Number.isFinite),
    geometryIndexes: (row.geometryIndexes || []).map(Number).filter(Number.isFinite),
  };
  const key = freeCadSketchIssueRowKey(normalized);
  if (!rows.some((item) => freeCadSketchIssueRowKey(item) === key)) rows.push(normalized);
}

function freeCadSketchIssueAddConstraintRows(rows, obj, indexes, code, severity, message) {
  for (const value of indexes || []) {
    const index = Number(value);
    if (!Number.isFinite(index)) continue;
    freeCadSketchIssueAddRow(rows, {
      source: t("sketchSolverMap"),
      code,
      severity,
      message: message || `${code}: #${index}`,
      constraintIndexes: [index],
      geometryIndexes: freeCadSketchConstraintGeometryIndexes(obj, index),
    });
  }
}

function freeCadSketchIssueRows(obj, sketch, editMode = {}) {
  const rows = [];
  const sketchName = freeCadObjectKey(obj);
  freeCadSketchIssueAddConstraintRows(rows, obj, editMode.conflicting_constraints, "conflicting_constraints", "error", t("conflictingConstraints"));
  freeCadSketchIssueAddConstraintRows(rows, obj, editMode.malformed_constraints, "malformed_constraints", "error", t("malformedConstraints"));
  freeCadSketchIssueAddConstraintRows(rows, obj, editMode.redundant_constraints, "redundant_constraints", "warning", t("redundantConstraints"));
  for (const issue of state.sketchDryRunReview?.issues || []) {
    if (issue.sketchName && normalizeFreeCadToken(issue.sketchName) !== normalizeFreeCadToken(sketchName)) continue;
    const constraintIndexes = (issue.constraintIndexes || []).map(Number).filter(Number.isFinite);
    const geometryIndexes = [
      ...(issue.geometryIndexes || []).map(Number).filter(Number.isFinite),
      ...constraintIndexes.flatMap((index) => freeCadSketchConstraintGeometryIndexes(obj, index)),
    ];
    freeCadSketchIssueAddRow(rows, {
      source: t("sketchDryRunReview"),
      code: issue.code || "dry_run_issue",
      severity: issue.severity || "warning",
      message: issue.message || "",
      constraintIndexes,
      geometryIndexes,
    });
  }
  const live = freeCadSketchLiveSolveForSketch(sketchName);
  for (const issue of live?.issues || []) {
    const constraintIndexes = (issue.constraintIndexes || []).map(Number).filter(Number.isFinite);
    const geometryIndexes = [
      ...(issue.geometryIndexes || []).map(Number).filter(Number.isFinite),
      ...constraintIndexes.flatMap((index) => freeCadSketchConstraintGeometryIndexes(obj, index)),
    ];
    freeCadSketchIssueAddRow(rows, {
      source: t("sketchLiveSolve"),
      code: issue.code || "live_solve_issue",
      severity: issue.severity || "warning",
      message: issue.message || "",
      constraintIndexes,
      geometryIndexes,
    });
  }
  const dof = editMode.degrees_of_freedom ?? sketch?.degrees_of_freedom;
  if (Number.isFinite(Number(dof)) && Number(dof) > 0) {
    freeCadSketchIssueAddRow(rows, {
      source: t("sketchSolverMap"),
      code: "degrees_of_freedom",
      severity: "warning",
      message: `${t("underConstrained")}: ${formatNumber(dof)} ${t("degreesOfFreedom")}`,
    });
  }
  return rows.slice(0, 12);
}

function renderFreeCadSketchSolverIssueActions(obj, row) {
  const objectName = freeCadObjectKey(obj);
  const constraintIndex = (row.constraintIndexes || []).find((value) => Number.isFinite(Number(value)));
  const geometryIndex = (row.geometryIndexes || []).find((value) => Number.isFinite(Number(value)));
  const buttons = [];
  if (Number.isFinite(Number(constraintIndex))) {
    const index = Number(constraintIndex);
    const constraint = freeCadSketchConstraintByIndex(obj, index);
    const activeAvailable = constraint?.active !== undefined;
    const referenceAvailable = constraint?.driving !== undefined || constraint?.reference !== undefined;
    buttons.push(freeCadSketchConstraintActionButton(
      t("focusConstraint", { index }),
      "pointer",
      `selectFreeCadSketchElement(${jsString(objectName)}, 'constraint', ${index}, '', { preserveDryRunReview: true })`
    ));
    if (activeAvailable) {
      buttons.push(freeCadSketchConstraintActionButton(
        t("disableConstraint", { index }),
        "trash",
        `commitFreeCadSketchConstraintState(${jsString(objectName)}, ${index}, 'active', false)`
      ));
    }
    if (referenceAvailable) {
      buttons.push(freeCadSketchConstraintActionButton(
        t("makeReference", { index }),
        "ruler",
        `commitFreeCadSketchConstraintState(${jsString(objectName)}, ${index}, 'reference', true)`
      ));
    }
    buttons.push(freeCadSketchConstraintButton(
      "removeConstraint",
      "trash",
      `removeFreeCadSketchConstraint(${jsString(objectName)}, ${index})`
    ));
  } else if (Number.isFinite(Number(geometryIndex))) {
    const index = Number(geometryIndex);
    buttons.push(freeCadSketchConstraintActionButton(
      t("focusGeometryIndex", { index }),
      "pointer",
      `selectFreeCadSketchElement(${jsString(objectName)}, 'geometry', ${index}, '', { preserveDryRunReview: true })`
    ));
  }
  buttons.push(freeCadSketchConstraintButton(
    "validateSketch",
    "eye",
    `validateFreeCadSketch(${jsString(objectName)})`
  ));
  return `<div class="feature-actions" style="margin-top:8px">${buttons.join("")}</div>`;
}

function renderFreeCadSketchSolverIssuePanel(obj, sketch, editMode = {}) {
  const rows = freeCadSketchIssueRows(obj, sketch, editMode);
  if (!rows.length) return "";
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchSolverIssues"))}</p>
    <div class="diagnostic-list">
      ${rows.map((row) => {
        const constraints = row.constraintIndexes?.length ? `${t("sketchConstraintList")} ${row.constraintIndexes.slice(0, 6).join(", ")}` : "";
        const geometry = row.geometryIndexes?.length ? `${t("sketchGeometryList")} ${row.geometryIndexes.slice(0, 6).join(", ")}` : "";
        return `<div class="diagnostic-row ${freeCadDiagnosticCssClass(row)}">
          <strong>${escapeHtml([row.source, row.code].filter(Boolean).join(": "))}</strong>
          <span>${escapeHtml([row.message, constraints, geometry].filter(Boolean).join(" · "))}</span>
          ${renderFreeCadSketchSolverIssueActions(obj, row)}
        </div>`;
      }).join("")}
    </div>`;
}

function freeCadSketchPointDistance(a, b, mode = "Distance") {
  const first = freeCadTriplet(a?.point);
  const second = freeCadTriplet(b?.point);
  if (!first || !second) return 0;
  const dx = second[0] - first[0];
  const dy = second[1] - first[1];
  const dz = second[2] - first[2];
  if (mode === "DistanceX") return Math.abs(dx);
  if (mode === "DistanceY") return Math.abs(dy);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function freeCadSketchGeometryFromRef(ref) {
  const obj = freeCadObjectByName(ref?.sketchName);
  return obj ? freeCadSketchGeometryByIndex(obj, ref?.geometryIndex) : null;
}

function freeCadSketchGeometryTypeToken(geometry) {
  return normalizeFreeCadToken(geometry?.type || geometry?.geometryType || "");
}

function freeCadSketchGeometryIsLine(geometry) {
  return /line/.test(freeCadSketchGeometryTypeToken(geometry));
}

function freeCadSketchGeometryIsCurve(geometry) {
  return /circle|arc|ellipse/.test(freeCadSketchGeometryTypeToken(geometry));
}

function freeCadSketchGeometryRadiusValue(geometry, mode = "Radius") {
  const radius = Number(geometry?.radius ?? geometry?.major_radius);
  if (!Number.isFinite(radius) || radius <= 0) return 1;
  return mode === "Diameter" ? radius * 2 : radius;
}

function freeCadSketchConstraintNumericValue(type, defaultValue) {
  const raw = window.prompt(t("constraintValuePrompt", { type }), formatNumber(defaultValue));
  if (raw === null) return null;
  const value = Number(raw);
  if (!Number.isFinite(value)) {
    log(t("log.patchFailed", { message: t("constraintValuePrompt", { type }) }));
    return null;
  }
  return value;
}

function renderFreeCadSketchConstraintPalette(obj, geometry) {
  const selectedGeometry = selectedFreeCadSketchGeometry(obj, geometry);
  const objectName = freeCadObjectKey(obj);
  const geometryRef = selectedGeometry ? freeCadSketchGeometryRef(objectName, selectedGeometry.index) : null;
  const geometryAnchor = freeCadSketchGeometryRefStillExists(state.sketchGeometryConstraintAnchor)
    ? state.sketchGeometryConstraintAnchor
    : null;
  const pointRef = selectedFreeCadSketchPointRef();
  const pointAnchor = freeCadSketchPointStillExists(state.sketchCoincidenceAnchor)
    ? state.sketchCoincidenceAnchor
    : null;
  const buttons = [];

  if (selectedGeometry) {
    const sameGeometryAnchor = freeCadSketchGeometryRefsEqual(geometryAnchor, geometryRef);
    buttons.push(freeCadSketchConstraintButton(
      "setGeometryAnchor",
      "pointer",
      `setFreeCadSketchGeometryConstraintAnchor(${jsString(objectName)}, ${Number(selectedGeometry.index) || 0})`,
      false,
      freeCadSketchGeometryLabel(geometryRef)
    ));
    if (geometryAnchor) {
      buttons.push(freeCadSketchConstraintButton(
        "clearGeometryAnchor",
        "pointer",
        "clearFreeCadSketchGeometryConstraintAnchor()",
        false,
        freeCadSketchGeometryLabel(geometryAnchor)
      ));
    }
    for (const [labelKey, constraintType] of [
      ["addHorizontalConstraint", "Horizontal"],
      ["addVerticalConstraint", "Vertical"],
      ["addBlockConstraint", "Block"],
    ]) {
      buttons.push(freeCadSketchConstraintButton(
        labelKey,
        "ruler",
        `addFreeCadSketchConstraint(${jsString(objectName)}, ${jsString(constraintType)}, ${Number(selectedGeometry.index) || 0})`
      ));
    }
    if (Number.isFinite(Number(selectedGeometry.radius ?? selectedGeometry.major_radius))) {
      buttons.push(freeCadSketchConstraintButton(
        "addRadiusConstraint",
        "ruler",
        `addFreeCadSketchRadiusConstraint(${jsString(objectName)}, 'Radius', ${Number(selectedGeometry.index) || 0})`
      ));
      buttons.push(freeCadSketchConstraintButton(
        "addDiameterConstraint",
        "ruler",
        `addFreeCadSketchRadiusConstraint(${jsString(objectName)}, 'Diameter', ${Number(selectedGeometry.index) || 0})`
      ));
    }
    if (geometryAnchor && !sameGeometryAnchor && normalizeFreeCadToken(geometryAnchor.sketchName) === normalizeFreeCadToken(objectName)) {
      const anchorGeometry = freeCadSketchGeometryFromRef(geometryAnchor);
      const bothLines = freeCadSketchGeometryIsLine(anchorGeometry) && freeCadSketchGeometryIsLine(selectedGeometry);
      const hasCurve = freeCadSketchGeometryIsCurve(anchorGeometry) || freeCadSketchGeometryIsCurve(selectedGeometry);
      const pairConstraints = [
        ["addEqualConstraint", "Equal", bothLines || hasCurve],
        ["addParallelConstraint", "Parallel", bothLines],
        ["addPerpendicularConstraint", "Perpendicular", bothLines],
        ["addTangentConstraint", "Tangent", hasCurve],
      ];
      for (const [labelKey, constraintType, supported] of pairConstraints) {
        if (!supported) continue;
        buttons.push(freeCadSketchConstraintButton(
          labelKey,
          "ruler",
          `addFreeCadSketchPairConstraint(${jsString(objectName)}, ${jsString(constraintType)}, ${Number(selectedGeometry.index) || 0})`,
          false,
          `${freeCadSketchGeometryLabel(geometryAnchor)} -> ${freeCadSketchGeometryLabel(geometryRef)}`
        ));
      }
    }
  }

  if (pointRef && pointAnchor && !freeCadSketchPointRefsEqual(pointAnchor, pointRef)
    && normalizeFreeCadToken(pointAnchor.sketchName) === normalizeFreeCadToken(pointRef.sketchName)) {
    for (const [labelKey, constraintType] of [
      ["addDistanceConstraint", "Distance"],
      ["addDistanceXConstraint", "DistanceX"],
      ["addDistanceYConstraint", "DistanceY"],
    ]) {
      buttons.push(freeCadSketchConstraintButton(
        labelKey,
        "ruler",
        `addFreeCadSketchPointDistanceConstraint(${jsString(objectName)}, ${jsString(constraintType)}, ${Number(pointRef.geometryIndex) || 0}, ${jsString(pointRef.pointRole)})`,
        false,
        `${freeCadSketchPointLabel(pointAnchor)} -> ${freeCadSketchPointLabel(pointRef)}`
      ));
    }
  }

  if (pointRef && geometryAnchor
    && normalizeFreeCadToken(geometryAnchor.sketchName) === normalizeFreeCadToken(pointRef.sketchName)
    && Number(geometryAnchor.geometryIndex) !== Number(pointRef.geometryIndex)) {
    buttons.push(freeCadSketchConstraintButton(
      "addPointOnObjectConstraint",
      "ruler",
      `addFreeCadSketchPointOnObjectConstraint(${jsString(objectName)}, ${Number(pointRef.geometryIndex) || 0}, ${jsString(pointRef.pointRole)})`,
      false,
      `${freeCadSketchPointLabel(pointRef)} -> ${freeCadSketchGeometryLabel(geometryAnchor)}`
    ));
  }

  if (!buttons.length) return "";
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchConstraintPalette"))}</p>
    <div class="feature-actions">${buttons.join("")}</div>`;
}

function selectedFreeCadSketchGeometry(obj, geometry) {
  const selected = state.selectedFreeCadSketchElement;
  const sketchName = freeCadObjectKey(obj);
  if (!selected || selected.kind !== "geometry") return null;
  if (normalizeFreeCadToken(selected.sketchName) !== normalizeFreeCadToken(sketchName)) return null;
  return geometry.find((item) => Number(item.index) === Number(selected.index)) || null;
}

function freeCadSketchPointRoles(geometry) {
  return ["start", "end", "center", "location", "point"].filter((key) => freeCadTriplet(geometry?.[key]));
}

function freeCadSketchGeometryByIndex(obj, geometryIndex) {
  return (Array.isArray(obj?.sketch?.geometry) ? obj.sketch.geometry : [])
    .find((item) => Number(item.index) === Number(geometryIndex)) || null;
}

function freeCadSketchGeometryRef(objectName, geometryIndex) {
  const obj = freeCadObjectByName(objectName);
  if (!obj || !freeCadObjectIsSketch(obj)) return null;
  const geometry = freeCadSketchGeometryByIndex(obj, geometryIndex);
  if (!geometry) return null;
  return {
    sketchName: freeCadObjectKey(obj),
    geometryIndex: Number(geometry.index),
    geometryType: geometry.type || "",
  };
}

function freeCadSketchGeometryRefsEqual(a, b) {
  return Boolean(a && b)
    && normalizeFreeCadToken(a.sketchName) === normalizeFreeCadToken(b.sketchName)
    && Number(a.geometryIndex) === Number(b.geometryIndex);
}

function freeCadSketchGeometryRefStillExists(ref) {
  return Boolean(ref && freeCadSketchGeometryRef(ref.sketchName, ref.geometryIndex));
}

function freeCadSketchConstraintByIndex(obj, constraintIndex) {
  return (Array.isArray(obj?.sketch?.constraints) ? obj.sketch.constraints : [])
    .find((item) => Number(item.index) === Number(constraintIndex)) || null;
}

function selectedFreeCadSketchConstraint(obj, constraints) {
  const selected = state.selectedFreeCadSketchElement;
  const sketchName = freeCadObjectKey(obj);
  if (!selected || selected.kind !== "constraint") return null;
  if (normalizeFreeCadToken(selected.sketchName) !== normalizeFreeCadToken(sketchName)) return null;
  return (Array.isArray(constraints) ? constraints : [])
    .find((item) => Number(item.index) === Number(selected.index)) || null;
}

function focusFreeCadSketchConstraintReferences(objectName, constraintIndex) {
  const obj = freeCadObjectByName(objectName);
  const constraint = freeCadSketchConstraintByIndex(obj, constraintIndex);
  if (!obj || !freeCadObjectIsSketch(obj) || !constraint) return false;
  state.previewMode = "generated";
  state.selectedGeneratedParameterName = "";
  state.selectedFreeCadObjectName = freeCadObjectKey(obj);
  state.selectedFreeCadSubelement = null;
  state.selectedFreeCadAssemblyJoint = null;
  cancelFreeCadSketchLiveSolve();
  state.sketchDragPreview = null;
  if (!freeCadSketchDryRunReviewAppliesTo(freeCadObjectKey(obj))) {
    state.sketchDryRunReview = null;
  }
  state.selectedFreeCadSketchElement = {
    sketchName: freeCadObjectKey(obj),
    kind: "constraint",
    index: Number(constraint.index) || 0,
    pointRole: "",
  };
  log(`${freeCadObjectDisplayName(obj)} ${t("constraintReferences")} #${Number(constraint.index) || 0}`);
  persistWorkbenchSession();
  renderAll();
  return true;
}

function renderFreeCadSketchConstraintGlyphActions(obj, constraint, editMode = null) {
  if (!obj || !constraint) return "";
  const objectName = freeCadObjectKey(obj);
  const constraintIndex = Number(constraint.index) || 0;
  const internalRefs = freeCadConstraintInternalGeometryRefs(constraint);
  const activeAvailable = constraint.active !== undefined;
  const referenceAvailable = constraint.driving !== undefined || constraint.reference !== undefined;
  const isActive = constraint.active !== false;
  const isReference = freeCadConstraintIsReference(constraint);
  const buttons = [
    freeCadSketchConstraintButton(
      "focusAllReferences",
      "pointer",
      `focusFreeCadSketchConstraintReferences(${jsString(objectName)}, ${constraintIndex})`,
      !internalRefs.length,
      internalRefs.map(freeCadConstraintRefLabel).join(" -> ") || t("none")
    ),
    freeCadSketchConstraintButton(
      "validateSketch",
      "eye",
      `validateFreeCadSketch(${jsString(objectName)})`
    ),
  ];
  if (activeAvailable) {
    const label = t(isActive ? "disableConstraint" : "enableConstraint", { index: constraintIndex });
    buttons.push(freeCadSketchConstraintActionButton(
      label,
      isActive ? "trash" : "eye",
      `commitFreeCadSketchConstraintState(${jsString(objectName)}, ${constraintIndex}, 'active', ${isActive ? "false" : "true"})`,
      false,
      label
    ));
  }
  if (referenceAvailable) {
    const label = t(isReference ? "makeDriving" : "makeReference", { index: constraintIndex });
    buttons.push(freeCadSketchConstraintActionButton(
      label,
      "ruler",
      `commitFreeCadSketchConstraintState(${jsString(objectName)}, ${constraintIndex}, 'reference', ${isReference ? "false" : "true"})`,
      false,
      label
    ));
  }
  buttons.push(freeCadSketchConstraintButton(
    "removeConstraint",
    "trash",
    `removeFreeCadSketchConstraint(${jsString(objectName)}, ${constraintIndex})`
  ));
  return `<div class="feature-actions">${buttons.join("")}</div>`;
}

function renderFreeCadSketchConstraintEditor(obj, constraints, editMode = null) {
  const constraint = selectedFreeCadSketchConstraint(obj, constraints);
  if (!constraint) return "";
  const objectName = freeCadObjectKey(obj);
  const constraintIndex = Number(constraint.index) || 0;
  const id = `freecad-constraint-name-${safeDomId(objectName)}-${safeDomId(constraintIndex)}`;
  const activeAvailable = constraint.active !== undefined;
  const drivingAvailable = constraint.driving !== undefined;
  const issueConstraints = freeCadSketchIssueConstraintIndexes(objectName);
  const severity = issueConstraints.has(Number(constraint.index)) ? "error" : freeCadConstraintSeverity(constraint, editMode);
  const glyphLabel = `${freeCadConstraintGlyphText(constraint)} #${constraintIndex}`;
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchConstraintEditor"))} #${escapeHtml(constraint.index)}</p>
    <div class="constraint-glyph-card ${severity}">
      <div class="constraint-glyph-header">
        <span class="constraint-glyph-mark">${escapeHtml(freeCadConstraintGlyphText(constraint))}</span>
        <div class="constraint-glyph-copy">
          <strong>${escapeHtml(glyphLabel)} ${escapeHtml(constraint.type || "Constraint")}</strong>
          <span>${escapeHtml(freeCadConstraintText(constraint) || t("notAvailable"))}</span>
        </div>
      </div>
      ${renderFreeCadConstraintRefChips(obj, constraint, editMode)}
      ${renderFreeCadSketchConstraintGlyphActions(obj, constraint, editMode)}
    </div>
    <div class="param-row">
      <label for="${escapeHtml(id)}">${escapeHtml(t("constraintName"))}</label>
      <input class="param-input" id="${escapeHtml(id)}" type="text" value="${escapeHtml(constraint.name || "")}" onchange="commitFreeCadSketchConstraintName(${escapeHtml(jsString(objectName))}, ${constraintIndex}, this.value)" />
      <span class="unit"></span>
    </div>
    <div class="feature-actions">
      ${activeAvailable ? `<label class="typed-action-toggle"><input type="checkbox" ${constraint.active !== false ? "checked" : ""} onchange="commitFreeCadSketchConstraintState(${escapeHtml(jsString(objectName))}, ${constraintIndex}, 'active', this.checked)" /> ${escapeHtml(t("constraintActive"))}</label>` : ""}
      ${drivingAvailable ? `<label class="typed-action-toggle"><input type="checkbox" ${constraint.driving === false ? "checked" : ""} onchange="commitFreeCadSketchConstraintState(${escapeHtml(jsString(objectName))}, ${constraintIndex}, 'reference', this.checked)" /> ${escapeHtml(t("constraintReference"))}</label>` : ""}
      <button class="typed-action-button" type="button" onclick="removeFreeCadSketchConstraint(${escapeHtml(jsString(objectName))}, ${constraintIndex})">${icon("trash")} ${escapeHtml(t("removeConstraint"))}</button>
    </div>`;
}

function freeCadSketchPointPositionForRole(role) {
  const key = normalizeFreeCadToken(role);
  if (key === "start" || key === "startpoint") return 1;
  if (key === "end" || key === "endpoint") return 2;
  if (key === "center" || key === "centre" || key === "location") return 3;
  return 1;
}

function freeCadSketchPointRef(objectName, geometryIndex, pointRole) {
  const obj = freeCadObjectByName(objectName);
  if (!obj || !freeCadObjectIsSketch(obj) || !pointRole) return null;
  const geometry = freeCadSketchGeometryByIndex(obj, geometryIndex);
  const point = freeCadTriplet(geometry?.[pointRole]);
  if (!geometry || !point) return null;
  return {
    sketchName: freeCadObjectKey(obj),
    geometryIndex: Number(geometry.index),
    pointRole,
    pointPos: freeCadSketchPointPositionForRole(pointRole),
    point,
  };
}

function selectedFreeCadSketchPointRef() {
  const selected = state.selectedFreeCadSketchElement;
  if (!selected || selected.kind !== "geometry" || !selected.pointRole) return null;
  return freeCadSketchPointRef(selected.sketchName, selected.index, selected.pointRole);
}

function freeCadSketchPointRefsEqual(a, b) {
  return Boolean(a && b)
    && normalizeFreeCadToken(a.sketchName) === normalizeFreeCadToken(b.sketchName)
    && Number(a.geometryIndex) === Number(b.geometryIndex)
    && normalizeFreeCadToken(a.pointRole) === normalizeFreeCadToken(b.pointRole);
}

function freeCadSketchPointStillExists(ref) {
  return Boolean(ref && freeCadSketchPointRef(ref.sketchName, ref.geometryIndex, ref.pointRole));
}

function freeCadSketchGeometryLabel(ref) {
  const obj = freeCadObjectByName(ref?.sketchName);
  const geometry = obj ? freeCadSketchGeometryByIndex(obj, ref?.geometryIndex) : null;
  if (!obj || !ref) return "";
  return `${freeCadObjectDisplayName(obj)} #${Number(ref.geometryIndex)} ${geometry?.type || ref.geometryType || ""}`.trim();
}

function freeCadSketchElementStillExists(selected) {
  if (!selected?.sketchName) return false;
  const obj = freeCadObjectByName(selected.sketchName);
  if (!obj || !freeCadObjectIsSketch(obj)) return false;
  if (selected.kind === "constraint") return Boolean(freeCadSketchConstraintByIndex(obj, selected.index));
  const geometry = freeCadSketchGeometryByIndex(obj, selected.index);
  if (!geometry) return false;
  if (selected.pointRole) return Boolean(freeCadTriplet(geometry[selected.pointRole]));
  return true;
}

function freeCadSketchPointLabel(ref) {
  const obj = freeCadObjectByName(ref?.sketchName);
  if (!obj || !ref) return "";
  return `${freeCadObjectDisplayName(obj)} #${Number(ref.geometryIndex)}.${ref.pointRole}`;
}

function renderFreeCadSketchPointEditor(obj, geometry) {
  const selected = selectedFreeCadSketchGeometry(obj, geometry);
  const roles = selected ? freeCadSketchPointRoles(selected) : [];
  if (!selected || !roles.length) return "";
  const objectName = freeCadObjectKey(obj);
  const pointRef = selectedFreeCadSketchPointRef();
  const anchor = freeCadSketchPointStillExists(state.sketchCoincidenceAnchor) ? state.sketchCoincidenceAnchor : null;
  const canAddCoincident = Boolean(pointRef && anchor)
    && normalizeFreeCadToken(anchor.sketchName) === normalizeFreeCadToken(objectName)
    && !freeCadSketchPointRefsEqual(anchor, pointRef);
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t("sketchPointEditor"))} #${escapeHtml(selected.index)}</p>
    ${roles.map((role) => {
      const point = freeCadTriplet(selected[role]) || [0, 0, 0];
      return ["X", "Y", "Z"].map((axis, axisIndex) => {
        const id = `freecad-sketch-point-${safeDomId(objectName)}-${safeDomId(selected.index)}-${safeDomId(role)}-${axis}`;
        return `<div class="param-row">
          <label for="${escapeHtml(id)}">${escapeHtml(role)} ${axis}</label>
          <input class="param-input" id="${escapeHtml(id)}" type="number" step="0.5" value="${escapeHtml(formatNumber(point[axisIndex]))}" onchange="commitFreeCadSketchGeometryPoint(${escapeHtml(jsString(objectName))}, ${Number(selected.index)}, ${escapeHtml(jsString(role))}, ${axisIndex}, this.value)" />
          <span class="unit">${escapeHtml(t("unitMm"))}</span>
        </div>`;
      }).join("");
    }).join("")}
	    <div class="feature-actions">
	      <button class="typed-action-button" type="button" onclick="addFreeCadSketchConstraint(${escapeHtml(jsString(objectName))}, 'Horizontal', ${Number(selected.index)})">${icon("ruler")} ${escapeHtml(t("addHorizontalConstraint"))}</button>
	      <button class="typed-action-button" type="button" onclick="addFreeCadSketchConstraint(${escapeHtml(jsString(objectName))}, 'Vertical', ${Number(selected.index)})">${icon("ruler")} ${escapeHtml(t("addVerticalConstraint"))}</button>
	      <label class="typed-action-toggle"><input type="checkbox" ${selected.construction ? "checked" : ""} onchange="toggleFreeCadSketchGeometryConstruction(${escapeHtml(jsString(objectName))}, ${Number(selected.index)}, this.checked)" /> ${icon("layers")} ${escapeHtml(t("toggleConstruction"))}</label>
      ${pointRef ? `<button class="typed-action-button ${freeCadSketchPointRefsEqual(anchor, pointRef) ? "active" : ""}" type="button" onclick="setFreeCadSketchCoincidenceAnchor(${escapeHtml(jsString(objectName))}, ${Number(selected.index)}, ${escapeHtml(jsString(pointRef.pointRole))})" title="${escapeHtml(freeCadSketchPointLabel(pointRef))}">${icon("pointer")} ${escapeHtml(t("setCoincidenceAnchor"))}</button>` : ""}
	      ${anchor ? `<button class="typed-action-button" type="button" onclick="clearFreeCadSketchCoincidenceAnchor()" title="${escapeHtml(freeCadSketchPointLabel(anchor))}">${icon("pointer")} ${escapeHtml(t("clearCoincidenceAnchor"))}</button>` : ""}
	      ${pointRef && anchor ? `<button class="typed-action-button" type="button" ${canAddCoincident ? `onclick="addFreeCadSketchCoincidentConstraint(${escapeHtml(jsString(objectName))}, ${Number(selected.index)}, ${escapeHtml(jsString(pointRef.pointRole))})"` : "disabled"} title="${escapeHtml(freeCadSketchPointLabel(anchor))}">${icon("ruler")} ${escapeHtml(t("addCoincidentConstraint"))}</button>` : ""}
	    </div>
	    ${renderFreeCadSketchGeometryConstraintRefs(obj, selected)}`;
}

function freeCadEditableProperties(obj) {
  return (Array.isArray(obj?.properties) ? obj.properties : []).filter((prop) => {
    if (!prop?.name || !Number.isFinite(Number(prop.value))) return false;
    if (["Visibility"].includes(prop.name)) return false;
    const type = String(prop.type || "");
    if (/Bool|Enumeration|String|Link|PythonObject|File|Color|Material/i.test(type)) return false;
    return true;
  });
}

function freeCadReadonlyProperties(obj) {
  const editableNames = new Set(freeCadEditableProperties(obj).map((prop) => prop.name));
  return (Array.isArray(obj?.properties) ? obj.properties : []).filter((prop) => {
    return prop?.name && !editableNames.has(prop.name) && prop.value !== "<omitted>" && prop.value !== "<unreadable>";
  });
}

function freeCadPropertyUnit(prop) {
  const token = `${prop?.name || ""} ${prop?.type || ""}`.toLowerCase();
  if (/angle|degree/.test(token)) return "deg";
  if (/length|width|height|radius|diameter|distance|offset|position|placement/.test(token)) return t("unitMm");
  return "";
}

function freeCadPropertyValueText(value) {
  if (Array.isArray(value)) return `[${value.map((item) => Number.isFinite(Number(item)) ? formatNumber(item) : String(item)).join(", ")}]`;
  if (value && typeof value === "object") return JSON.stringify(value);
  if (Number.isFinite(Number(value))) return formatNumber(value);
  return String(value ?? "");
}

function freeCadPropertyRow(obj, prop) {
  const objectName = freeCadObjectKey(obj);
  const id = `freecad-prop-${safeDomId(objectName)}-${safeDomId(prop.name)}`;
  return `<div class="param-row">
    <label for="${escapeHtml(id)}" title="${escapeHtml(prop.name)}">${escapeHtml(prop.name)} <span>${escapeHtml(prop.group || "")}</span></label>
    <input class="param-input" id="${escapeHtml(id)}" type="number" step="0.5" value="${escapeHtml(formatNumber(prop.value))}" onchange="commitFreeCadObjectProperty(${escapeHtml(jsString(objectName))}, ${escapeHtml(jsString(prop.name))}, this.value)" />
    <span class="unit">${escapeHtml(freeCadPropertyUnit(prop))}</span>
  </div>`;
}

function freeCadPlacementRow(obj, axis, index) {
  const objectName = freeCadObjectKey(obj);
  const value = Number(obj?.placement?.base?.[index] || 0);
  const id = `freecad-placement-${safeDomId(objectName)}-${axis}`;
  return `<div class="param-row">
    <label for="${escapeHtml(id)}">${escapeHtml(axis)}</label>
    <input class="param-input" id="${escapeHtml(id)}" type="number" step="0.5" value="${escapeHtml(formatNumber(value))}" onchange="commitFreeCadPlacementComponent(${escapeHtml(jsString(objectName))}, ${index}, this.value)" />
    <span class="unit">${escapeHtml(t("unitMm"))}</span>
  </div>`;
}

function freeCadConstraintRow(obj, constraint) {
  const objectName = freeCadObjectKey(obj);
  const label = constraint.name || `${constraint.type || "Constraint"} #${constraint.index}`;
  const id = `freecad-constraint-${safeDomId(objectName)}-${safeDomId(constraint.index)}`;
  return `<div class="param-row">
    <label for="${escapeHtml(id)}" title="${escapeHtml(label)}">${escapeHtml(label)} <span>#${escapeHtml(constraint.index)}</span></label>
    <input class="param-input" id="${escapeHtml(id)}" type="number" step="0.5" value="${escapeHtml(formatNumber(constraint.value))}" onchange="commitFreeCadConstraintValue(${escapeHtml(jsString(objectName))}, ${Number(constraint.index)}, this.value)" />
    <span class="unit">${escapeHtml(t("unitMm"))}</span>
  </div>`;
}

function renderGeneratedParameterSection() {
  const params = state.generatedParameters || [];
  const selected = selectedGeneratedParameter();
  if (!params.length) {
    return `<section class="section">
      <h3>${icon("ruler")} ${escapeHtml(t("scriptParameters"))}</h3>
      <p class="section-note">${escapeHtml(t("noScriptParameters"))}</p>
    </section>`;
  }
  if (!selected) {
    return `<section class="section">
      <h3>${icon("ruler")} ${escapeHtml(t("scriptParameters"))}</h3>
      <p class="section-note">${escapeHtml(t("scriptParametersHint"))}</p>
      ${params.map((param) => generatedParamRow(param)).join("")}
    </section>`;
  }

  const related = relatedGeneratedParameters(selected, params);
  const relatedNames = new Set(related.map((param) => param.name));
  const others = params.filter((param) => !relatedNames.has(param.name));
  return `
    <section class="section">
      <h3>${icon("ruler")} ${escapeHtml(t("selectedParameter"))}</h3>
      <div class="selected-param-summary">
        <strong>${escapeHtml(generatedSelectionLabel(selected))}</strong>
        <span>${escapeHtml(generatedParameterValueText(selected))}</span>
      </div>
      <p class="section-note">${escapeHtml(t("relatedParameters"))}</p>
      ${related.map((param) => generatedParamRow(param)).join("")}
    </section>
    ${others.length ? `<section class="section">
      <h3>${icon("ruler")} ${escapeHtml(t("allScriptParameters"))}</h3>
      ${others.map((param) => generatedParamRow(param)).join("")}
    </section>` : ""}
  `;
}

function generatedParamRow(param) {
  const name = String(param.name || "");
  const value = Number(param.value);
  const unit = generatedParameterUnit(param);
  const id = `generated-param-${safeDomId(name)}`;
  return `<div class="param-row">
    <label for="${escapeHtml(id)}" title="${escapeHtml(name)}">${escapeHtml(generatedParameterLabel(param))} <span>${escapeHtml(name)}</span></label>
    <input class="param-input" id="${escapeHtml(id)}" type="number" step="0.5" value="${escapeHtml(formatNumber(value))}" onchange="commitGeneratedParameter(${escapeHtml(jsString(name))}, this.value)" />
    <span class="unit">${escapeHtml(unit)}</span>
  </div>`;
}

function paramRow(name) {
  const value = state.designState.parameters[name];
  return `<div class="param-row">
    <label for="param-${name}">${escapeHtml(parameterLabel(name))}</label>
    <input class="param-input" id="param-${name}" type="number" step="0.5" value="${escapeHtml(formatNumber(value))}" onchange="commitParameter('${name}', this.value)" />
    <span class="unit">${escapeHtml(t("unitMm"))}</span>
  </div>`;
}

function renderBottomTabs() {
  const tabs = [
    ["chat", "tabs.chat", "pointer"],
    ["history", "tabs.history", "undo"],
    ["script", "tabs.script", "code"],
    ["logs", "tabs.logs", "code"],
    ["artifacts", "tabs.artifacts", "download"],
  ];
  $("bottomTabs").innerHTML = tabs.map(([id, labelKey, iconName]) =>
    `<button class="tab-button ${state.bottomTab === id ? "active" : ""}" type="button" onclick="setBottomTab('${id}')">${icon(iconName)}${escapeHtml(t(labelKey))}</button>`
  ).join("");
}

function renderBottom() {
  renderBottomTabs();
  if (state.bottomTab === "chat") {
    $("bottomContent").innerHTML = `<div class="chat-panel"><div class="chat-list">${renderGenerationActivityChatMessage()}${state.chatMessages.map((item) => `
      <article class="chat-message ${item.role === "user" ? "user" : ""}">
        <strong>${item.role === "user" ? escapeHtml(t("chat.you")) : escapeHtml(t("chat.agent"))}</strong>
        <span>${escapeHtml(chatText(item))}</span>
      </article>
    `).join("")}</div></div>`;
    return;
  }
  if (state.bottomTab === "history") {
    $("bottomContent").innerHTML = `<div class="history-list">${state.history.map((item) => `
      <article class="history-item">
        <div>
          <header><span>${escapeHtml(item.label)}</span><span>v${item.version}</span></header>
          <p>${escapeHtml(item.detail)}</p>
        </div>
        ${item.serverVersionId ? `<button class="history-action" type="button" onclick="rollbackToServerVersion(${escapeHtml(jsString(item.serverVersionId))})" ${item.serverVersionId === state.activeServerVersionId ? "disabled" : ""}>${escapeHtml(t("restore"))}</button>` : ""}
      </article>
    `).join("")}</div>`;
    return;
  }
  if (state.bottomTab === "script") {
    const scriptMeta = {
      engine: state.engine,
      freecad_version: state.freecadVersion || null,
      patch: state.patch || { op: "noop" },
      document_geometry: state.documentSummary?.geometry || null,
    };
    $("bottomContent").innerHTML = `<div class="script-grid">
      <pre>${escapeHtml(JSON.stringify(scriptMeta, null, 2))}</pre>
      <pre>${escapeHtml(state.script || t("noScript"))}</pre>
    </div>`;
    return;

  if (state.bottomTab === "logs") {
    $("bottomContent").innerHTML = `<div class="log-list">${state.logs.map((line) => `<div class="log-item">${escapeHtml(line)}</div>`).join("")}</div>`;
    return;
  }
  $("bottomContent").innerHTML = `<div class="artifact-grid">${artifactCards().join("")}</div>`;
}

function artifactCards() {
  const artifacts = [
	    ["step", "artifact.stepTitle", ".step", "artifact.sandboxExport", "ready", true],
	    ["stl", "artifact.stlTitle", ".stl", "artifact.sandboxExport", "ready", true],
	    ["viewer_scene", "artifact.viewerSceneTitle", ".json", "artifact.viewerSceneJson", "ready", true, "viewer-scene.json"],
	    ["feature_tree", "artifact.featureTreeTitle", ".json", "artifact.liveJson", "ready", true],
    ["fcstd", "artifact.fcstdTitle", ".FCStd", "artifact.plannedFreecad", "ready", true],
    ["techdraw_pdf", "artifact.pdfTitle", ".pdf", "artifact.techdrawFallback", "ready", true, "drawing.pdf"],
    ["techdraw_svg", "artifact.svgTitle", ".svg", "artifact.techdrawFallback", "ready", true, "drawing.svg"],
    ["techdraw_dxf", "artifact.dxfTitle", ".dxf", "artifact.techdrawFallback", "ready", true, "drawing.dxf"],
  ];
  return artifacts.map(([key, titleKey, ext, detailKey, readyStatus, implemented, filename]) => {
    const value = key === "feature_tree" ? btoa(unescape(encodeURIComponent(JSON.stringify(exportStateSnapshot(), null, 2)))) : state.artifacts[key];
    const ref = key === "feature_tree" ? null : artifactRef(key);
    const status = value || ref ? readyStatus : (implemented ? "notReady" : "planned");
    const href = value ? dataUrl(artifactMime(key), value) : (ref?.url || "");
    const download = filename || (key === "feature_tree" ? "feature-tree.json" : key === "fcstd" ? "model.FCStd" : `model.${key}`);
    return `<article class="artifact-card">
      <div>
        <div class="artifact-title"><span>${escapeHtml(t(titleKey))}</span><span class="artifact-ext">${escapeHtml(ext)}</span></div>

const FREECAD_SKETCH_SOLVER_PATCH_OPS = new Set([
  "add_geometry",
  "set_constraint_value",
  "set_geometry_point",
  "move_geometry",
  "move_sketch_geometry",
  "set_geometry_construction",
  "toggle_geometry_construction",
  "add_constraint",
  "remove_constraint",
  "set_constraint_state",
  "add_endpoint_coincidence",
  "solver_status",
  "validate_sketch",
]);

function freeCadPatchAffectsSketchSolver(patch) {
  return FREECAD_SKETCH_SOLVER_PATCH_OPS.has(String(patch?.op || ""));
}

function freeCadPatchSketchSelector(patch) {
  const selector = patch?.sketch_selector || patch?.selector;
  return selector && typeof selector === "object" ? selector : null;
}

function freeCadSelectorCopy(selector) {
  if (!selector || typeof selector !== "object") return null;
  const copy = {};
  for (const key of ["name", "label", "type_id"]) {
    if (selector[key]) copy[key] = selector[key];
  }
  return Object.keys(copy).length ? copy : null;
}

function freeCadPatchSelectorKey(selector) {
  if (!selector || typeof selector !== "object") return "";
  return normalizeFreeCadToken([selector.name, selector.label, selector.type_id].filter(Boolean).join("|"));
}

function freeCadPatchSketchName(parsedPatch) {
  for (const patch of parsedPatch?.patches || []) {
    if (!freeCadPatchAffectsSketchSolver(patch)) continue;
    const selector = freeCadPatchSketchSelector(patch);
    const obj = freeCadObjectByName(selector?.name || selector?.label || "");
    if (obj && freeCadObjectIsSketch(obj)) return freeCadObjectKey(obj);
    if (selector?.name || selector?.label) return selector.name || selector.label;
  }
  return "";
}

function freeCadSketchPreviewPatch(parsedPatch) {
  const patches = (parsedPatch?.patches || []).map((patch) => {
    return freeCadPatchAffectsSketchSolver(patch) && patch.solve === undefined ? { ...patch, solve: true } : { ...patch };
  });
  const validated = new Set();
  for (const patch of patches) {
    if (patch.op === "validate_sketch") {
      const key = freeCadPatchSelectorKey(freeCadPatchSketchSelector(patch));
      if (key) validated.add(key);
    }
  }
  for (const patch of patches.slice()) {
    if (!freeCadPatchAffectsSketchSolver(patch)) continue;
    const selector = freeCadSelectorCopy(freeCadPatchSketchSelector(patch));
    const key = freeCadPatchSelectorKey(selector);
    if (!selector || !key || validated.has(key)) continue;
    patches.push({ op: "validate_sketch", selector, solve: true });
    validated.add(key);
  }
  return { ...parsedPatch, patches };
}

async function previewFreeCadDocumentPatch(parsedPatch, userInstruction, options = {}) {
  if (!parsedPatch?.patches?.length || !state.serverSessionId || !state.activeServerVersionId) {
    return {
      ok: false,
      error: "FreeCAD document state is not ready for solver preview",
      dry_run: true,
      would_create_version: false,
    };
  }
  const previewPatch = freeCadSketchPreviewPatch(parsedPatch);
  const quiet = options.quiet === true;
  if (!quiet) {
    $("applyButton").disabled = true;
    setStatus("checkingSketchSolver");
    renderAll();
  }
  try {
    const preview = await fetchJson("/api/freecad/document/patch", {
      session_id: state.serverSessionId,
      version_id: state.activeServerVersionId,
      patches: previewPatch.patches,
      user_instruction: userInstruction,
      dry_run: true,
    });
    const willNotCreateVersion = preview.would_create_version === false;
    return { ...preview, would_create_version: willNotCreateVersion ? false : preview.would_create_version };
  } finally {
    if (!quiet) $("applyButton").disabled = false;
  }
}

function storeFreeCadSketchDryRunReview(parsedPatch, detail, preview, issues = null) {
  const resolvedIssues = Array.isArray(issues) ? issues : freeCadSketchPreviewIssues(preview);
  cancelFreeCadSketchLiveSolve();
  state.sketchDryRunReview = {
    schema: "freecad.sketch_solver_preview/v1",
    sketchName: freeCadPatchSketchName(parsedPatch) || resolvedIssues.find((issue) => issue.sketchName)?.sketchName || state.selectedFreeCadObjectName,
    detail: detail || freeCadPatchDetail(parsedPatch),
    patch: parsedPatch,
    preview,
    issues: resolvedIssues,
  };
  persistWorkbenchSession();
  return state.sketchDryRunReview;
}

async function previewAndCommitFreeCadDocumentPatch(parsedPatch, userInstruction) {
  if (!parsedPatch?.patches?.some(freeCadPatchAffectsSketchSolver)) {
    return applyFreeCadDocumentPatch(parsedPatch, userInstruction);
  }
  try {
    const preview = await previewFreeCadDocumentPatch(parsedPatch, userInstruction);
    const issues = freeCadSketchPreviewIssues(preview);
    if (preview.ok === false || freeCadSketchPreviewBlocksCommit(preview)) {
      const review = storeFreeCadSketchDryRunReview(parsedPatch, userInstruction, preview, issues);
      setStatus("sketchDryRunBlocked");
      log(t(preview.ok === false ? "log.sketchDryRunFailed" : "log.sketchDryRunBlocked", {
        message: freeCadSketchDryRunReviewMessage(review),
      }));
      renderAll();
      return false;
    }
    clearFreeCadSketchDryRunReview({ clearDragPreview: false, persist: false, render: false });
    log(t("log.sketchDryRunOk", { name: parsedPatch.name || freeCadPatchSketchName(parsedPatch) || t("freecadScript") }));
    return applyFreeCadDocumentPatch(parsedPatch, userInstruction);
  } catch (error) {
    const preview = { ok: false, error: error.message, dry_run: true, would_create_version: false };
    const review = storeFreeCadSketchDryRunReview(parsedPatch, userInstruction, preview);
    setStatus("sketchDryRunBlocked");
    log(t("log.sketchDryRunFailed", { message: freeCadSketchDryRunReviewMessage(review) }));
    renderAll();
    return false;
  }
}

async function commitFreeCadSketchDryRunReview() {
  const review = state.sketchDryRunReview;
  if (!review?.patch?.patches?.length) return false;
  const patch = review.patch;
  const detail = review.detail || freeCadPatchDetail(patch);
  clearFreeCadSketchDryRunReview({ clearDragPreview: false, persist: false, render: false });
  return applyFreeCadDocumentPatch(patch, detail);
}

async function resolveFreeCadSketchDryRunConstraint(constraintIndex, action) {
  const review = state.sketchDryRunReview;
  const sketchName = review?.sketchName || state.selectedFreeCadObjectName;
  const index = Number(constraintIndex);
  if (!sketchName || !Number.isFinite(index)) return false;
  clearFreeCadSketchDryRunReview({ persist: false, render: false });
  if (action === "reference") {
    return commitFreeCadSketchConstraintState(sketchName, index, "reference", true);
  }
  return commitFreeCadSketchConstraintState(sketchName, index, "active", false);
}

async function validateFreeCadSketch(objectName) {
  const obj = freeCadObjectByName(objectName);
  if (!obj || !freeCadObjectIsSketch(obj)) return false;
  state.selectedFreeCadObjectName = freeCadObjectKey(obj);
  const patch = {
    patches: [{
      op: "validate_sketch",
      selector: freeCadObjectSelector(obj),
      solve: true,
    }],
    name: `${freeCadObjectDisplayName(obj)}.validateSketch`,
  };
  try {
    const preview = await previewFreeCadDocumentPatch(patch, freeCadPatchDetail(patch));
    const issues = freeCadSketchPreviewIssues(preview);
    if (preview.ok === false || issues.length) {
      const review = storeFreeCadSketchDryRunReview(patch, freeCadPatchDetail(patch), preview, issues);
      setStatus("sketchDryRunBlocked");
      log(t(preview.ok === false ? "log.sketchDryRunFailed" : "log.sketchDryRunBlocked", {
        message: freeCadSketchDryRunReviewMessage(review),
      }));
      renderAll();
      return false;
    }
    if (preview.document_summary) state.documentSummary = preview.document_summary;
    clearFreeCadSketchDryRunReview({ clearDragPreview: false, persist: false, render: false });
    log(t("log.sketchDryRunOk", { name: patch.name }));
    setStatus("previewExportReady");
    renderAll();
    return true;
  } catch (error) {
    const preview = { ok: false, error: error.message, dry_run: true, would_create_version: false };
    const review = storeFreeCadSketchDryRunReview(patch, freeCadPatchDetail(patch), preview);
    setStatus("sketchDryRunBlocked");
    log(t("log.sketchDryRunFailed", { message: freeCadSketchDryRunReviewMessage(review) }));
    renderAll();
    return false;
  }
}

function freeCadSketchGeometryBounds(obj) {
  const sketch = obj?.sketch || {};
  const points = [];
  for (const geometry of Array.isArray(sketch.geometry) ? sketch.geometry : []) {
    for (const key of ["start", "end", "center", "location", "point"]) {
      const point = freeCadTriplet(geometry?.[key]);
      if (point) points.push(point);
    }
  }
  if (!points.length) return { min: [0, 0, 0], max: [40, 30, 0], size: [40, 30, 0] };
  const min = [0, 1, 2].map((axis) => Math.min(...points.map((point) => point[axis])));
  const max = [0, 1, 2].map((axis) => Math.max(...points.map((point) => point[axis])));
  const size = [0, 1, 2].map((axis) => Math.max(10, max[axis] - min[axis]));
  return { min, max, size };
}

function freeCadSketchPrimitiveGeometry(obj, kind, anchorPoint = null) {
  const bounds = freeCadSketchGeometryBounds(obj);
  const anchor = freeCadTriplet(anchorPoint);
  const origin = anchor || [
    bounds.min[0] + bounds.size[0] * 0.15,
    bounds.max[1] + Math.max(10, bounds.size[1] * 0.2),
    0,
  ];
  const span = Math.max(8, Math.min(40, Math.max(bounds.size[0], bounds.size[1]) * 0.35));
  if (kind === "circle") {
    return { type: "circle", center: origin, radius: span * 0.5 };
  }
  if (kind === "arc") {
    return {
      type: "arc",
      center: origin,
      radius: span * 0.5,
      start_angle_degrees: 15,
      end_angle_degrees: 145,
    };
  }
  return {
    type: "line",
    start: origin,
    end: [origin[0] + span, origin[1], origin[2]],
  };
}

  const text = parts.filter(Boolean).join("_").replace(/[^\w]/g, "_").replace(/^(\d)/, "_$1").slice(0, 72);

}
