function freeCadObjectSelector(obj) {
  if (obj?.name) return { name: obj.name };
  if (obj?.label) return { label: obj.label };
  return { type_id: obj?.type_id || "" };
}

function freeCadPatchDisplayName(patch) {
  if (!patch) return t("generatedModel");
  const selector = patch.selector || {};
  const objectName = selector.label || selector.name || selector.type_id || t("generatedModel");
  if (patch.op === "create_feature") {
    return `create:${patch.label || patch.name || patch.type_id || t("generatedModel")}`;
  }
  if (patch.op === "delete_feature") return `delete:${objectName}`;
  if (patch.op === "set_body_tip") {
    const tip = patch.tip_selector || patch.feature_selector || {};
    return `${objectName}.Tip=${tip.label || tip.name || tip.type_id || ""}`;
  }
  if (patch.op === "set_placement") return `${objectName}.Placement`;
  if (patch.op === "set_expression") return `${objectName}.${patch.property || "expression"}`;
  if (patch.op === "add_geometry") {
    const geometry = patch.geometry || patch.geometries?.[0] || {};
    return `${objectName}.addGeometry:${geometry.type || geometry.kind || ""}`;
  }
  if (patch.op === "set_geometry_point" || patch.op === "move_geometry" || patch.op === "move_sketch_geometry") {
    return `${objectName}.geometry#${patch.geometry_index ?? patch.index ?? ""}.${patch.point_role || patch.point || "point"}`;
  }
  if (patch.op === "set_geometry_construction" || patch.op === "toggle_geometry_construction") {
    return `${objectName}.construction:#${patch.geometry_index ?? patch.index ?? ""}`;
  }
  if (patch.op === "add_constraint") {
    const constraint = patch.constraint || patch.constraints?.[0] || {};
    return `${objectName}.addConstraint:${constraint.type || constraint.constraint_type || ""}`;
  }
  if (patch.op === "add_endpoint_coincidence") {
    return `${objectName}.addConstraint:Coincident`;
  }
  if (patch.op === "set_constraint_state") {
    const constraint = patch.constraint_name || `#${patch.constraint_index ?? ""}`;
    return `${objectName}.constraintState:${constraint}`;
  }
  if (patch.op === "remove_constraint") {
    const constraint = patch.constraint_name || `#${patch.constraint_index ?? ""}`;
    return `${objectName}.removeConstraint:${constraint}`;
  }
  if (patch.op === "create_sketch") {
    return `createSketch:${patch.label || patch.name || "Sketch"}`;
  }
  if (patch.op === "attach_sketch") {
    const support = patch.support_selector || patch.source_selector || patch.part_selector || {};
    return `${objectName}.attach:${support.label || support.name || support.type_id || ""}`;
  }
  if (patch.op === "add_external_geometry") {
    const source = patch.source_selector || patch.support_selector || patch.part_selector || {};
    return `${objectName}.external:${source.label || source.name || patch.reference || ""}`;
  }
  if (patch.op === "solver_status") {
    return `${objectName}.solveSketch`;
  }
  if (patch.op === "validate_sketch") {
    return `${objectName}.validateSketch`;
  }
  if (patch.op === "create_assembly") {
    return `createAssembly:${patch.label || patch.name || t("generatedModel")}`;
  }
  if (patch.op === "add_part_to_assembly") {
    const part = patch.part_selector || patch.feature_selector || {};
    return `${objectName}.addPart:${part.label || part.name || part.type_id || ""}`;
  }
  if (patch.op === "remove_part_from_assembly") {
    const part = patch.part_selector || patch.feature_selector || {};
    return `${objectName}.removePart:${part.label || part.name || part.type_id || ""}`;
  }
  if (patch.op === "set_assembly_part_placement") {
    const part = patch.part_selector || patch.feature_selector || {};
    return `${objectName}.${part.label || part.name || part.type_id || "part"}.Placement`;
  }
  if (patch.op === "ground_assembly_part") {
    const part = patch.part_selector || patch.feature_selector || {};
    return `${objectName}.ground:${part.label || part.name || part.type_id || ""}`;
  }
  if (patch.op === "create_joint") {
    return `createJoint:${patch.joint_type || patch.type || "joint"}`;
  }
  if (patch.op === "update_joint") {
    return `${objectName}.joint:${patch.joint_type || patch.type || patch.distance || patch.angle_degrees || ""}`;
  }
  if (patch.op === "solve_assembly") {
    return `${objectName}.solve`;
  }
  if (patch.op === "create_techdraw_page") {
    return `createTechDrawPage:${patch.label || patch.name || "Page"}`;
  }
  if (patch.op === "add_techdraw_view") {
    const source = patch.source_selector || patch.part_selector || patch.feature_selector || {};
    return `TechDrawView:${source.label || source.name || source.type_id || ""}`;
  }
  if (patch.op === "add_techdraw_projection_group") {
    return `TechDrawProjection:${patch.projection_names?.join("/") || patch.projection || "Front"}`;
  }
  if (patch.op === "add_techdraw_section_view") {
    return `TechDrawSection:${patch.label || patch.name || "Section"}`;
  }
  if (patch.op === "add_techdraw_detail_view") {
    return `TechDrawDetail:${patch.label || patch.name || "Detail"}`;
  }
  if (patch.op === "add_techdraw_centerline") {
    return `TechDrawCenterline:${patch.references?.join("/") || ""}`;
  }
  if (patch.op === "add_techdraw_cosmetic_vertex") {
    return `TechDrawCosmeticVertex:${patch.label || patch.name || ""}`;
  }
  if (patch.op === "add_techdraw_cosmetic_line") {
    return `TechDrawCosmeticLine:${patch.label || patch.name || ""}`;
  }
  if (patch.op === "export_techdraw_pdf") {
    return "TechDrawPDF";
  }
  if (patch.op === "add_techdraw_dimension") {
    return `TechDrawDimension:${patch.dimension_type || patch.type || "Distance"}`;
  }
  if (patch.op === "set_constraint_value") {
    const constraint = patch.constraint_name || `#${patch.constraint_index ?? ""}`;
    return `${objectName}.constraint${constraint}`;
  }
  return `${objectName}.${patch.property || ""}`;
}

function freeCadFeatureKindText() {
  const counts = new Map();
  freeCadFeatureTreeNodes().forEach((node) => {
    const kind = node.kind || "document_object";
    counts.set(kind, (counts.get(kind) || 0) + 1);
  });
  return [...counts.entries()].map(([kind, count]) => `${kind}:${count}`).join(" · ");
}

function freeCadBodyTipText() {
  const tips = freeCadFeatureTreeNodes()
    .filter((node) => node.kind === "partdesign_body" && node.tip)
    .map((node) => `${freeCadObjectDisplayName(node.object)} -> ${freeCadObjectDisplayName(node.tip)}`);
  return tips.join(" · ");
}

function freeCadAssemblies() {
  return Array.isArray(state.documentSummary?.assemblies)
    ? state.documentSummary.assemblies
    : [];
}

function freeCadAssemblyKey(assembly) {
  return assembly?.name || assembly?.label || "";
}

function freeCadAssemblyDisplayName(assembly) {
  return assembly?.label || assembly?.name || "Assembly";
}

function freeCadAssemblySelector(assembly) {
  if (assembly?.name) return { name: assembly.name };
  if (assembly?.label) return { label: assembly.label };
  return { type_id: assembly?.type_id || "Assembly::AssemblyObject" };
}

function freeCadAssemblyByName(name) {
  const normalized = normalizeFreeCadToken(name);
  if (!normalized) return null;
  return freeCadAssemblies().find((assembly) => {
    return normalizeFreeCadToken(assembly.name) === normalized
      || normalizeFreeCadToken(assembly.label) === normalized;
  }) || null;
}

function freeCadJointKey(joint) {
  return joint?.name || joint?.label || "";
}

function freeCadJointDisplayName(joint) {
  return joint?.label || joint?.name || joint?.joint_type || "Joint";
}

function freeCadJointByName(assembly, jointName) {
  const normalized = normalizeFreeCadToken(jointName);
  if (!assembly || !normalized) return null;
  return (Array.isArray(assembly.joints) ? assembly.joints : []).find((joint) => {
    return normalizeFreeCadToken(joint.name) === normalized
      || normalizeFreeCadToken(joint.label) === normalized;
  }) || null;
}

function freeCadJointTypeValue(joint) {
  const raw = String(joint?.joint_type || joint?.type || "").trim();
  if (!raw) return "";
  const normalized = raw.replace(/[-_\s]+/g, " ").toLowerCase();
  return normalized.replace(/\b\w/g, (ch) => ch.toUpperCase()).replace(/\s+/g, "");
}

function freeCadJointScalarValue(joint, key) {
  const value = joint?.[key] ?? (key === "angle" ? joint?.angle_degrees : null);
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function freeCadJointReferenceText(reference) {
  if (!reference || typeof reference !== "object") return t("notAvailable");
  const obj = reference.object || reference.part || {};
  const objectName = obj.label || obj.name || "";
  const subelements = Array.isArray(reference.subelements)
    ? reference.subelements.filter(Boolean)
    : [reference.reference || reference.element || reference.vertex].filter(Boolean);
  return [objectName, subelements.join(".")].filter(Boolean).join(".") || t("notAvailable");
}

function freeCadConnectorFrame(reference) {
  return reference?.connector_frame || reference?.connectorFrame || null;
}

function freeCadConnectorFrameText(reference) {
  const frame = freeCadConnectorFrame(reference);
  if (!frame) return t("notAvailable");
  const stable = frame.stable_id ? `stable ${String(frame.stable_id).slice(-8)}` : "";
  const axis = freeCadTriplet(frame.primary_axis) ? `axis ${freeCadVectorText(frame.primary_axis)}` : "";
  const lcs = frame.lcs || {};
  const lcsText = lcs.orientation_quality ? `LCS ${lcs.orientation_quality}` : "";
  return [frame.frame_quality, frame.source, lcsText, axis, stable].filter(Boolean).join(" · ") || t("notAvailable");
}

function renderFreeCadConnectorFrameRows(joint) {
  const lcsText = (reference) => {
    const lcs = freeCadConnectorFrame(reference)?.lcs || {};
    if (!freeCadTriplet(lcs.x_axis) || !freeCadTriplet(lcs.y_axis) || !freeCadTriplet(lcs.z_axis)) return "";
    return `x ${freeCadVectorText(lcs.x_axis)} · y ${freeCadVectorText(lcs.y_axis)} · z ${freeCadVectorText(lcs.z_axis)}`;
  };
  return `
    <div class="kv"><span>${escapeHtml(t("connector1"))} ${escapeHtml(t("connectorFrame"))}</span><strong>${escapeHtml(freeCadConnectorFrameText(joint.reference1))}</strong></div>
    <div class="kv"><span>${escapeHtml(t("connector2"))} ${escapeHtml(t("connectorFrame"))}</span><strong>${escapeHtml(freeCadConnectorFrameText(joint.reference2))}</strong></div>
    ${lcsText(joint.reference1) ? `<div class="kv"><span>${escapeHtml(t("connector1"))} LCS</span><strong>${escapeHtml(lcsText(joint.reference1))}</strong></div>` : ""}
    ${lcsText(joint.reference2) ? `<div class="kv"><span>${escapeHtml(t("connector2"))} LCS</span><strong>${escapeHtml(lcsText(joint.reference2))}</strong></div>` : ""}
  `;
}

function freeCadAssemblyPartText(part) {
  const base = Array.isArray(part?.placement?.base) ? ` @ ${part.placement.base.map(formatNumber).join(",")}` : "";
  const grounded = part?.grounded ? " grounded" : "";
  return `${part?.label || part?.name || "Part"}${grounded}${base}`;
}

function freeCadSolverDetailText(detail) {
  if (!detail || typeof detail !== "object") return "";
  if (detail.error) return String(detail.error);
  const parts = [];
  if (detail.ok !== undefined && detail.ok !== null) parts.push(detail.ok ? "ok" : "failed");
  if (detail.part_count !== undefined) parts.push(`${detail.part_count} parts`);
  if (detail.joint_count !== undefined) parts.push(`${detail.joint_count} joints`);
  return parts.join(" · ");
}

function freeCadAssemblySolverText(assembly) {
  const detail = assembly?.solver_detail || {};
  const status = assembly?.solver_status ?? detail.solver_status;
  const backend = assembly?.solver_backend || detail.solver_backend || "";
  const result = freeCadSolverDetailText(detail);
  return [backend, status !== undefined && status !== null ? `status ${status}` : "", result].filter(Boolean).join(" · ") || t("notAvailable");
}

function freeCadAssemblyStatusText(assembly) {
  return [
    assembly?.assembly_backend || (assembly?.fallback ? "typed_fallback" : "native"),
    assembly?.status || "",
    assembly?.product_grade === false ? "fallback" : "product-grade",
  ].filter(Boolean).join(" · ");
}

function selectedFreeCadAssemblyJointRef() {
  const selected = state.selectedFreeCadAssemblyJoint;
  if (!selected) return null;
  const assembly = freeCadAssemblyByName(selected.assemblyName);
  const joint = freeCadJointByName(assembly, selected.jointName);
  if (!assembly || !joint) {
    state.selectedFreeCadAssemblyJoint = null;
    return null;
  }
  return { assembly, joint };
}

function freeCadAssemblyJointStillExists(selected = state.selectedFreeCadAssemblyJoint) {
  if (!selected?.assemblyName || !selected?.jointName) return false;
  const assembly = freeCadAssemblyByName(selected.assemblyName);
  return Boolean(freeCadJointByName(assembly, selected.jointName));
}

function freeCadAssemblyText() {
  return freeCadAssemblies()
    .map((assembly) => {
      const name = freeCadAssemblyDisplayName(assembly);
      const backend = assembly.solver_backend || assembly.assembly_backend || (assembly.fallback ? "typed_fallback" : "native");
      return `${name}: ${assembly.part_count || 0} parts, ${assembly.joint_count || 0} joints, ${backend}`;
    })
    .join(" · ");
}

function freeCadTechDrawText() {
  const pages = Array.isArray(state.documentSummary?.techdraw)
    ? state.documentSummary.techdraw
    : [];
  return pages
    .map((page) => {
      const name = page.label || page.name || "Page";
      const quality = page.layout_diagnostics?.export_quality || page.status || "";
      return `${name}: ${page.view_count || 0} views, ${page.dimension_count || 0} dims${quality ? `, ${quality}` : ""}`;
    })
    .join(" · ");
}

function freeCadTechDrawValidationText() {
  const validation = state.documentSummary?.techdraw_export_status?.validation;
  const formats = validation?.formats || {};
  const parts = ["svg", "dxf", "pdf"].map((key) => {
    const item = formats[key] || {};
    return `${key.toUpperCase()} ${item.ok ? "ok" : "failed"}`;
  });
  return parts.length ? `${validation?.ok ? "ok" : "incomplete"} · ${parts.join(" · ")}` : t("notAvailable");
}

function freeCadVectorText(value) {
  const vector = freeCadTriplet(value);
  return vector ? vector.map(formatNumber).join(", ") : t("notAvailable");
}

function freeCadDiagnosticItems(diagnostics) {
  if (!diagnostics) return [];
  if (Array.isArray(diagnostics)) return diagnostics.filter(Boolean);
  if (Array.isArray(diagnostics.issues)) return diagnostics.issues.filter(Boolean);
  return [];
}

function freeCadDiagnosticsSummaryText(diagnostics) {
  const items = freeCadDiagnosticItems(diagnostics);
  if (!items.length) return diagnostics?.ok === false ? "failed" : "ok";
  const severity = diagnostics?.severity || items[0]?.severity || "warning";
  return `${severity} · ${items.length}`;
}

function freeCadDiagnosticCssClass(item) {
  const severity = String(item?.severity || "").toLowerCase();
  if (severity === "error") return "error";
  if (severity === "warning") return "warning";
  return "info";
}

function renderFreeCadDiagnostics(titleKey, diagnostics) {
  const items = freeCadDiagnosticItems(diagnostics);
  if (!items.length) return "";
  return `<p class="section-note" style="margin-top:12px">${escapeHtml(t(titleKey))}</p>
    <div class="diagnostic-list">
      ${items.slice(0, 12).map((item) => {
        const code = item.code || item.severity || "diagnostic";
        const message = item.message || item.error || JSON.stringify(item);
        const detail = [item.joint, item.reference, item.status].filter(Boolean).join(" · ");
        return `<div class="diagnostic-row ${freeCadDiagnosticCssClass(item)}">
          <strong>${escapeHtml(code)}</strong>
          <span>${escapeHtml([message, detail].filter(Boolean).join(" · "))}</span>
        </div>`;
      }).join("")}
    </div>`;
}

function freeCadDocumentGeometryText() {
  const geometry = state.documentSummary?.geometry || {};
  const bbox = geometry.bbox?.size;
  const parts = [];
  if (Array.isArray(bbox)) parts.push(`bbox ${bbox.map(formatNumber).join(" x ")} mm`);
  if (Number.isFinite(Number(geometry.volume))) parts.push(`volume ${formatNumber(geometry.volume)}`);
  if (geometry.valid !== undefined && geometry.valid !== null) parts.push(`valid ${geometry.valid ? "true" : "false"}`);
  return parts.join(" · ");
}

function freeCadObjectGeometryText(obj) {
  const shape = obj?.shape || {};
  const bbox = shape.bbox?.size;
  const parts = [];
  if (Array.isArray(bbox)) parts.push(`bbox ${bbox.map(formatNumber).join(" x ")} mm`);
  if (Number.isFinite(Number(shape.volume))) parts.push(`volume ${formatNumber(shape.volume)}`);
  if (shape.valid !== undefined && shape.valid !== null) parts.push(`valid ${shape.valid ? "true" : "false"}`);
  if (Number.isFinite(Number(shape.face_count)) || Number.isFinite(Number(shape.edge_count))) {
    parts.push(`faces ${shape.face_count ?? 0} · edges ${shape.edge_count ?? 0}`);
  }
  return parts.join(" · ");
}

function freeCadSubelements(obj) {
  const subelements = obj?.shape?.subelements || {};
  const rows = [];
  [
    ["faces", "Face"],
    ["edges", "Edge"],
    ["vertices", "Vertex"],
  ].forEach(([key, label]) => {
    const items = Array.isArray(subelements[key]) ? subelements[key] : [];
    items.slice(0, 18).forEach((item) => {
      rows.push({ ...item, group: label, reference: item.reference || item.name });
    });
  });
  return rows;
}

function selectedFreeCadSubelementRef() {
  const selected = state.selectedFreeCadSubelement;
  if (!selected || !state.selectedFreeCadObjectName) return null;
  if (normalizeFreeCadToken(selected.objectName) !== normalizeFreeCadToken(state.selectedFreeCadObjectName)) return null;
  return selected;
}

function freeCadSubelementSummaryText(item) {
  const center = Array.isArray(item?.center) ? `center ${item.center.map(formatNumber).join(",")}` : "";
  const bbox = Array.isArray(item?.bbox?.size) ? `bbox ${item.bbox.size.map(formatNumber).join(" x ")}` : "";
  const stable = item?.stable_id ? `stable ${String(item.stable_id).slice(-8)}` : "";
  return [center || bbox || item?.shape_type || "", stable].filter(Boolean).join(" · ");
}

function freeCadSubelementByRef(obj, reference, stableId = "") {
  const normalizedStable = normalizeFreeCadToken(stableId);
  if (obj && normalizedStable) {
    const stableMatch = freeCadSubelements(obj).find((item) => {
      return normalizeFreeCadToken(item.stable_id || item.stableId) === normalizedStable
        || normalizeFreeCadToken(item.legacy_stable_id || item.legacyStableId) === normalizedStable;
    });
    if (stableMatch) return stableMatch;
  }
  const normalized = normalizeFreeCadToken(reference);
  if (!obj || !normalized) return null;
  return freeCadSubelements(obj).find((item) => normalizeFreeCadToken(item.reference || item.name) === normalized) || null;
}

function freeCadPropertyNames(obj) {
  return (Array.isArray(obj?.properties) ? obj.properties : [])
    .map((prop) => String(prop.name || ""))
    .filter(Boolean);
}

function normalizeFreeCadToken(value) {
  return String(value || "").toLowerCase().replace(/[\s_.:-]+/g, "");
}

function relatedGeneratedParameters(selected, params) {
  if (!selected) return params;
  const group = generatedParameterGroup(selected);
  const related = params.filter((param) => generatedParameterGroup(param) === group);
  return related.length ? related : [selected];
}

function safeDomId(value) {
  return String(value || "").replace(/[^a-zA-Z0-9_-]/g, "_");
}

function jsString(value) {
  return JSON.stringify(String(value || ""));
}

function exportStatusLabel(status = state.exportStatus) {
  const hasTranslation = i18nPath(currentLocale, `status.${status}`) || i18nPath("en", `status.${status}`);
  return hasTranslation ? t(`status.${status}`) : status;
}

function hasStepStlArtifacts() {
  return Boolean((state.artifacts.step || artifactRef("step")) && (state.artifacts.stl || artifactRef("stl")));
}

function hasInteractiveViewerArtifact() {
  return Boolean(state.artifacts.viewer_scene || artifactRef("viewer_scene") || state.artifacts.stl || artifactRef("stl"));
}

function artifactExportStatusLabel() {
  return hasStepStlArtifacts() ? t("readyValue") : exportStatusLabel();
}

function chatText(item) {
  return item.key ? t(item.key, item.vars || {}) : item.text;
}

function addHistory(label, detail) {
  const version = state.designState?.version || 1;
  state.history.unshift({
    id: `${Date.now()}-${label}`,
    version,
    label,
    detail,
  });
  state.history = state.history.slice(0, 60);
}

function setStatus(key, vars = {}) {
  state.statusKey = key;
  state.statusVars = vars;
  const hasTranslation = i18nPath(currentLocale, `status.${key}`) || i18nPath("en", `status.${key}`);
  const node = $("status");
  node.textContent = hasTranslation ? t(`status.${key}`, vars) : key;
  node.classList.toggle("working", Boolean(state.generationActivity?.active) || WORKING_STATUS_KEYS.has(key));
}

function renderStaticText() {
  document.documentElement.lang = currentLocale === "zh" ? "zh-CN" : "en";
  document.title = t("appTitle");
  $("brandTitle").textContent = t("appTitle");
  $("modelTreeTitle").textContent = t("projectTree");
  $("activeFeatureLabel").textContent = t("activeFeature");
  $("latestPatchLabel").textContent = t("latestPatch");
  $("propertiesTitle").textContent = t("properties");
  $("commandInput").placeholder = t("commandPlaceholder");
  $("applyButton").textContent = t("apply");
  $("newSessionButtonText").textContent = t("newSession");
  $("newSessionButton").title = t("newSessionTitle");
  $("sessionHistoryButtonText").textContent = t("sessionHistory");
  $("sessionHistoryButton").title = t("sessionHistoryButtonTitle");
  $("importButtonText").textContent = t("importModel");
  $("importButton").title = t("importModelTitle");

function setLocale(locale) {
  currentLocale = locale === "zh" ? "zh" : "en";
  localStorage.setItem("4yi-cad.locale", currentLocale);
  renderAll();
}

function toggleLocale() {
  setLocale(currentLocale === "zh" ? "en" : "zh");
}

function renderToolbar() {
  const viewButtons = [
    ["fit", "toolbar.fit", "ruler"],
    ["top", "toolbar.top", "box"],
    ["front", "toolbar.front", "ruler"],
    ["right", "toolbar.right", "box"],
    ["iso", "toolbar.iso", "ruler"],
  ];
  const freeCadMode = freeCadSelectionAvailable();
  const modes = freeCadMode
    ? [
        ["object", "toolbar.object", "pointer"],
        ["face", "toolbar.face", "box"],
        ["edge", "toolbar.edge", "ruler"],
        ["vertex", "toolbar.vertex", "pointer"],
      ]
    : [
        ["feature", "toolbar.feature", "pointer"],
      ];
  const measures = [
    ["distance", "toolbar.distance", "ruler"],
    ["diameter", "toolbar.diameter", "ruler"],
    ["angle", "toolbar.angle", "ruler"],
  ];

  $("toolbar").innerHTML = [
    ...viewButtons.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, state.viewMode === value, `setView('${value}')`)),
    "<span class='tool-separator'></span>",
    toolButton(t("toolbar.bbox"), "box", state.showBBox, "toggleBBox()"),
    toolButton(t("toolbar.dims"), "ruler", state.showDims, "toggleDims()"),
    toolButton(t("toolbar.explode"), "layers", state.exploded, "toggleExplode()"),
    "<span class='tool-separator'></span>",
    ...modes.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, freeCadViewerSelectionMode() === value || state.selectionMode === value, `setSelectionMode('${value}')`)),
    "<span class='tool-separator'></span>",
    ...measures.map(([value, labelKey, iconName]) => toolButton(t(labelKey), iconName, state.measureMode === value, `setMeasureMode('${value}')`)),
  ].join("");
}

function toolButton(label, iconName, active, action) {
  return `<button class="tool-button ${active ? "active" : ""}" type="button" onclick="${action}" title="${escapeHtml(label)}">${icon(iconName)}<span>${escapeHtml(label)}</span></button>`;
}

function renderTree() {
  const ds = state.designState;
  if (!ds) return;
  if (state.previewMode === "generated") {
    const params = state.generatedParameters || [];
    const docNodes = freeCadTreeDisplayNodes().slice(0, 24);
    const selectedParam = selectedGeneratedParameter();
    const selectedObj = selectedFreeCadObject();
    $("featureTree").innerHTML = `
      <button class="tree-item" style="padding-left:8px" type="button" onclick="showGeneratedModel()">
        <span>⌄</span>${icon("code")}<span class="name">${escapeHtml(t("generatedDesign"))}</span>
      </button>
      <button class="tree-item ${selectedParam || selectedObj ? "" : "active"}" style="padding-left:34px" type="button" onclick="showGeneratedModel()">
        <span style="width:12px"></span>${icon("box")}<span class="name">${escapeHtml(state.generatedPrompt || t("agentModel"))}</span>
      </button>
      ${docNodes.map((node) => `
        <button class="tree-item ${freeCadObjectKey(node.object) && normalizeFreeCadToken(freeCadObjectKey(node.object)) === normalizeFreeCadToken(state.selectedFreeCadObjectName) ? "active" : ""}" style="padding-left:${60 + node.depth * 16}px" type="button" onclick="selectFreeCadObject(${escapeHtml(jsString(freeCadObjectKey(node.object)))})" title="${escapeHtml(node.kind)}">
          <span style="width:12px"></span>${icon(freeCadFeatureIcon(node.kind, node.object))}<span class="name">${escapeHtml(freeCadObjectDisplayName(node.object))}</span>
          ${node.tip ? `<span>${escapeHtml(freeCadObjectDisplayName(node.tip))}</span>` : ""}
        </button>
      `).join("")}
      <button class="tree-item" style="padding-left:60px" type="button" onclick="showGeneratedParameters()">
        <span style="width:12px"></span>${icon("ruler")}<span class="name">${escapeHtml(t("scriptParameters"))}</span><span>${params.length}</span>
      </button>
      ${params.slice(0, 18).map((param) => `
        <button class="tree-item ${param.name === state.selectedGeneratedParameterName ? "active" : ""}" style="padding-left:84px" type="button" onclick="focusGeneratedParameter(${escapeHtml(jsString(param.name))})">
          <span style="width:12px"></span>${icon("ruler")}<span class="name">${escapeHtml(param.name)}</span>
        </button>
      `).join("")}
      <button class="tree-item" style="padding-left:60px" type="button" onclick="setBottomTab('script')">
        <span style="width:12px"></span>${icon("code")}<span class="name">${escapeHtml(scriptTitle())}</span>
      </button>
    `;
    $("activeFeature").textContent = selectedObj ? freeCadObjectDisplayName(selectedObj) : t("generatedModel");
    $("latestPatch").textContent = state.patch?.op === "patch_fcstd_document"
      ? `fcstd_patch:${state.patch.patches?.length || 0}`
      : params.length ? `script_parameters:${params.length}` : "agent_generation";
    return;
  }
  const enabled = enabledFeatureIds();
  $("featureTree").innerHTML = ds.features.map((feature) => {
    const depth = featureDepth(feature);
    const active = feature.id === state.selectedFeatureId;
    const inactive = !enabled.has(feature.id);
    const pad = 8 + depth * 18;
    return `
      <button class="tree-item ${active ? "active" : ""} ${inactive ? "inactive" : ""}" style="padding-left:${pad}px" type="button" onclick="selectFeature('${feature.id}')">
        ${depth < 2 ? "<span>⌄</span>" : "<span style='width:12px'></span>"}
        ${featureIcon(feature)}
        <span class="name">${escapeHtml(featureName(feature))}</span>
        ${feature.suppressed ? `<span title="suppressed">${escapeHtml(t("off"))}</span>` : ""}
      </button>
    `;
  }).join("");
  $("activeFeature").textContent = featureName(selectedFeature());
  $("latestPatch").textContent = state.patch ? `${state.patch.op}:${state.patch.name || state.patch.feature_id}` : t("none");
}

function measurementText() {
  const p = state.designState.parameters;
  const featureId = state.selectedFeatureId;
  if (state.measureMode === "diameter") {
    if (featureId === "hole_pattern") return t("measure.holes", { value: formatNumber(p.hole_d) });
    if (featureId === "center_boss") return t("measure.bossOd", { value: formatNumber(p.boss_d) });
    if (featureId === "center_hole") return t("measure.centerHole", { value: formatNumber(p.center_hole_d) });
    return t("measure.diagonal", { value: formatNumber(Math.hypot(p.plate_length, p.plate_width)) });
  }
  if (state.measureMode === "angle") {
    return featureId === "base_plate" ? t("measure.datumAngle") : t("measure.axisAngle");
  }
  if (featureId === "hole_pattern") return t("measure.holeCenters", { x: formatNumber(Math.max(0, p.plate_length - 24)), y: formatNumber(Math.max(0, p.plate_width - 24)) });
  if (featureId === "center_boss") return t("measure.bossHeight", { value: formatNumber(p.boss_h) });
  return t("measure.plateEnvelope", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(p.plate_thickness) });
}

function renderViewport() {
  const ds = state.designState;
  if (!ds) return;
  const p = ds.parameters;
  const feature = selectedFeature();
  const generated = state.previewMode === "generated";
  const generatedParam = generated ? selectedGeneratedParameter() : null;
  const generatedObject = generated ? selectedFreeCadObject() : null;
  const generatedSubelement = generated ? selectedFreeCadSubelementRef() : null;
  const sketchDragPreview = generated ? state.sketchDragPreview : null;
  const generatedSubelementItem = generatedObject && generatedSubelement
    ? freeCadSubelementByRef(generatedObject, generatedSubelement.reference, generatedSubelement.stableId)
    : null;
  $("subtitle").textContent = generated ? t("generatedPreviewSubtitle") : t("designStateVersion", { version: ds.version });
  $("selectionBadge").textContent = generated ? generatedViewportSelectionLabel(generatedObject, generatedParam, generatedSubelement) : t("featureBadge", { name: featureName(feature) });
  $("headBadge").textContent = generated ? t("agentPreview") : ds.rollback_feature_id ? t("rollbackPreview") : t("headPreview");
  $("measureTitle").textContent = sketchDragPreview ? (sketchDragPreview.committing ? t("sketchDragCommit") : t("sketchDragPreview")) : generated ? (generatedSubelement ? t("selectedReference") : generatedObject ? t("selectedObject") : generatedParam ? t("selectedParameter") : t("preview")) : t(`modes.${state.measureMode}`);
  $("measureText").textContent = sketchDragPreview
    ? freeCadSketchDragPreviewText(sketchDragPreview)
    : generated
    ? (generatedSubelement ? (freeCadSubelementSummaryText(generatedSubelementItem) || generatedSubelement.reference) : generatedObject ? (freeCadObjectGeometryText(generatedObject) || freeCadObjectDisplayName(generatedObject)) : generatedParam ? generatedParameterValueText(generatedParam) : state.previewPng ? t("renderedFromEngine", { engine: engineLabel() }) : t("waitingGeneratedPreview"))
    : measurementText();
  const height = p.plate_thickness + (enabledFeatureIds().has("center_boss") ? p.boss_h : 0);
  $("axisReadout").textContent = sketchDragPreview ? freeCadSketchDragPreviewAxisText(sketchDragPreview) : generated ? t("stepStlStatus", { status: artifactExportStatusLabel() }) : t("axisReadout", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(height) });
  $("viewportContent").innerHTML = generated ? renderGeneratedPreview() : renderModelSvg();
  applyViewportTransform();
  if (generated) {
    void mountGeneratedCadViewer();
  } else {
    disposeGeneratedCadViewer();
  }
}

function renderGeneratedPreview() {
  const selected = selectedGeneratedParameter();
  const selectedObject = selectedFreeCadObject();
  const selectedSubelement = selectedFreeCadSubelementRef();
  const selectedSubelementItem = selectedObject && selectedSubelement
    ? freeCadSubelementByRef(selectedObject, selectedSubelement.reference, selectedSubelement.stableId)
    : null;
  const callout = selected ? `<div class="generated-selection-callout">
    <strong>${escapeHtml(generatedSelectionLabel(selected))}</strong>
    <span>${escapeHtml(generatedParameterValueText(selected))}</span>
  </div>` : selectedObject && selectedSubelement ? `<div class="generated-selection-callout">
    <strong>${escapeHtml(`${freeCadObjectDisplayName(selectedObject)}.${selectedSubelement.reference}`)}</strong>
    <span>${escapeHtml([selectedSubelement.kind, freeCadSubelementSummaryText(selectedSubelementItem)].filter(Boolean).join(" · "))}</span>
  </div>` : selectedObject ? `<div class="generated-selection-callout">
    <strong>${escapeHtml(freeCadObjectDisplayName(selectedObject))}</strong>
    <span>${escapeHtml(freeCadObjectGeometryText(selectedObject) || selectedObject.type_id || "")}</span>
  </div>` : "";
  const previewSrc = state.previewPng
    ? dataUrl("image/png", state.previewPng)
    : artifactRef("preview")?.url;
  const hasMesh = hasInteractiveViewerArtifact();
  if (previewSrc || hasMesh) {
    const classes = `generated-preview ${generatedViewClass()} ${state.exploded ? "generated-exploded" : ""}`;
    const fallbackImage = previewSrc
      ? `<img src="${escapeHtml(previewSrc)}" alt="Generated CAD preview" />`
      : `<div class="generated-placeholder"><strong>${escapeHtml(t("generatedPreviewTitle"))}</strong></div>`;
    return `<div class="${classes}">
      ${callout}
      ${renderGenerationActivityOverlay()}
      <div class="generated-image-frame generated-scene-frame" data-view-mode="${escapeHtml(state.viewMode)}">
        ${hasMesh ? `<div class="cad-viewer" id="generatedCadViewer" data-viewer-key="${escapeHtml(generatedCadViewerKey())}">
          <div class="cad-viewer-status">${escapeHtml(t("interactiveMesh"))}</div>
        </div>` : ""}
        <div class="generated-png-fallback">
          ${fallbackImage}
        </div>
        ${renderGeneratedPreviewOverlays(selected)}
      </div>
    </div>`;
  }
  return `<div class="generated-preview"><div class="generated-placeholder">
    <strong>${escapeHtml(t("generatedPreviewTitle"))}</strong>
    <span>${escapeHtml(t("generatedPreviewHint"))}</span>
  </div>${renderGenerationActivityOverlay()}</div>`;
}

function renderModelSvg() {
  const ds = state.designState;
  const p = ds.parameters;
  const enabled = enabledFeatureIds();
  const mode = state.viewMode;
  if (mode === "top") return renderTopSvg(p, enabled);
  if (mode === "front") return renderFrontSvg(p, enabled);
  if (mode === "right") return renderRightSvg(p, enabled);
  return renderIsoSvg(p, enabled);
}

function shapeClass(featureId) {
  return `feature-shape ${state.selectedFeatureId === featureId ? "feature-selected" : ""}`;
}

function onShape(featureId) {
  return `onclick="selectGeometry('${featureId}')"`;
}

function svgDefs() {
  return `<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b6fe8"/></marker>
    <linearGradient id="plateTop" x1="0" x2="1"><stop offset="0" stop-color="#90c3f3"/><stop offset="1" stop-color="#4f86f7"/></linearGradient>
    <linearGradient id="plateSide" x1="0" x2="1"><stop offset="0" stop-color="#2363d6"/><stop offset="1" stop-color="#1e4fb8"/></linearGradient>
    <linearGradient id="boss" x1="0" x2="1"><stop offset="0" stop-color="#9ad3bd"/><stop offset="1" stop-color="#5f9f87"/></linearGradient>
  </defs>`;
}

function renderIsoSvg(p, enabled) {
  const selected = state.selectedFeatureId;
  const width = 720;
  const height = 450;
  const cx = 365;
  const cy = 220;
  const sx = Math.min(250, p.plate_length * 4.1);
  const sy = Math.min(168, p.plate_width * 4);
  const thick = Math.max(24, p.plate_thickness * 5);
  const bossR = Math.max(28, p.boss_d * 2.15);
  const bossH = Math.max(22, p.boss_h * 5);
  const top = [
    [cx - sx / 2, cy - sy / 2],
    [cx + sx / 2, cy - sy / 2 - 28],
    [cx + sx / 2 + 62, cy + sy / 2 - 8],
    [cx - sx / 2 + 62, cy + sy / 2 + 20],
  ];
  const bottom = top.map(([x, y]) => [x, y + thick]);
  const points = (arr) => arr.map(([x, y]) => `${x},${y}`).join(" ");
  const holeCenters = [
    [top[0][0] + 48, top[0][1] + 44],
    [top[1][0] - 34, top[1][1] + 42],
    [top[3][0] + 44, top[3][1] - 26],
    [top[2][0] - 42, top[2][1] - 34],
  ];
  const bossCx = cx + 30;
  const bossCy = cy - 10;
  const showBoss = enabled.has("center_boss");
  const showHoles = enabled.has("hole_pattern");
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(t("preview"))}">
    ${svgDefs()}
    <rect width="100%" height="100%" fill="#f6f8fb"/>
    ${grid()}
    <line x1="130" y1="340" x2="620" y2="285" stroke="#f5b84b"/>
    <line x1="130" y1="340" x2="104" y2="150" stroke="#b7eb4a"/>
    <polygon points="${points([top[0], top[1], bottom[1], bottom[0]])}" fill="url(#plateSide)"/>
    <polygon points="${points([top[1], top[2], bottom[2], bottom[1]])}" fill="#2d6fe7"/>
    <polygon class="${shapeClass("base_plate")}" ${onShape("base_plate")} points="${points(top)}" fill="url(#plateTop)" stroke="#2a5bbf"/>
    ${enabled.has("fillet_corners") ? holeCenters.map(([x, y]) => `<ellipse class="${shapeClass("fillet_corners")}" ${onShape("fillet_corners")} cx="${x}" cy="${y}" rx="25" ry="13" fill="#a8b0ba" stroke="#7a8490"/>`).join("") : ""}
    ${showHoles ? holeCenters.map(([x, y]) => `<ellipse class="${shapeClass("hole_pattern")}" ${onShape("hole_pattern")} cx="${x}" cy="${y}" rx="${Math.max(6, p.hole_d * 2.2)}" ry="${Math.max(3.5, p.hole_d * 1.25)}" fill="#39445a" stroke="#182032"/>`).join("") : ""}
    ${showBoss ? `<ellipse class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${bossCx}" cy="${bossCy + bossH}" rx="${bossR}" ry="${bossR * .38}" fill="#4f8f78" opacity=".9"/>
      <rect x="${bossCx - bossR}" y="${bossCy}" width="${bossR * 2}" height="${bossH}" fill="url(#boss)" opacity=".85"/>
      <ellipse class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${bossCx}" cy="${bossCy}" rx="${bossR}" ry="${bossR * .38}" fill="#9bd3bd" stroke="#4e8b75"/>
      ${enabled.has("center_hole") ? `<ellipse class="${shapeClass("center_hole")}" ${onShape("center_hole")} cx="${bossCx}" cy="${bossCy}" rx="${Math.max(18, p.center_hole_d * 2.2)}" ry="${Math.max(7, p.center_hole_d)}" fill="#111827" stroke="#05070c"/>` : ""}` : ""}
    ${state.showBBox ? `<polygon class="bbox" points="${points([[top[0][0]-10, top[0][1]-10], [top[1][0]+10, top[1][1]-10], [bottom[2][0]+10, bottom[2][1]+10], [bottom[3][0]-10, bottom[3][1]+10]])}"/>` : ""}
    ${state.showDims ? isoDims(p, top, bottom, bossCx, bossCy) : ""}
    ${renderFeatureCallouts(p, enabled, {
      base_plate: [top[0][0] + 14, top[0][1] + 10, top[0][0] - 110, top[0][1] - 32],
      fillet_corners: [holeCenters[0][0] - 18, holeCenters[0][1] - 8, holeCenters[0][0] - 108, holeCenters[0][1] - 34],
      hole_pattern: [holeCenters[1][0] + 10, holeCenters[1][1] - 8, holeCenters[1][0] + 56, holeCenters[1][1] - 42],
      center_boss: [bossCx + bossR * .65, bossCy, bossCx + 84, bossCy - 44],
      center_hole: [bossCx + 18, bossCy - 2, bossCx + 58, bossCy - 36],
    })}
  </svg>`;
}

function renderFeatureCallouts(p, enabled, anchors) {
  const featureId = state.selectedFeatureId;
  if (!anchors[featureId] || !enabled.has(featureId)) return "";
  const text = featureCalloutText(p, featureId);
  if (!text) return "";
  return svgCallout(text, ...anchors[featureId]);
}

function featureCalloutText(p, featureId) {
  const mode = state.measureMode;
  if (featureId === "base_plate") {
    if (mode === "distance" && state.showDims) return "";
    if (mode === "angle") return t("callout.datumAngle");
    if (mode === "diameter") return t("callout.diagonal", { value: formatNumber(Math.hypot(p.plate_length, p.plate_width)) });
    return t("callout.plate", { x: formatNumber(p.plate_length), y: formatNumber(p.plate_width), z: formatNumber(p.plate_thickness) });
  }
  if (featureId === "fillet_corners") return t("callout.fillet", { value: formatNumber(p.corner_radius) });
  if (featureId === "hole_pattern") {
    if (mode === "distance") return t("callout.spacing", { x: formatNumber(Math.max(0, p.plate_length - 24)), y: formatNumber(Math.max(0, p.plate_width - 24)) });
    if (mode === "angle") return t("callout.holeAxes");
    return t("callout.holeDia", { value: formatNumber(p.hole_d) });
  }
  if (featureId === "center_boss") {
    if (mode === "distance") return t("callout.height", { value: formatNumber(p.boss_h) });
    if (mode === "angle") return t("callout.axis");
    return t("callout.dia", { value: formatNumber(p.boss_d) });
  }
  if (featureId === "center_hole") return t("callout.dia", { value: formatNumber(p.center_hole_d) });
  return "";
}

function svgCallout(text, x, y, labelX, labelY) {
  const width = Math.max(78, Math.min(190, text.length * 7.2 + 18));
  return `
    <line class="dim-line" x1="${x}" y1="${y}" x2="${labelX}" y2="${labelY + 5}"/>
    <rect x="${labelX - 8}" y="${labelY - 18}" width="${width}" height="26" rx="6" fill="rgba(255,255,255,.94)" stroke="#cfe4ff"/>
    <text class="dim-label" x="${labelX}" y="${labelY}">${text}</text>
  `;
}

function grid() {
  let out = "";
  for (let i = -8; i <= 12; i++) {
    out += `<line x1="${60 + i * 48}" y1="390" x2="${260 + i * 48}" y2="110" stroke="#dfe5ee" stroke-width="1"/>`;
    out += `<line x1="${80 + i * 52}" y1="128" x2="${620 + i * 12}" y2="390" stroke="#e6ebf2" stroke-width="1"/>`;
  }
  return out;
}

function isoDims(p, top, bottom, bossCx, bossCy) {
  return `
    <line class="dim-line" x1="${bottom[0][0]}" y1="${bottom[0][1] + 26}" x2="${bottom[1][0]}" y2="${bottom[1][1] + 26}"/>
    <text class="dim-label" x="${(bottom[0][0] + bottom[1][0]) / 2}" y="${(bottom[0][1] + bottom[1][1]) / 2 + 42}">${formatNumber(p.plate_length)} mm</text>
    <line class="dim-line" x1="${bottom[2][0] + 20}" y1="${bottom[2][1]}" x2="${bottom[1][0] + 20}" y2="${bottom[1][1]}"/>
    <text class="dim-label" x="${bottom[2][0] + 34}" y="${(bottom[2][1] + bottom[1][1]) / 2}">${formatNumber(p.plate_width)} mm</text>
    <line class="dim-line" x1="${top[0][0] - 28}" y1="${top[0][1]}" x2="${bottom[0][0] - 28}" y2="${bottom[0][1]}"/>
    <text class="dim-label" x="${top[0][0] - 70}" y="${(top[0][1] + bottom[0][1]) / 2}">${formatNumber(p.plate_thickness)} mm</text>
  `;
}

function renderTopSvg(p, enabled) {
  const w = 720, h = 450, x = 180, y = 110, plateW = 360, plateH = 230;
  const holes = [[x+58,y+52],[x+plateW-58,y+52],[x+58,y+plateH-52],[x+plateW-58,y+plateH-52]];
  return `<svg viewBox="0 0 ${w} ${h}">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" rx="${enabled.has("fillet_corners") ? Math.max(6, p.corner_radius * 3) : 2}" fill="#6faaf5" stroke="#2a5bbf"/>
    ${enabled.has("hole_pattern") ? holes.map(([hx, hy]) => `<circle class="${shapeClass("hole_pattern")}" ${onShape("hole_pattern")} cx="${hx}" cy="${hy}" r="${Math.max(7, p.hole_d * 2.8)}" fill="#39445a"/>`).join("") : ""}
    ${enabled.has("center_boss") ? `<circle class="${shapeClass("center_boss")}" ${onShape("center_boss")} cx="${x+plateW/2}" cy="${y+plateH/2}" r="${Math.max(35, p.boss_d * 2.2)}" fill="#8bc6ad" stroke="#4e8b75"/>
      ${enabled.has("center_hole") ? `<circle class="${shapeClass("center_hole")}" ${onShape("center_hole")} cx="${x+plateW/2}" cy="${y+plateH/2}" r="${Math.max(12, p.center_hole_d * 2.2)}" fill="#111827"/>` : ""}` : ""}
    ${state.showBBox ? `<rect class="bbox" x="${x-8}" y="${y-8}" width="${plateW+16}" height="${plateH+16}"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-22}" y="${y+plateH+57}">${formatNumber(p.plate_length)} mm</text><line class="dim-line" x1="${x+plateW+34}" y1="${y}" x2="${x+plateW+34}" y2="${y+plateH}"/><text class="dim-label" x="${x+plateW+48}" y="${y+plateH/2}">${formatNumber(p.plate_width)} mm</text>` : ""}
    ${renderFeatureCallouts(p, enabled, {
      base_plate: [x + 10, y + 10, x + 24, y - 28],
      fillet_corners: [x + 8, y + 8, x + 28, y - 28],
      hole_pattern: [holes[1][0], holes[1][1], holes[1][0] + 36, holes[1][1] - 32],
      center_boss: [x + plateW / 2 + Math.max(35, p.boss_d * 2.2), y + plateH / 2, x + plateW / 2 + 76, y + plateH / 2 - 56],
      center_hole: [x + plateW / 2 + 12, y + plateH / 2, x + plateW / 2 + 52, y + plateH / 2 + 62],
    })}
  </svg>`;
}

function renderFrontSvg(p, enabled) {
  const x = 150, y = 250, plateW = 420, plateH = Math.max(34, p.plate_thickness * 5);
  const bossH = Math.max(30, p.boss_h * 6), bossW = Math.max(100, p.boss_d * 5);
  return `<svg viewBox="0 0 720 450">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" fill="#4f86f7" stroke="#2a5bbf"/>
    ${enabled.has("center_boss") ? `<rect class="${shapeClass("center_boss")}" ${onShape("center_boss")} x="${x+plateW/2-bossW/2}" y="${y-bossH}" width="${bossW}" height="${bossH}" fill="url(#boss)" stroke="#4e8b75"/>` : ""}
    ${state.showBBox ? `<rect class="bbox" x="${x-10}" y="${enabled.has("center_boss") ? y-bossH-10 : y-10}" width="${plateW+20}" height="${plateH+(enabled.has("center_boss") ? bossH : 0)+20}"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-22}" y="${y+plateH+58}">${formatNumber(p.plate_length)} mm</text>` : ""}
  </svg>`;
}

function renderRightSvg(p, enabled) {
  const x = 190, y = 250, plateW = 340, plateH = Math.max(34, p.plate_thickness * 5);
  const bossH = Math.max(30, p.boss_h * 6), bossW = Math.max(100, p.boss_d * 5);
  return `<svg viewBox="0 0 720 450">
    ${svgDefs()}<rect width="100%" height="100%" fill="#f6f8fb"/>${grid()}
    <rect class="${shapeClass("base_plate")}" ${onShape("base_plate")} x="${x}" y="${y}" width="${plateW}" height="${plateH}" fill="#4f86f7" stroke="#2a5bbf"/>
    ${enabled.has("center_boss") ? `<rect class="${shapeClass("center_boss")}" ${onShape("center_boss")} x="${x+plateW/2-bossW/2}" y="${y-bossH}" width="${bossW}" height="${bossH}" fill="url(#boss)" stroke="#4e8b75"/>` : ""}
    ${state.showDims ? `<line class="dim-line" x1="${x}" y1="${y+plateH+34}" x2="${x+plateW}" y2="${y+plateH+34}"/><text class="dim-label" x="${x+plateW/2-20}" y="${y+plateH+58}">${formatNumber(p.plate_width)} mm</text>` : ""}
  </svg>`;
}

function renderProperties() {
  const ds = state.designState;
  const feature = selectedFeature();
  if (!ds || !feature) return;
  if (state.previewMode === "generated") {
    $("properties").innerHTML = `
      <div class="properties-head">
        <div class="feature-meta">
          <div><strong>${escapeHtml(t("generatedModel"))}</strong><span>${escapeHtml(t("agent"))} · ${escapeHtml(engineLabel())} · ${state.previewPng ? escapeHtml(t("previewReady")) : escapeHtml(t("waiting"))}</span></div>
          <div class="version-pill">AI</div>
        </div>
        <div class="rename-row">
          <input class="text-input" value="${escapeHtml(state.generatedPrompt || t("agentModel"))}" disabled />
          <button class="icon-button" type="button" title="${escapeHtml(t("backToDesignState"))}" onclick="showParametricDesign()">${icon("undo")}</button>
      </div>
    </div>
      ${renderFreeCadDocumentSummarySection()}
      ${renderFreeCadAssemblySection()}
      ${renderFreeCadTechDrawSection()}
      ${renderFreeCadObjectPropertySection()}
      ${renderGeneratedParameterSection()}
      <section class="section">
        <h3>${icon("code")} ${escapeHtml(t("generatedSource"))}</h3>
        <div class="kv-list">
          <div class="kv"><span>${escapeHtml(t("prompt"))}</span><strong>${state.generatedPrompt ? escapeHtml(t("saved")) : escapeHtml(t("none"))}</strong></div>
          <div class="kv"><span>${escapeHtml(t("engine"))}</span><strong>${escapeHtml(engineLabel())}</strong></div>
          ${state.engine === "freecad" ? `<div class="kv"><span>${escapeHtml(t("freecadVersion"))}</span><strong>${state.freecadVersion ? escapeHtml(state.freecadVersion) : escapeHtml(t("waiting"))}</strong></div>` : ""}
          <div class="kv"><span>${escapeHtml(scriptTitle())}</span><strong>${state.script ? escapeHtml(t("readyValue")) : escapeHtml(t("waiting"))}</strong></div>
        </div>
      </section>
      <section class="section">
        <h3>${icon("box")} ${escapeHtml(t("artifacts"))}</h3>
        <div class="kv-list">
          <div class="kv"><span>${escapeHtml(t("viewport"))}</span><strong>${hasInteractiveViewerArtifact() ? escapeHtml(t("interactiveMesh")) : state.previewPng ? escapeHtml(t("pngFallback")) : escapeHtml(t("waiting"))}</strong></div>
          <div class="kv"><span>STEP / STL</span><strong>${escapeHtml(artifactExportStatusLabel())}</strong></div>
          <div class="kv"><span>${escapeHtml(t("featureTree"))}</span><strong>${freeCadTreeDisplayNodes().length ? escapeHtml(t("readyValue")) : escapeHtml(t("notAvailable"))}</strong></div>
        </div>
      </section>
    `;
    return;
  }
  const params = feature.parameters.length ? feature.parameters : parameterOrder;
  const enabled = enabledFeatureIds().has(feature.id);

    <div class="selected-object-summary" style="margin-top:10px">

function freeCadTechDrawPageKey(page) {
  return page?.name || page?.label || "";
}

function freeCadTechDrawPageDisplayName(page) {
  return page?.label || page?.name || "Page";
}

function freeCadTechDrawPageStatusText(page) {
  const diagnostics = page?.layout_diagnostics || {};
  const quality = diagnostics.export_quality || page?.status || "";
  const product = page?.product_grade === false ? "fallback" : "product-grade";
  return [freeCadTechDrawPageDisplayName(page), quality, diagnostics.severity, product].filter(Boolean).join(": ");
}

function freeCadTechDrawViewText(view) {
  const source = Array.isArray(view?.source)
    ? view.source.map((item) => item.label || item.name || item.type_id || "").filter(Boolean).join(",")
    : "";
  const placement = [Number.isFinite(Number(view?.x)) ? `x ${formatNumber(view.x)}` : "", Number.isFinite(Number(view?.y)) ? `y ${formatNumber(view.y)}` : ""].filter(Boolean).join(" · ");
  return [view?.kind || view?.type_id || "view", source, placement].filter(Boolean).join(" · ");
}

function freeCadTechDrawDimensionText(dimension) {
  const refs = Array.isArray(dimension?.references2D)
    ? dimension.references2D.map((item) => item.subelement || item.reference || "").filter(Boolean).join(",")
    : "";
  return [dimension?.type || dimension?.dimension_type || "Dimension", dimension?.dimension_mode || "", refs].filter(Boolean).join(" · ");
}

  const pageName = freeCadTechDrawPageKey(page);

    ["Shells", shape.shell_count],

    <section class="section">

      <div class="kv-list">
        <div class="kv"><span>Name</span><strong>${escapeHtml(obj.name || "")}</strong></div>
        ${obj.label && obj.label !== obj.name ? `<div class="kv"><span>Label</span><strong>${escapeHtml(obj.label)}</strong></div>` : ""}
        ${freeCadObjectGeometryText(obj) ? `<div class="kv"><span>${escapeHtml(t("shapeSummary"))}</span><strong>${escapeHtml(freeCadObjectGeometryText(obj))}</strong></div>` : ""}

    <section class="section">
      <h3>${icon("sliders")} ${escapeHtml(t("editableProperties"))}</h3>

    ${readonly.length ? `<section class="section">

function renderFreeCadSubelementSection(obj) {
  const refs = freeCadSubelements(obj);
  if (!refs.length) return "";
  const objectName = freeCadObjectKey(obj);
  const selected = selectedFreeCadSubelementRef();
  const selectedItem = selected ? freeCadSubelementByRef(obj, selected.reference, selected.stableId) : null;
  const actions = selected ? renderFreeCadSubelementActions(obj, selected, selectedItem) : "";
  const selectedSummary = selected ? `<div class="selected-object-summary">
    <strong>${escapeHtml(t("selectedReference"))}: ${escapeHtml(selected.reference)}</strong>
    <span>${escapeHtml([selected.kind, freeCadSubelementSummaryText(selectedItem)].filter(Boolean).join(" · "))}</span>
  </div>` : "";
  return `<section class="section">
    <h3>${icon("pointer")} Subelements</h3>
    ${selectedSummary}
    ${actions}
    <div class="subelement-grid">
      ${refs.map((item) => {
        const reference = item.reference || item.name || "";
        const stableId = item.stable_id || item.stableId || "";
        const active = selected
          && normalizeFreeCadToken(selected.objectName) === normalizeFreeCadToken(objectName)
          && (normalizeFreeCadToken(selected.reference) === normalizeFreeCadToken(reference) || (stableId && normalizeFreeCadToken(selected.stableId) === normalizeFreeCadToken(stableId)));
        return `<button class="subelement-row ${active ? "active" : ""}" type="button" onclick="selectFreeCadSubelement(${escapeHtml(jsString(objectName))}, ${escapeHtml(jsString(reference))}, ${escapeHtml(jsString(item.group || item.kind || ""))}, ${escapeHtml(jsString(stableId))})" title="${escapeHtml(freeCadSubelementSummaryText(item))}">
          <strong>${escapeHtml(reference)}</strong>
          <span>${escapeHtml(freeCadSubelementSummaryText(item) || item.shape_type || "")}</span>
        </button>`;
      }).join("")}
    </div>
  </section>`;
}

function freeCadSubelementActionButton(labelKey, iconName, onclick, disabled = false, disabledTitleKey = "") {
  const title = disabled && disabledTitleKey ? t(disabledTitleKey) : t(labelKey);
  return `<button class="typed-action-button" type="button" title="${escapeHtml(title)}" ${disabled ? "disabled" : `onclick="${escapeHtml(onclick)}"`}>
    ${icon(iconName)} ${escapeHtml(t(labelKey))}
  </button>`;
}

function freeCadSubelementKind(selected, selectedItem) {
  return selected?.kind || selectedItem?.group || selectedItem?.kind || "";
}

function freeCadPairedEdgeReference(obj, reference) {
  return freeCadSubelements(obj).find((item) => {
    return (item.group || item.kind) === "Edge"
      && normalizeFreeCadToken(item.reference || item.name) !== normalizeFreeCadToken(reference);
  })?.reference || "";
}

function freeCadSubelementPoint(item) {
  return freeCadTriplet(item?.point) || freeCadTriplet(item?.center);
}

function freeCadSubelementStableId(item, selected = null) {
  return item?.stable_id || item?.stableId || selected?.stableId || "";
}

function freeCadSubelementLegacyStableId(item, selected = null) {
  return item?.legacy_stable_id || item?.legacyStableId || selected?.legacyStableId || "";
}

function freeCadSubelementStableReference(item, selected = null) {
  return item?.stable_reference || item?.stableReference || selected?.stableReference || "";
}

function freeCadSubelementSignature(item, selected = null) {
  return item?.signature || selected?.signature || null;
}

function freeCadSubelementSignatureVersion(item, selected = null) {
  return item?.signature_version || item?.signatureVersion || selected?.signatureVersion || null;
}

function freeCadSubelementStability(item, selected = null) {
  return item?.stability || selected?.stability || "";
}

function freeCadSubelementStablePatchFields(item, selected = null) {
  const stableId = freeCadSubelementStableId(item, selected);
  const stableReference = freeCadSubelementStableReference(item, selected);
  const signature = freeCadSubelementSignature(item, selected);
  const signatureVersion = freeCadSubelementSignatureVersion(item, selected);
  const fields = {};
  if (stableId) fields.stable_id = stableId;
  if (stableReference) fields.stable_reference = stableReference;
  if (signature) fields.signature = signature;
  if (signatureVersion) fields.signature_version = signatureVersion;
  const kind = item?.group || item?.kind || selected?.kind || "";
  if (kind) fields.kind = kind;
  return fields;
}

function firstFreeCadAssembly() {
  return freeCadAssemblies()[0] || null;
}

function freeCadConnectorKind(kind, reference) {
  const normalized = normalizeFreeCadToken(kind || reference);
  if (normalized === "edge" || /^edge/i.test(reference || "")) return "Edge";
  if (normalized === "vertex" || /^vertex/i.test(reference || "")) return "Vertex";
  return "";
}

function freeCadConnectorFromSelection(obj, reference, kind, item = null) {
  const connectorKind = freeCadConnectorKind(kind, reference);
  if (!obj || !reference || !connectorKind) return null;
  const point = freeCadSubelementPoint(item);
  return {
    objectName: freeCadObjectKey(obj),
    objectLabel: freeCadObjectDisplayName(obj),
    selector: freeCadObjectSelector(obj),
    reference,
    kind: connectorKind,
    stableId: freeCadSubelementStableId(item),
    legacyStableId: freeCadSubelementLegacyStableId(item),
    stableReference: freeCadSubelementStableReference(item),
    signature: freeCadSubelementSignature(item),
    signatureVersion: freeCadSubelementSignatureVersion(item),
    stability: freeCadSubelementStability(item),
    point,
  };
}

function freeCadConnectorDisplayName(connector) {
  if (!connector) return "";
  return `${connector.objectLabel || connector.objectName || ""}.${connector.reference || ""}`;
}

function freeCadConnectorSame(left, right) {
  return Boolean(left && right)
    && normalizeFreeCadToken(left.objectName) === normalizeFreeCadToken(right.objectName)
    && normalizeFreeCadToken(left.reference) === normalizeFreeCadToken(right.reference);
}

function freeCadConnectorObjectSame(left, right) {
  return Boolean(left && right)
    && normalizeFreeCadToken(left.objectName) === normalizeFreeCadToken(right.objectName);
}

function assemblyConnectorPayload(connector) {
  const payload = { selector: connector.selector || { name: connector.objectName } };
  if (connector.kind === "Vertex") {
    payload.vertex = connector.reference;
    if (connector.stableId) payload.stable_ids = ["", connector.stableId];
    if (connector.stableReference) payload.stable_references = ["", connector.stableReference];
    if (connector.signature) payload.stable_signatures = [null, connector.signature];
  } else {
    payload.element = connector.reference;
    if (connector.stableId) payload.stable_id = connector.stableId;
    if (connector.stableReference) payload.stable_reference = connector.stableReference;
    if (connector.signature) payload.signature = connector.signature;
  }
  if (connector.kind) payload.kind = connector.kind;
  return payload;
}

function assemblyConnectorDistance(left, right) {
  const a = freeCadTriplet(left?.point);
  const b = freeCadTriplet(right?.point);
  if (!a || !b) return null;
  const distance = Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  return Number.isFinite(distance) ? distance : null;
}

function renderFreeCadSubelementActions(obj, selected, selectedItem) {
  const kind = freeCadSubelementKind(selected, selectedItem);
  const reference = selected.reference || selectedItem?.reference || "";
  const objectName = freeCadObjectKey(obj);
  if (!reference || !objectName) return "";
  const normalizedKind = normalizeFreeCadToken(kind || reference);
  const connector = freeCadConnectorFromSelection(obj, reference, kind, selectedItem);
  const stableArg = jsString(selectedItem?.stable_id || selectedItem?.stableId || selected.stableId || "");
  const anchor = state.assemblyConnectorAnchor;
  const canCreateJoint = Boolean(connector && anchor && !freeCadConnectorSame(anchor, connector) && !freeCadConnectorObjectSame(anchor, connector));
  const hasSketch = Boolean(firstFreeCadSketchObject());
  const hasTechDrawView = Boolean(firstFreeCadTechDrawPage() && firstFreeCadTechDrawView());
  const buttons = [];
  const objectArg = jsString(objectName);
  const refArg = jsString(reference);
  if (connector) {
    const connectorSummary = anchor ? `<div class="selected-object-summary">
      <strong>${escapeHtml(t("assemblyConnectorA"))}: ${escapeHtml(freeCadConnectorDisplayName(anchor))}</strong>
      <span>${escapeHtml(anchor.kind || "")}</span>
    </div>` : "";
    buttons.push(freeCadSubelementActionButton(
      "setAssemblyConnectorA",
      "pointer",
      `setAssemblyConnectorAnchor(${objectArg}, ${refArg}, ${stableArg})`
    ));
    if (anchor) {
      buttons.push(freeCadSubelementActionButton(
        "clearAssemblyConnectorA",
        "undo",
        "clearAssemblyConnectorAnchor()"
      ));
      [
        ["fixed", "createFixedJoint"],
        ["revolute", "createRevoluteJoint"],
        ["slider", "createSliderJoint"],
        ["cylindrical", "createCylindricalJoint"],
        ["distance", "createDistanceJoint"],
        ["angle", "createAngleJoint"],
      ].forEach(([jointType, labelKey]) => {
        buttons.push(freeCadSubelementActionButton(
          labelKey,
          "layers",
          `createAssemblyJointFromSelectedConnectors(${jsString(jointType)}, ${objectArg}, ${refArg}, ${stableArg})`,
          !canCreateJoint,
          !anchor ? "needsConnectorA" : "needsDifferentObject"
        ));
      });
    }
    if (connectorSummary) {
      buttons.unshift(connectorSummary);
    }
  }
  if (normalizedKind === "face" || /^face/i.test(reference)) {
    buttons.push(freeCadSubelementActionButton(
      "createSketchOnFace",
      "ruler",
      `createSketchOnSelectedFace(${objectArg}, ${refArg})`
    ));
    buttons.push(freeCadSubelementActionButton(
      "attachSketchToFace",
      "pointer",
      `attachSketchToSelectedFace(${objectArg}, ${refArg})`,
      !hasSketch,
      "needsSketch"
    ));
  }
  if (normalizedKind === "edge" || /^edge/i.test(reference)) {
    const paired = freeCadPairedEdgeReference(obj, reference);
    buttons.push(freeCadSubelementActionButton(
      "addExternalGeometry",
      "ruler",
      `addSelectedExternalGeometry(${objectArg}, ${refArg})`,
      !hasSketch,
      "needsSketch"
    ));
    buttons.push(freeCadSubelementActionButton(
      "addTechDrawDimension",
      "edit",
      `addSelectedTechDrawDimension(${objectArg}, ${refArg})`,
      !hasTechDrawView,
      "needsTechDrawView"
    ));
    buttons.push(freeCadSubelementActionButton(
      "addTechDrawCenterline",
      "layers",
      `addSelectedTechDrawCenterline(${objectArg}, ${refArg}, ${jsString(paired)})`,
      !hasTechDrawView || !paired,
      !hasTechDrawView ? "needsTechDrawView" : "notAvailable"
    ));
  }
  if (normalizedKind === "vertex" || /^vertex/i.test(reference)) {
    buttons.push(freeCadSubelementActionButton(
      "addTechDrawCosmeticVertex",
      "pointer",
      `addSelectedTechDrawCosmeticVertex(${objectArg}, ${refArg})`,
      !hasTechDrawView || !freeCadSubelementPoint(selectedItem),
      !hasTechDrawView ? "needsTechDrawView" : "notAvailable"
    ));
  }
  if (!buttons.length) return "";
  return `<div class="feature-actions" aria-label="${escapeHtml(t("typedActions"))}">${buttons.join("")}</div>`;
}

function renderFreeCadSketchPropertySection(obj) {
  const sketch = obj?.sketch;
  if (!sketch) return "";
  const constraints = Array.isArray(sketch.constraints) ? sketch.constraints : [];
  const geometry = Array.isArray(sketch.geometry) ? sketch.geometry : [];
  const editMode = sketch.edit_mode || {};
  const conflictingConstraints = Array.isArray(editMode.conflicting_constraints) ? editMode.conflicting_constraints : [];
  const redundantConstraints = Array.isArray(editMode.redundant_constraints) ? editMode.redundant_constraints : [];
  const editableConstraints = constraints
    .filter((constraint) => Number.isFinite(Number(constraint.value)))
    .slice(0, 16);
