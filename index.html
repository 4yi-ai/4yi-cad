function viewerSceneObjectByName(scene, objectName) {
  const normalized = normalizeFreeCadToken(objectName);
  if (!normalized || !Array.isArray(scene?.objects)) return null;
  return scene.objects.find((obj) => {
    return normalizeFreeCadToken(obj.name) === normalized
      || normalizeFreeCadToken(obj.label) === normalized;
  }) || null;
}

function viewerSceneAveragePoint(points) {
  const values = (Array.isArray(points) ? points : [])
    .map(freeCadTriplet)
    .filter(Boolean);
  if (!values.length) return null;
  const total = values.reduce((acc, point) => [acc[0] + point[0], acc[1] + point[1], acc[2] + point[2]], [0, 0, 0]);
  return total.map((value) => value / values.length);
}

function viewerSceneSubelementPoint(objectScene, reference) {
  const normalized = normalizeFreeCadToken(reference);
  if (!objectScene || !normalized) return freeCadBboxInfo(objectScene?.bbox)?.center || null;
  const vertex = (objectScene.vertices || []).find((item) => {
    return normalizeFreeCadToken(item.reference || item.name) === normalized;
  });
  if (vertex) return freeCadTriplet(vertex.point || vertex.center);
  const edge = (objectScene.edges || []).find((item) => {
    return normalizeFreeCadToken(item.reference || item.name) === normalized;
  });
  if (edge) return freeCadTriplet(edge.center) || viewerSceneAveragePoint(edge.points);
  const face = (objectScene.faces || []).find((item) => {
    return normalizeFreeCadToken(item.reference || item.name) === normalized;
  });
  if (face) return freeCadTriplet(face.center) || freeCadBboxInfo(face.bbox)?.center || viewerSceneAveragePoint(face.vertices);
  return freeCadBboxInfo(objectScene.bbox)?.center || null;
}

function viewerSceneConnectorPoint(scene, reference) {
  if (!reference || typeof reference !== "object") return null;
  const objRef = reference.object || reference.part || {};
  const objectScene = viewerSceneObjectByName(scene, objRef.name || objRef.label || reference.objectName || "");
  if (!objectScene) return null;
  const subelements = Array.isArray(reference.subelements)
    ? reference.subelements.filter(Boolean)
    : [reference.reference, reference.element, reference.vertex].filter(Boolean);
  if (!subelements.length) return freeCadBboxInfo(objectScene.bbox)?.center || null;
  for (const subelement of subelements) {
    const point = viewerSceneSubelementPoint(objectScene, subelement);
    if (point) return point;
  }
  return freeCadBboxInfo(objectScene.bbox)?.center || null;
}

function freeCadPointDistance(left, right) {
  const a = freeCadTriplet(left);
  const b = freeCadTriplet(right);
  if (!a || !b) return null;
  const distance = Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  return Number.isFinite(distance) ? distance : null;
}

function freeCadJointVisualizationLabel(joint, pointA, pointB) {
  const jointType = freeCadJointTypeValue(joint) || "Joint";
  if (jointType === "Distance") {
    const distance = freeCadJointScalarValue(joint, "distance") ?? freeCadPointDistance(pointA, pointB);
    return distance !== null ? `${formatNumber(distance)} mm` : jointType;
  }
  if (jointType === "Angle") {
    const angle = freeCadJointScalarValue(joint, "angle");
    return angle !== null ? `${formatNumber(angle)} deg` : jointType;
  }
  return jointType;
}

function freeCadJointVisualizationSelected(assembly, joint) {
  const selected = state.selectedFreeCadAssemblyJoint;
  return Boolean(selected)
    && normalizeFreeCadToken(selected.assemblyName) === normalizeFreeCadToken(freeCadAssemblyKey(assembly))
    && normalizeFreeCadToken(selected.jointName) === normalizeFreeCadToken(freeCadJointKey(joint));
}

function addFreeCadViewerLabelSprite(THREE, group, text, point, options = {}) {
  const location = freeCadTriplet(point);
  if (!text || !location) return null;
  const canvas = document.createElement("canvas");
  canvas.width = 384;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "700 34px system-ui, -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const metrics = ctx.measureText(text);
  const width = Math.min(canvas.width - 18, Math.max(58, metrics.width + 30));
  const x = canvas.width / 2 - width / 2;
  ctx.fillStyle = options.fill || "rgba(255,255,255,0.96)";
  ctx.strokeStyle = options.stroke || "#bfdbfe";
  ctx.lineWidth = 4;
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, 36, width, 56, 10);
  } else {
    ctx.rect(x, 36, width, 56);
  }
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = options.color || "#0b6fe8";
  ctx.fillText(text, canvas.width / 2, 65);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, depthTest: false });
  const sprite = new THREE.Sprite(material);
  sprite.position.set(location[0], location[1], location[2]);
  const scale = Number(options.scale) || Math.max(8, freeCadPickPadding() * 5);
  sprite.scale.set(scale * 2.4, scale * 0.8, 1);
  sprite.renderOrder = options.renderOrder || 24;
  group.add(sprite);
  return sprite;
}

function freeCadSketchObjects() {
  return freeCadDocumentObjects().filter((obj) => freeCadObjectIsSketch(obj) && obj.sketch);
}

function activeFreeCadSketchObject() {
  const selected = freeCadObjectByName(state.selectedFreeCadObjectName);
  if (selected && freeCadObjectIsSketch(selected)) return selected;
  const sketchElement = state.selectedFreeCadSketchElement;
  if (sketchElement?.sketchName) {
    const obj = freeCadObjectByName(sketchElement.sketchName);
    if (obj && freeCadObjectIsSketch(obj)) return obj;
  }
  return firstFreeCadSketchObject();
}

function freeCadSketchPoint(sketch, point) {
  const local = freeCadTriplet(point);
  if (!local) return null;
  const base = freeCadTriplet(sketch?.placement?.base) || [0, 0, 0];
  return [base[0] + local[0], base[1] + local[1], base[2] + local[2]];
}

function freeCadSketchLocalPoint(sketch, modelPoint) {
  const model = freeCadTriplet(modelPoint);
  if (!model) return null;
  const base = freeCadTriplet(sketch?.placement?.base) || [0, 0, 0];
  return [model[0] - base[0], model[1] - base[1], model[2] - base[2]];
}

function freeCadSnapSketchPoint(point) {
  const values = freeCadTriplet(point);
  if (!values || !state.sketchSnapEnabled) return values;
  const grid = Number(state.sketchSnapSize) > 0 ? Number(state.sketchSnapSize) : 1;
  return values.map((value) => Math.round(value / grid) * grid);
}

function freeCadSketchElementSelected(sketchName, kind, index) {
  const selected = state.selectedFreeCadSketchElement;
  return Boolean(selected)
    && normalizeFreeCadToken(selected.sketchName) === normalizeFreeCadToken(sketchName)
    && normalizeFreeCadToken(selected.kind) === normalizeFreeCadToken(kind)
    && Number(selected.index) === Number(index);
}

function freeCadSketchPointEntries(geometry) {
  return ["start", "end", "center", "location", "point"]
    .map((role) => ({ role, point: freeCadTriplet(geometry?.[role]) }))
    .filter((item) => item.point);
}

function freeCadSketchGeometryAnchor(sketch, geometry) {
  if (!geometry) return null;
  const points = [
    freeCadSketchPoint(sketch, geometry.point || geometry.location),
    freeCadSketchPoint(sketch, geometry.center),
    freeCadSketchPoint(sketch, geometry.start),
    freeCadSketchPoint(sketch, geometry.end),
  ].filter(Boolean);
  if (!points.length) return null;
  const total = points.reduce((acc, point) => [acc[0] + point[0], acc[1] + point[1], acc[2] + point[2]], [0, 0, 0]);
  return total.map((value) => value / points.length);
}

function freeCadSketchCirclePoints(sketch, geometry, segments = 56) {
  const center = freeCadSketchPoint(sketch, geometry.center || geometry.location);
  const radius = Number(geometry.radius || geometry.major_radius || 0);
  if (!center || !Number.isFinite(radius) || radius <= 0) return [];
  const first = Number.isFinite(Number(geometry.first_parameter)) ? Number(geometry.first_parameter) : 0;
  const last = Number.isFinite(Number(geometry.last_parameter)) ? Number(geometry.last_parameter) : Math.PI * 2;
  const span = Math.abs(last - first) > 1e-6 ? (last - first) : Math.PI * 2;
  const count = Math.max(8, Math.min(segments, Math.ceil(Math.abs(span) / (Math.PI * 2) * segments)));
  const points = [];
  for (let index = 0; index <= count; index += 1) {
    const tValue = first + (span * index) / count;
    points.push([center[0] + Math.cos(tValue) * radius, center[1] + Math.sin(tValue) * radius, center[2]]);
  }
  return points;
}

function addViewerSceneSketchEditOverlay(THREE, group) {
  const targets = [];
  const radius = Math.max(0.28, freeCadPickPadding() * 0.42);
  for (const obj of freeCadSketchObjects()) {
    const sketch = obj.sketch || {};
    const sketchName = freeCadObjectKey(obj);
    const geometry = Array.isArray(sketch.geometry) ? sketch.geometry : [];
    const constraints = Array.isArray(sketch.constraints) ? sketch.constraints : [];
    const editMode = sketch.edit_mode || {};
    const issueGeometry = freeCadSketchIssueGeometryIndexes(sketchName);
    const issueConstraints = freeCadSketchIssueConstraintIndexes(sketchName);
    const selectedSketch = normalizeFreeCadToken(sketchName) === normalizeFreeCadToken(state.selectedFreeCadObjectName);
    const selectedConstraint = state.selectedFreeCadSketchElement?.kind === "constraint"
      && normalizeFreeCadToken(state.selectedFreeCadSketchElement?.sketchName) === normalizeFreeCadToken(sketchName)
      ? constraints.find((constraint) => Number(constraint.index) === Number(state.selectedFreeCadSketchElement.index))
      : null;
    const selectedConstraintGeometry = freeCadConstraintGeometryIndexSet(selectedConstraint);
    const hasSketchIssue = issueGeometry.size > 0 || issueConstraints.size > 0;
    if (!selectedSketch && !selectedConstraint && !hasSketchIssue) continue;
    for (const item of geometry.slice(0, 160)) {
      const selected = freeCadSketchElementSelected(sketchName, "geometry", item.index);
      const relatedToSelectedConstraint = selectedConstraintGeometry.has(Number(item.index));
      const severity = issueGeometry.has(Number(item.index)) ? "error" : item.diagnostic_severity || "";
      const geometryAnchorSelected = freeCadSketchGeometryRefsEqual(state.sketchGeometryConstraintAnchor, {
        sketchName,
        geometryIndex: Number(item.index) || 0,
      });
      const color = selected
        ? 0x0b6fe8
        : relatedToSelectedConstraint
        ? 0x2563eb
        : geometryAnchorSelected
        ? 0xf59e0b
        : severity === "error"
        ? 0xdc2626
        : severity === "warning"
        ? 0xb45309
        : item.construction
        ? 0x64748b
        : 0xef4444;
      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity: selected || relatedToSelectedConstraint || geometryAnchorSelected ? 0.98 : item.construction ? 0.38 : severity ? 0.9 : 0.76,
      });
      const linePoints = [];
      const start = freeCadSketchPoint(sketch, item.start);
      const end = freeCadSketchPoint(sketch, item.end);
      if (start && end) linePoints.push(start, end);
      else linePoints.push(...freeCadSketchCirclePoints(sketch, item));
      if (linePoints.length >= 2) {
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute("position", new THREE.Float32BufferAttribute(linePoints.flat(), 3));
        const line = new THREE.Line(lineGeometry, material);
        line.userData.freeCadSelection = {
          type: "sketch_element",
          sketchName,
          kind: "geometry",
          index: Number(item.index) || 0,
          priority: -2,
        };
        line.renderOrder = selected ? 31 : 26;
        group.add(line);
        targets.push(line);
      }
      const anchor = freeCadSketchGeometryAnchor(sketch, item);
      if (anchor) {
        const point = new THREE.Mesh(
          new THREE.SphereGeometry(selected || relatedToSelectedConstraint ? radius * 1.25 : radius, 10, 6),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: selected || relatedToSelectedConstraint ? 0.94 : 0.58, depthWrite: false })
        );
        point.position.set(anchor[0], anchor[1], anchor[2]);
        point.userData.freeCadSelection = {
          type: "sketch_element",
          sketchName,
          kind: "geometry",
          index: Number(item.index) || 0,
          priority: -3,
        };
        point.renderOrder = selected ? 32 : 27;
        group.add(point);
        targets.push(point);
      }
      for (const entry of freeCadSketchPointEntries(item)) {
        const modelPoint = freeCadSketchPoint(sketch, entry.point);
        if (!modelPoint) continue;
        const roleSelected = selected && normalizeFreeCadToken(state.selectedFreeCadSketchElement?.pointRole) === normalizeFreeCadToken(entry.role);
        const pointAnchorSelected = freeCadSketchPointRefsEqual(state.sketchCoincidenceAnchor, {
          sketchName,
          geometryIndex: Number(item.index) || 0,
          pointRole: entry.role,
        });
        const handle = new THREE.Mesh(
          new THREE.SphereGeometry(roleSelected || relatedToSelectedConstraint || pointAnchorSelected || geometryAnchorSelected ? radius * 1.55 : radius * 1.18, 14, 8),
          new THREE.MeshBasicMaterial({
            color: roleSelected ? 0x16a34a : relatedToSelectedConstraint ? 0xbfdbfe : pointAnchorSelected || geometryAnchorSelected ? 0xf59e0b : severity === "error" ? 0xfecaca : 0xffffff,
            transparent: true,
            opacity: roleSelected || relatedToSelectedConstraint || pointAnchorSelected || geometryAnchorSelected ? 0.98 : 0.88,
            depthWrite: false,
          })
        );
        handle.position.set(modelPoint[0], modelPoint[1], modelPoint[2]);
        handle.userData.freeCadSelection = {
          type: "sketch_point",
          sketchName,
          kind: "geometry",
          index: Number(item.index) || 0,
          pointRole: entry.role,
          priority: roleSelected ? -8 : relatedToSelectedConstraint || pointAnchorSelected || geometryAnchorSelected ? -7 : -6,
        };
        handle.renderOrder = roleSelected ? 40 : relatedToSelectedConstraint || pointAnchorSelected || geometryAnchorSelected ? 38 : 34;
        group.add(handle);
        targets.push(handle);
      }
    }
    for (const constraint of constraints.slice(0, 120)) {
      const selected = freeCadSketchElementSelected(sketchName, "constraint", constraint.index);
      const issue = issueConstraints.has(Number(constraint.index));
      const severity = issue ? "error" : freeCadConstraintSeverity(constraint, editMode);
      const related = freeCadSketchConstraintGeometryItems(obj, constraint);
      const anchors = related.map((item) => freeCadSketchGeometryAnchor(sketch, item)).filter(Boolean);
      const anchor = anchors.length ? viewerSceneAveragePoint(anchors) : freeCadSketchPoint(sketch, [0, 0, 0]);
      if (!anchor) continue;
      if ((selected || issue || severity === "error" || severity === "warning") && anchors.length > 1) {
        const connectorPoints = [];
        for (const refAnchor of anchors) connectorPoints.push(...anchor, ...refAnchor);
        const connectorGeometry = new THREE.BufferGeometry();
        connectorGeometry.setAttribute("position", new THREE.Float32BufferAttribute(connectorPoints, 3));
        const connector = new THREE.LineSegments(
          connectorGeometry,
          new THREE.LineBasicMaterial({
            color: severity === "error" ? 0xdc2626 : severity === "warning" ? 0xb45309 : 0x2563eb,
            transparent: true,
            opacity: selected || issue ? 0.82 : 0.46,
            depthWrite: false,
          })
        );
        connector.userData.freeCadSelection = {
          type: "sketch_element",
          sketchName,
          kind: "constraint",
          index: Number(constraint.index) || 0,
          severity,
          priority: selected ? -5 : -4,
        };
        connector.renderOrder = selected || issue ? 35 : 29;
        group.add(connector);
        targets.push(connector);
      }
      const label = `${freeCadConstraintGlyphText(constraint)} #${constraint.index}`;
      const sprite = addFreeCadViewerLabelSprite(THREE, group, label, anchor, {
        color: severity === "error" ? "#dc2626" : severity === "warning" ? "#b45309" : "#0b6fe8",
        stroke: selected ? "#0b6fe8" : severity === "error" ? "#fecaca" : severity === "warning" ? "#fde68a" : "#bfdbfe",
        scale: selected ? Math.max(12, freeCadPickPadding() * 5.8) : Math.max(9, freeCadPickPadding() * 4.4),
        renderOrder: selected ? 36 : 30,
      });
      if (!sprite) continue;
      sprite.userData.freeCadSelection = {
        type: "sketch_element",
        sketchName,
        kind: "constraint",
        index: Number(constraint.index) || 0,
        severity,
        priority: selected ? -5 : -4,
      };
      targets.push(sprite);
    }
  }
  return targets;
}

function addViewerSceneAssemblyJoints(THREE, group, scene) {
  if (!scene || !freeCadAssemblies().length) return [];
  const targets = [];
  const radius = Math.max(0.45, freeCadPickPadding() * 0.7);
  const labelScale = Math.max(10, freeCadPickPadding() * 5.4);
  for (const assembly of freeCadAssemblies()) {
    for (const joint of assembly.joints || []) {
      if (joint.kind !== "joint") continue;
      const pointA = viewerSceneConnectorPoint(scene, joint.reference1);
      const pointB = viewerSceneConnectorPoint(scene, joint.reference2);
      if (!pointA || !pointB) continue;
      const selected = freeCadJointVisualizationSelected(assembly, joint);
      const color = selected ? 0x0b6fe8 : 0x7c3aed;
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute([...pointA, ...pointB], 3));
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity: selected ? 0.98 : 0.72,
      }));
      line.userData.freeCadSelection = {
        type: "assembly_joint",
        assemblyName: freeCadAssemblyKey(assembly),
        jointName: freeCadJointKey(joint),
        priority: selected ? -3 : -1,
      };
      line.renderOrder = selected ? 22 : 18;
      group.add(line);
      targets.push(line);

      [pointA, pointB].forEach((point, index) => {
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(selected ? radius * 1.2 : radius, 12, 8),
          new THREE.MeshBasicMaterial({
            color: index === 0 ? 0x0b6fe8 : 0x22c55e,
            transparent: true,
            opacity: selected ? 0.96 : 0.8,
            depthWrite: false,
          })
        );
        sphere.position.set(point[0], point[1], point[2]);
        sphere.userData.freeCadSelection = {
          type: "assembly_joint",
          assemblyName: freeCadAssemblyKey(assembly),
          jointName: freeCadJointKey(joint),
          priority: selected ? -4 : -2,
        };
        sphere.renderOrder = selected ? 23 : 19;
        group.add(sphere);
        targets.push(sphere);
        addFreeCadViewerLabelSprite(THREE, group, index === 0 ? "A" : "B", point, {
          scale: labelScale * 0.52,
          renderOrder: selected ? 27 : 24,
          color: index === 0 ? "#0b6fe8" : "#16a34a",
        });
      });

      const mid = [
        (pointA[0] + pointB[0]) / 2,
        (pointA[1] + pointB[1]) / 2,
        (pointA[2] + pointB[2]) / 2,
      ];
      addFreeCadViewerLabelSprite(THREE, group, freeCadJointVisualizationLabel(joint, pointA, pointB), mid, {
        scale: labelScale,
        renderOrder: selected ? 28 : 25,
      });
    }
  }
  return targets;
}

function addFreeCadSelectionBoxes(THREE, group, options = {}) {
  const selectedName = normalizeFreeCadToken(state.selectedFreeCadObjectName);
  const mode = freeCadViewerSelectionMode();
  const targetKind = freeCadSubelementKindForSelectionMode(mode);
  const includeFaceProxies = options.includeFaceProxies !== false;
  const includeEdgeProxies = options.includeEdgeProxies !== false;
  const includeVertexProxies = options.includeVertexProxies !== false;
  const targets = [];
  freeCadSelectableShapeObjects().forEach((obj) => {
    const bbox = obj.shape.bbox;
    const info = freeCadBboxInfo(bbox);
    if (!info) return;
    const objectName = freeCadObjectKey(obj);
    const isSelected = selectedName && normalizeFreeCadToken(objectName) === selectedName;
    const visible = state.showBBox || isSelected || mode === "object";
    const box = addFreeCadBoxTarget(THREE, group, {
      type: "object",
      objectName,
      kind: "Object",
      info,
      color: isSelected ? 0x0b6fe8 : freeCadSelectionColor("Object"),
      opacity: isSelected ? 0.16 : visible ? 0.025 : 0,
      outline: visible,
      outlineOpacity: isSelected ? 0.96 : 0.58,
      priority: 10,
      renderOrder: 4,
    });
    if (!box) return;
    targets.push(box);

    if (!targetKind) return;
    freeCadSubelements(obj).forEach((item) => {
      const kind = item.group || item.kind || "";
      if (kind !== targetKind) return;
      if (kind === "Face" && !includeFaceProxies) return;
      if (kind === "Edge" && !includeEdgeProxies) return;
      if (kind === "Vertex" && !includeVertexProxies) return;
      const reference = item.reference || item.name || "";
      if (!reference) return;
      const pickInfo = freeCadBboxInfo(item.bbox, item.center);
      const stableId = item.stable_id || item.stableId || "";
      const subSelected = freeCadSubelementMatchesSelection(objectName, reference, kind, stableId);
      const subVisible = subSelected || state.showBBox;
      const subTarget = addFreeCadBoxTarget(THREE, group, {
        type: "subelement",
        objectName,
        reference,
        kind,
        stableId,
        legacyStableId: item.legacy_stable_id || item.legacyStableId || "",
        stableReference: item.stable_reference || item.stableReference || "",
        signature: item.signature || null,
        signatureVersion: item.signature_version || item.signatureVersion || null,
        stability: item.stability || "",
        info: pickInfo,
        color: subSelected ? 0x0b6fe8 : freeCadSelectionColor(kind),
        opacity: subSelected ? 0.34 : subVisible ? 0.075 : 0.012,
        outline: subSelected || (state.showBBox && kind !== "Face"),
        outlineOpacity: subSelected ? 0.95 : 0.42,
        priority: { Face: 1, Edge: 0, Vertex: -1 }[kind] ?? 2,
        renderOrder: subSelected ? 8 : 6,
      });
      if (subTarget) targets.push(subTarget);
    });
  });
  return targets;
}

function chooseFreeCadViewerHit(hits) {
  const mode = freeCadViewerSelectionMode();
  const targetKind = freeCadSubelementKindForSelectionMode(mode);
  const ranked = hits
    .map((hit, index) => {
      const selection = hit.object?.userData?.freeCadSelection || {};
      let rank = 100;
      if (selection.type === "sketch_point") rank = targetKind ? 25 : (selection.priority ?? -6);
      else if (selection.type === "assembly_joint") rank = targetKind ? 24 : (selection.priority ?? -1);
      else if (selection.type === "sketch_element") rank = targetKind ? 26 : (selection.priority ?? -2);
      else if (targetKind && selection.kind === targetKind) rank = selection.priority ?? 0;
      else if (!targetKind && selection.type === "object") rank = 0;
      else if (selection.type === "object") rank = 30;
      return { hit, rank, index };
    })
    .filter((item) => item.rank < 100)
    .sort((a, b) => a.rank - b.rank || a.hit.distance - b.hit.distance || a.index - b.index);
  return ranked[0]?.hit || null;
}

function freeCadViewerRaycaster(event, renderer, camera, THREE) {
  const rect = renderer.domElement.getBoundingClientRect();
  const pointer = new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.params.Line = { threshold: 0.08 };
  raycaster.setFromCamera(pointer, camera);
  return raycaster;
}

function freeCadModelPointOnCameraPlane(event, renderer, camera, group, THREE, originModelPoint) {
  const origin = freeCadTriplet(originModelPoint);
  if (!origin) return null;
  const worldOrigin = new THREE.Vector3(origin[0], origin[1], origin[2]);
  group.localToWorld(worldOrigin);
  const normal = new THREE.Vector3();
  camera.getWorldDirection(normal);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, worldOrigin);
  const worldPoint = new THREE.Vector3();
  const raycaster = freeCadViewerRaycaster(event, renderer, camera, THREE);
  if (!raycaster.ray.intersectPlane(plane, worldPoint)) return null;
  const modelPoint = group.worldToLocal(worldPoint.clone());
  return [modelPoint.x, modelPoint.y, modelPoint.z];
}

function freeCadSketchPointDragTarget(selection) {
  if (!selection?.sketchName || !selection.pointRole) return null;
  const obj = freeCadObjectByName(selection.sketchName);
  if (!obj || !freeCadObjectIsSketch(obj)) return null;
  const geometry = (Array.isArray(obj.sketch?.geometry) ? obj.sketch.geometry : [])
    .find((item) => Number(item.index) === Number(selection.index));
  const localPoint = freeCadTriplet(geometry?.[selection.pointRole]);
  const modelPoint = freeCadSketchPoint(obj.sketch, localPoint);
  if (!geometry || !localPoint || !modelPoint) return null;
  return { obj, geometry, localPoint, modelPoint };
}

function freeCadSketchDragDelta(start, current) {
  const a = freeCadTriplet(start);
  const b = freeCadTriplet(current);
  if (!a || !b) return null;
  return [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
}

function freeCadSketchDragStats(sketch, geometry) {
  const editMode = sketch?.edit_mode || {};
  const constraintIndexes = Array.isArray(geometry?.constraint_indexes)
    ? geometry.constraint_indexes.map(Number).filter(Number.isFinite)
    : [];
  const diagnostics = Array.isArray(geometry?.constraint_diagnostics) ? geometry.constraint_diagnostics : [];
  const severity = freeCadSketchGeometrySeverity(geometry);
  const dof = editMode.degrees_of_freedom ?? sketch?.degrees_of_freedom ?? null;
  const diagnosticLabels = diagnostics
    .filter((item) => item?.severity || item?.status || item?.solver_status)
    .map((item) => {
      const index = Number.isFinite(Number(item.index)) ? `#${Number(item.index)}` : "";
      const label = item.severity || item.status || item.solver_status || "";
      return [label, index].filter(Boolean).join(" ");
    });
  return {
    severity,
    degreesOfFreedom: dof,
    constraintCount: constraintIndexes.length || diagnostics.length || 0,
    diagnostics: diagnosticLabels.slice(0, 3),
    solverStatus: geometry?.solver_status || freeCadSketchSolverText(sketch),
  };
}

function cancelFreeCadSketchLiveSolve(options = {}) {
  sketchLiveSolveToken += 1;
  if (sketchLiveSolveTimer) {
    clearTimeout(sketchLiveSolveTimer);
    sketchLiveSolveTimer = null;
  }
  if (options.clearState !== false) {
    state.sketchLiveSolve = null;
    if (state.sketchDragPreview?.liveSolve) state.sketchDragPreview = { ...state.sketchDragPreview, liveSolve: null };
  }
}

function freeCadSketchLiveSolveSeverity(live) {
  const status = String(live?.status || "").toLowerCase();
  if (status === "blocked" || status === "failed") return "error";
  if (status === "checking") return "warning";
  return "info";
}

function freeCadSketchLiveSolveStatusText(live) {
  if (!live) return "";
  const labels = {
    checking: t("sketchLiveSolveChecking"),
    ok: t("sketchLiveSolveOk"),
    blocked: t("sketchLiveSolveBlocked"),
    failed: t("sketchLiveSolveFailed"),
  };
  const status = labels[live.status] || live.status || t("sketchLiveSolve");
  const pieces = [status];
  if (Number.isFinite(Number(live.degreesOfFreedom))) {
    pieces.push(`${t("degreesOfFreedom")} ${formatNumber(live.degreesOfFreedom)}`);
  }
  if (live.solverState) pieces.push(live.solverState);
  if (live.message) pieces.push(live.message);
  return pieces.filter(Boolean).join(" | ");
}

function freeCadSketchLiveSolveMatchesPreview(live, preview) {
  if (!live || !preview) return false;
  return normalizeFreeCadToken(live.sketchName) === normalizeFreeCadToken(preview.sketchName)
    && Number(live.geometryIndex) === Number(preview.geometryIndex)
    && String(live.pointRole || "") === String(preview.pointRole || "");
}

function freeCadSketchLiveSolveForSketch(sketchName) {
  const live = state.sketchLiveSolve;
  if (!live || !sketchName) return null;
  return normalizeFreeCadToken(live.sketchName) === normalizeFreeCadToken(sketchName) ? live : null;
}

function freeCadSketchLiveSolveConstraintIndexes(sketchName = "") {
  const live = freeCadSketchLiveSolveForSketch(sketchName || state.selectedFreeCadObjectName);
  const indexes = new Set();
  for (const issue of live?.issues || []) {
    for (const value of issue.constraintIndexes || []) {
      const index = Number(value);
      if (Number.isFinite(index)) indexes.add(index);
    }
  }
  return indexes;
}

function freeCadSketchLiveSolveGeometryIndexes(sketchName = "") {
  const live = freeCadSketchLiveSolveForSketch(sketchName || state.selectedFreeCadObjectName);
  const indexes = new Set();
  for (const issue of live?.issues || []) {
    for (const value of issue.geometryIndexes || []) {
      const index = Number(value);
      if (Number.isFinite(index)) indexes.add(index);
    }
  }
  return indexes;
}

function freeCadSketchSummaryFromPreview(preview, sketchName = "") {
  const target = normalizeFreeCadToken(sketchName);
  const matches = (name) => !target || normalizeFreeCadToken(name) === target;
  for (const obj of Array.isArray(preview?.document_summary?.objects) ? preview.document_summary.objects : []) {
    if (obj?.sketch && matches(obj.name || obj.label || obj.sketch.name || obj.sketch.label || "")) return obj.sketch;
  }
  for (const result of Array.isArray(preview?.patch_results) ? preview.patch_results : []) {
    const name = result.sketch?.name || result.object?.name || result.object?.label || result.sketch_summary?.name || result.sketch_summary?.label || "";
    if (result.sketch_summary && matches(name)) return result.sketch_summary;
  }
  return null;
}

function freeCadSketchLiveSolveIssueBlocks(issue) {
  const severity = String(issue?.severity || "").toLowerCase();
  const code = String(issue?.code || "").toLowerCase();
  return severity === "error"
    || code.includes("conflict")
    || code.includes("malformed")
    || code.includes("redundant")
    || code.includes("dry_run_failed");
}

function freeCadSketchLiveSolveSummary(preview, sketchName = "") {
  const issues = freeCadSketchPreviewIssues(preview);
  const blocking = preview?.ok === false || issues.some(freeCadSketchLiveSolveIssueBlocks);
  const sketch = freeCadSketchSummaryFromPreview(preview, sketchName);
  const editMode = sketch?.edit_mode || {};
  const firstIssue = issues.find(freeCadSketchLiveSolveIssueBlocks) || issues[0] || null;
  return {
    status: preview?.ok === false ? "failed" : blocking ? "blocked" : "ok",
    blocking,
    issues,
    degreesOfFreedom: editMode.degrees_of_freedom ?? sketch?.degrees_of_freedom ?? null,
    solverState: editMode.state || freeCadSketchSolverText(sketch) || "",
    message: firstIssue ? [firstIssue.code, firstIssue.message].filter(Boolean).join(": ") : "",
  };
}

function scheduleFreeCadSketchLiveSolve(drag, localPoint) {
  const point = freeCadTriplet(localPoint);
  const obj = freeCadObjectByName(drag?.objectName || drag?.selection?.sketchName);
  const pointRole = drag?.selection?.pointRole || "";
  if (!drag || !point || !pointRole || !obj || !freeCadObjectIsSketch(obj) || !Number.isFinite(Number(drag.selection?.index))) return;
  if (sketchLiveSolveTimer) clearTimeout(sketchLiveSolveTimer);
  const token = ++sketchLiveSolveToken;
  const liveBase = {
    status: "checking",
    sketchName: freeCadObjectKey(obj),
    geometryIndex: Number(drag.selection.index),
    pointRole,
    point,
    issues: [],
    blocking: false,
    degreesOfFreedom: null,
    solverState: "",
    message: "",
  };
  state.sketchLiveSolve = liveBase;
  setFreeCadSketchDragPreview(drag, point, { liveSolve: liveBase });
  sketchLiveSolveTimer = setTimeout(async () => {
    sketchLiveSolveTimer = null;
    const patch = freeCadSketchGeometryPointPatch(
      liveBase.sketchName,
      liveBase.geometryIndex,
      liveBase.pointRole,
      liveBase.point
    );
    if (!patch) return;
    try {
      const preview = await previewFreeCadDocumentPatch(patch, freeCadPatchDetail(patch), { quiet: true });
      if (token !== sketchLiveSolveToken) return;
      state.sketchLiveSolve = {
        ...liveBase,
        ...freeCadSketchLiveSolveSummary(preview, liveBase.sketchName),
        preview,
      };
    } catch (error) {
      if (token !== sketchLiveSolveToken) return;
      state.sketchLiveSolve = {
        ...liveBase,
        status: "failed",
        blocking: true,
        message: error.message || t("log.unknownError"),
        issues: [{
          severity: "error",
          code: "dry_run_failed",
          message: error.message || t("log.unknownError"),
          sketchName: liveBase.sketchName,
          geometryIndexes: [liveBase.geometryIndex],
          constraintIndexes: [],
        }],
      };
    }
    if (freeCadSketchLiveSolveMatchesPreview(state.sketchLiveSolve, state.sketchDragPreview)) {
      state.sketchDragPreview = { ...state.sketchDragPreview, liveSolve: state.sketchLiveSolve };
      updateFreeCadSketchDragReadout();
      renderProperties();
    }
  }, 450);
}

function freeCadSketchDragPreviewText(preview) {
  if (!preview) return "";
  const live = preview.liveSolve || (freeCadSketchLiveSolveMatchesPreview(state.sketchLiveSolve, preview) ? state.sketchLiveSolve : null);
  const point = freeCadTriplet(preview.currentPoint);
  const pieces = [
    `${preview.geometryLabel || preview.sketchName || "Sketch"}${preview.pointRole ? `.${preview.pointRole}` : ""}`,
  ];
  if (point) {
    pieces.push(`X ${formatNumber(point[0])}`);
    pieces.push(`Y ${formatNumber(point[1])}`);
    pieces.push(`Z ${formatNumber(point[2])} ${t("unitMm")}`);
  }
  if (Number.isFinite(Number(preview.degreesOfFreedom))) pieces.push(`${preview.degreesOfFreedom} DOF`);
  if (Number(preview.constraintCount) > 0) pieces.push(`${Number(preview.constraintCount)} constraints`);
  if (preview.severity) pieces.push(preview.severity);
  if (Array.isArray(preview.diagnostics) && preview.diagnostics.length) {
    pieces.push(preview.diagnostics.join(", "));
  }
  if (live) pieces.push(`${t("sketchLiveSolve")}: ${freeCadSketchLiveSolveStatusText(live)}`);
  return pieces.filter(Boolean).join(" | ");
}

function freeCadSketchDragPreviewAxisText(preview) {
  const delta = freeCadTriplet(preview?.delta);
  if (!delta) return "";
  return `dX ${formatNumber(delta[0])} / dY ${formatNumber(delta[1])} / dZ ${formatNumber(delta[2])} ${t("unitMm")} / d ${formatNumber(preview.distance || 0)} ${t("unitMm")}`;
}

function updateFreeCadSketchDragReadout() {
  const preview = state.sketchDragPreview;
  if (!preview) return;
  const title = $("measureTitle");
  const text = $("measureText");
  const axis = $("axisReadout");
  if (title) title.textContent = preview.committing ? t("sketchDragCommit") : t("sketchDragPreview");
  if (text) text.textContent = freeCadSketchDragPreviewText(preview);
  if (axis) axis.textContent = freeCadSketchDragPreviewAxisText(preview);
}

function setFreeCadSketchDragPreview(drag, localPoint, options = {}) {
  const obj = freeCadObjectByName(drag?.objectName || drag?.selection?.sketchName);
  const geometry = obj ? freeCadSketchGeometryByIndex(obj, drag?.selection?.index) : drag?.geometry;
  const point = freeCadTriplet(localPoint);
  const start = freeCadTriplet(drag?.startLocalPoint || drag?.localPoint || geometry?.[drag?.selection?.pointRole]);
  if (!obj || !freeCadObjectIsSketch(obj) || !geometry || !point || !start) return null;
  const delta = freeCadSketchDragDelta(start, point) || [0, 0, 0];
  const stats = freeCadSketchDragStats(obj.sketch, geometry);
  const preview = {
    sketchName: freeCadObjectKey(obj),
    geometryIndex: Number(geometry.index) || 0,
    pointRole: drag?.selection?.pointRole || "",
    geometryLabel: freeCadSketchGeometryLabel(freeCadSketchGeometryRef(freeCadObjectKey(obj), geometry.index)),
    startPoint: start,
    currentPoint: point,
    delta,
    distance: Math.hypot(delta[0], delta[1], delta[2]),
    committing: options.committing === true,
    ...stats,
  };
  const liveSolve = options.liveSolve || (freeCadSketchLiveSolveMatchesPreview(state.sketchLiveSolve, preview) ? state.sketchLiveSolve : null);
  if (liveSolve) preview.liveSolve = liveSolve;
  state.sketchDragPreview = preview;
  updateFreeCadSketchDragReadout();
  return preview;
}

function clearFreeCadSketchDragPreview() {
  cancelFreeCadSketchLiveSolve();
  state.sketchDragPreview = null;
  state.sketchDryRunReview = null;
}

function clearFreeCadSketchDryRunReview(options = {}) {
  cancelFreeCadSketchLiveSolve();
  state.sketchDryRunReview = null;
  if (options.clearDragPreview !== false) state.sketchDragPreview = null;
  if (options.persist !== false) persistWorkbenchSession();
  if (options.render !== false) renderAll();
  return true;
}

function updateFreeCadSketchDragPreviewGeometry(drag, displayPoint) {
  const point = freeCadTriplet(displayPoint);
  if (!drag || !point || !Array.isArray(drag.previewObjects)) return;
  const displayDelta = freeCadSketchDragDelta(drag.startDisplayPoint, point) || [0, 0, 0];
  for (const preview of drag.previewObjects) {
    const attr = preview.line?.geometry?.getAttribute?.("position");
    if (!attr || !preview.positions?.length) continue;
    const next = preview.positions.slice();
    if (freeCadSketchGeometryIsLine(drag.geometry) && drag.selection?.pointRole === "start") {
      next.splice(0, 3, point[0], point[1], point[2]);
    } else if (freeCadSketchGeometryIsLine(drag.geometry) && drag.selection?.pointRole === "end") {
      next.splice(3, 3, point[0], point[1], point[2]);
    } else {
      for (let index = 0; index < next.length; index += 3) {
        next[index] = preview.positions[index] + displayDelta[0];
        next[index + 1] = preview.positions[index + 1] + displayDelta[1];
        next[index + 2] = preview.positions[index + 2] + displayDelta[2];
      }
    }
    attr.array.set(next);
    attr.needsUpdate = true;
    preview.line.geometry.computeBoundingSphere?.();
  }
}

function pickFreeCadViewerSelection(event, renderer, camera, targets, THREE) {
  if (!targets.length) return;
  const raycaster = freeCadViewerRaycaster(event, renderer, camera, THREE);
  const hit = chooseFreeCadViewerHit(raycaster.intersectObjects(targets, false));
  const selection = hit?.object?.userData?.freeCadSelection;
  if (selection?.type === "assembly_joint") {
    selectFreeCadAssemblyJoint(selection.assemblyName, selection.jointName);
    return;
  }
  if (selection?.type === "sketch_point") {
    selectFreeCadSketchElement(selection.sketchName, selection.kind, selection.index, selection.pointRole);
    return;
  }
  if (selection?.type === "sketch_element") {
    selectFreeCadSketchElement(selection.sketchName, selection.kind, selection.index);
    return;
  }
  if (!selection?.objectName) return;
  if (selection.type === "subelement" && selection.reference) {
    selectFreeCadSubelement(selection.objectName, selection.reference, selection.kind, selection.stableId || "", selection);
    return;
  }
  selectFreeCadObject(selection.objectName);
}

async function drawFreeCadSketchPrimitiveFromViewerClick(event, renderer, camera, group, THREE) {
  if (!["line", "circle", "arc"].includes(state.sketchEditTool)) return false;
  const obj = activeFreeCadSketchObject();
  if (!obj || !freeCadObjectIsSketch(obj)) return false;
  const base = freeCadTriplet(obj.sketch?.placement?.base) || [0, 0, 0];
  const modelPoint = freeCadModelPointOnCameraPlane(event, renderer, camera, group, THREE, base);
  const localPoint = freeCadSnapSketchPoint(freeCadSketchLocalPoint(obj.sketch, modelPoint));
  if (!localPoint) return false;
  return addFreeCadSketchPrimitive(freeCadObjectKey(obj), state.sketchEditTool, localPoint);
}

async function mountGeneratedCadViewer() {
  const container = $("generatedCadViewer");
  if (!container) {
    disposeGeneratedCadViewer();
    return;
  }
  const hasViewerSceneArtifact = state.artifacts.viewer_scene || artifactRef("viewer_scene");
  const hasStlArtifact = state.artifacts.stl || artifactRef("stl");
  if (!(hasViewerSceneArtifact || hasStlArtifact)) return;
  const key = container.dataset.viewerKey || "";
  if (generatedViewerRuntime?.container === container && generatedViewerRuntime.key === key) return;
  disposeGeneratedCadViewer();
  const token = ++generatedViewerToken;
  try {
    const [modules, viewerScene, stlBuffer] = await Promise.all([
      loadThreeModules(),
      generatedViewerSceneData(),
      generatedStlArrayBuffer(),
    ]);
    if (token !== generatedViewerToken || (!viewerScene && !stlBuffer) || !document.body.contains(container)) return;
    const { THREE, STLLoader, OrbitControls } = modules;
    const frame = container.closest(".generated-scene-frame");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.innerHTML = "";
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 1000);
    resizeGeneratedViewer(renderer, camera, container);
    camera.up.set(0, 0, 1);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableRotate = true;
    controls.enablePan = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a94a6, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(3, -5, 7);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd9e8ff, 1.1);
    fillLight.position.set(-4, 3, 5);
    scene.add(fillLight);

    let stlGeometry = null;
    let sceneBbox = freeCadBboxInfo(viewerScene?.bbox || state.documentSummary?.geometry?.bbox);
    if (!sceneBbox && stlBuffer) {
      stlGeometry = new STLLoader().parse(stlBuffer);
      stlGeometry.computeVertexNormals();
      stlGeometry.computeBoundingBox();
      if (stlGeometry.boundingBox) {
        const stlCenter = new THREE.Vector3();
        const stlSize = new THREE.Vector3();
        stlGeometry.boundingBox.getCenter(stlCenter);
        stlGeometry.boundingBox.getSize(stlSize);
        sceneBbox = {
          center: [stlCenter.x, stlCenter.y, stlCenter.z],
          size: [stlSize.x, stlSize.y, stlSize.z],
        };
      }
    }
    if (!sceneBbox) return;
    const center = new THREE.Vector3(...sceneBbox.center);
    const size = new THREE.Vector3(...sceneBbox.size.map((value) => Math.abs(Number(value) || 0)));
    const maxDim = Math.max(size.x, size.y, size.z, 1);
    const modelScale = (state.exploded ? 4.6 : 5.0) / maxDim;

    const group = new THREE.Group();
    group.scale.setScalar(modelScale);
    group.position.set(-center.x * modelScale, -center.y * modelScale, -center.z * modelScale);
    scene.add(group);

    let targets = [];
    const hasFaceScene = viewerSceneHasFaceMeshes(viewerScene);
    const hasEdgeScene = viewerSceneHasEdgeGeometry(viewerScene);
    const hasVertexScene = viewerSceneHasVertexGeometry(viewerScene);
    if (hasFaceScene || hasEdgeScene || hasVertexScene) {
      const faceTargets = addViewerSceneFaceMeshes(THREE, group, viewerScene);
      const edgeTargets = addViewerSceneEdgeTargets(THREE, group, viewerScene);
      const vertexTargets = addViewerSceneVertexTargets(THREE, group, viewerScene);
      const jointTargets = addViewerSceneAssemblyJoints(THREE, group, viewerScene);
      const sketchTargets = addViewerSceneSketchEditOverlay(THREE, group);
      const proxyTargets = addFreeCadSelectionBoxes(THREE, group, {
        includeFaceProxies: !faceTargets.length,
        includeEdgeProxies: !edgeTargets.length,
        includeVertexProxies: !vertexTargets.length,
      });
      targets = [...faceTargets, ...edgeTargets, ...vertexTargets, ...jointTargets, ...sketchTargets, ...proxyTargets];
    } else {
      const semanticTargets = addFreeCadSemanticObjectVisuals(THREE, group);
      const hasSemanticVisuals = semanticTargets.length > 0;
      if (!stlGeometry && stlBuffer) {
        stlGeometry = new STLLoader().parse(stlBuffer);
        stlGeometry.computeVertexNormals();
      }
      if (stlGeometry) {
        const material = new THREE.MeshStandardMaterial({
          color: 0x8f9aa6,
          roughness: 0.58,
          metalness: 0.04,
          side: THREE.DoubleSide,
          transparent: hasSemanticVisuals,
          opacity: hasSemanticVisuals ? 0.18 : 0.86,
          depthWrite: !hasSemanticVisuals,
        });
        const mesh = new THREE.Mesh(stlGeometry, material);
        mesh.renderOrder = hasSemanticVisuals ? 0 : 1;
        group.add(mesh);
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(stlGeometry, 32),
          new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: hasSemanticVisuals ? 0.18 : 0.42 })
        );
        edges.renderOrder = hasSemanticVisuals ? 1 : 2;
        group.add(edges);
      }
      targets = [
        ...semanticTargets,
        ...addViewerSceneSketchEditOverlay(THREE, group),
        ...addFreeCadSelectionBoxes(THREE, group),
      ];
    }
    let pointerDown = null;
    let sketchDrag = null;
    renderer.domElement.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      pointerDown = { x: event.clientX, y: event.clientY };
      const hit = chooseFreeCadViewerHit(
        freeCadViewerRaycaster(event, renderer, camera, THREE).intersectObjects(targets, false)
      );
      const selection = hit?.object?.userData?.freeCadSelection;
      if (selection?.type === "sketch_point" && state.sketchEditTool === "select") {
        const target = freeCadSketchPointDragTarget(selection);
        if (target) {
          selectFreeCadSketchElement(selection.sketchName, "geometry", selection.index, selection.pointRole, { render: false });
          const previewObjects = targets
            .filter((candidate) => {
              const candidateSelection = candidate.userData?.freeCadSelection || {};
              return candidate.isLine
                && candidate.geometry?.getAttribute?.("position")
                && candidateSelection.type === "sketch_element"
                && candidateSelection.kind === "geometry"
                && normalizeFreeCadToken(candidateSelection.sketchName) === normalizeFreeCadToken(selection.sketchName)
                && Number(candidateSelection.index) === Number(selection.index);
            })
            .map((line) => {
              const attr = line.geometry?.getAttribute?.("position");
              return attr ? { line, positions: Array.from(attr.array) } : null;
            })
            .filter(Boolean);
          sketchDrag = {
            selection,
            objectName: freeCadObjectKey(target.obj),
            sketch: target.obj.sketch,
            geometry: target.geometry,
            startLocalPoint: target.localPoint,
            startDisplayPoint: target.modelPoint,
            startModelPoint: target.modelPoint,
            currentLocalPoint: target.localPoint,
            handle: hit.object,
            previewObjects,
            moved: false,
            pointerId: event.pointerId,
          };
          setFreeCadSketchDragPreview(sketchDrag, target.localPoint);
          controls.enabled = false;
          try {
            renderer.domElement.setPointerCapture(event.pointerId);
          } catch (_error) {
            // Pointer capture is best-effort across browsers.
          }
        }
      }
    });
    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!sketchDrag) return;
      event.stopPropagation();
      const modelPoint = freeCadModelPointOnCameraPlane(
        event,
        renderer,
        camera,
        group,
        THREE,
        sketchDrag.startModelPoint
      );
      const localPoint = freeCadSnapSketchPoint(freeCadSketchLocalPoint(sketchDrag.sketch, modelPoint));
      const displayPoint = freeCadSketchPoint(sketchDrag.sketch, localPoint);
      if (!localPoint || !displayPoint) return;
      sketchDrag.currentLocalPoint = localPoint;
      sketchDrag.moved = true;
      updateFreeCadSketchDragPreviewGeometry(sketchDrag, displayPoint);
      sketchDrag.handle.position.set(displayPoint[0], displayPoint[1], displayPoint[2]);
      setFreeCadSketchDragPreview(sketchDrag, localPoint);
      scheduleFreeCadSketchLiveSolve(sketchDrag, localPoint);
    });
    renderer.domElement.addEventListener("pointerup", (event) => {
      event.stopPropagation();
      const moved = pointerDown ? Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y) : 0;
      pointerDown = null;
      if (sketchDrag) {
        const drag = sketchDrag;
        sketchDrag = null;
        controls.enabled = true;
        try {
          renderer.domElement.releasePointerCapture(drag.pointerId);
        } catch (_error) {
          // Pointer capture is best-effort across browsers.
        }
        if (drag.moved && drag.currentLocalPoint) {
          cancelFreeCadSketchLiveSolve({ clearState: false });
          setFreeCadSketchDragPreview(drag, drag.currentLocalPoint, { committing: true, liveSolve: state.sketchLiveSolve });
          void previewAndCommitFreeCadSketchGeometryPointValue(
            drag.objectName,
            drag.selection.index,
            drag.selection.pointRole,
            drag.currentLocalPoint
          ).then((ok) => {
            if (!ok && !state.sketchDryRunReview) {
              clearFreeCadSketchDragPreview();
              renderAll();
            }
          });
        } else {
          clearFreeCadSketchDragPreview();
          renderAll();
        }
        return;
      }
      if (moved <= 5) {
        void drawFreeCadSketchPrimitiveFromViewerClick(event, renderer, camera, group, THREE).then((handled) => {
          if (!handled) pickFreeCadViewerSelection(event, renderer, camera, targets, THREE);
        });
      }
    });
    renderer.domElement.addEventListener("pointercancel", () => {
      if (!sketchDrag) return;
      sketchDrag = null;
      controls.enabled = true;
      clearFreeCadSketchDragPreview();
      renderAll();
    });
    renderer.domElement.addEventListener("click", (event) => event.stopPropagation());
    renderer.domElement.addEventListener("wheel", (event) => event.stopPropagation(), { passive: false });

    const resizeObserver = new ResizeObserver(() => {
      resizeGeneratedViewer(renderer, camera, container);
      applyGeneratedViewerCamera(generatedViewerRuntime, selectedFreeCadFocusInfo(viewerScene));
    });
    resizeObserver.observe(container);
    generatedViewerRuntime = {
      key,
      container,
      scene,
      renderer,
      camera,
      controls,
      resizeObserver,
      animationId: 0,
      THREE,
      sceneBbox,
      sceneCenter: center,
      modelScale,
    };
    applyGeneratedViewerCamera(generatedViewerRuntime, selectedFreeCadFocusInfo(viewerScene));
    const animate = () => {
      if (!generatedViewerRuntime || generatedViewerRuntime.key !== key) return;
      generatedViewerRuntime.animationId = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    frame?.classList.add("viewer-ready");
    animate();
  } catch (error) {
    console.warn("Unable to mount interactive CAD viewer", error);
    if (container) {
      container.innerHTML = `<div class="cad-viewer-status">${escapeHtml(t("pngFallback"))}</div>`;
    }
  }
}

function historyLabelForStoredVersion(version) {
  if (version.intent === "rollback") return t("history.rollback");
  if (version.patch?.op === "request_script_rewrite") return t("history.scriptRewrite");
  if (version.patch?.op === "update_script_parameter") return t("history.scriptParameter", { name: version.patch.name || "" });
  if (version.patch?.op === "patch_fcstd_document") {
    const first = version.patch.patches?.[0];
    return t("history.freecadDocumentPatch", { name: freeCadPatchDisplayName(first) });
  }
  if (version.patch?.op === "update_parameter") return t("history.conversation", { name: parameterLabel(version.patch.name) });
  if (version.intent === "create") return t("history.agentGeneration");
  if (version.status === "failed") return t("history.agentGenerationFailed");
  return version.intent || "version";
}

function historyItemsFromServerVersions(versions = []) {
  return versions.slice().reverse().map((version) => ({
    id: version.id,
    serverVersionId: version.id,
    version: version.version_number,
    label: historyLabelForStoredVersion(version),
    detail: version.user_instruction || version.status || "",
    artifactRefs: artifactRefsFromMetadata(version.metadata),
  }));
}

function sessionSummaryVersion(item) {
  return item?.active_version || null;
}

function sessionSummaryTitle(item) {
  const session = item?.session || {};
  const version = sessionSummaryVersion(item);
  const metadata = version?.metadata || {};
  const title = String(session.title || "").trim();
  const genericTitle = !title || title === "4yi-cad session" || title === "Untitled CAD session";
  return metadata.generated_prompt || (!genericTitle ? title : "") || version?.user_instruction || title || t("untitledSession");
}

function sessionSummaryDetail(item) {
  const version = sessionSummaryVersion(item);
  const metadata = version?.metadata || {};
  return version?.user_instruction || metadata.generated_prompt || version?.intent || t("notAvailable");
}

function sessionSummaryTime(item) {
  const raw = item?.session?.updated_at || sessionSummaryVersion(item)?.created_at || "";
  if (!raw) return t("notAvailable");
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return raw;
  return date.toLocaleString(currentLocale === "zh" ? "zh-CN" : "en", {
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function sessionSummaryPreviewUrl(item) {
  const refs = artifactRefsFromMetadata(sessionSummaryVersion(item)?.metadata);
  return refs.preview?.url || "";
}

function sessionSummaryEngine(item) {
  return engineLabel(sessionSummaryVersion(item)?.metadata?.engine);
}

function renderSessionHistoryDrawer() {
  const root = $("sessionHistoryDrawer");
  if (!root) return;
  if (!state.sessionHistoryOpen) {
    root.innerHTML = "";
    return;
  }
  const body = state.sessionHistoryLoading
    ? `<div class="session-empty">${escapeHtml(t("sessionHistoryLoading"))}</div>`
    : state.sessionHistoryError
    ? `<div class="session-empty">${escapeHtml(t("sessionHistoryFailed", { message: state.sessionHistoryError }))}</div>`
    : state.sessionHistoryItems.length
    ? state.sessionHistoryItems.map(renderSessionHistoryRow).join("")
    : `<div class="session-empty">${escapeHtml(t("sessionHistoryEmpty"))}</div>`;
  root.innerHTML = `<div class="session-history-backdrop" onclick="closeSessionHistory()">
    <aside class="session-history-panel" onclick="event.stopPropagation()" aria-label="${escapeHtml(t("sessionHistoryTitle"))}">
      <header class="session-history-header">
        <div>
          <strong>${escapeHtml(t("sessionHistoryTitle"))}</strong>
          <span>${escapeHtml(t("sessionHistorySubtitle"))}</span>
        </div>
        <button class="icon-button" type="button" onclick="closeSessionHistory()" title="${escapeHtml(t("close"))}">${icon("x")}</button>
      </header>
      <div class="session-history-body">${body}</div>
    </aside>
  </div>`;
}

function renderSessionHistoryRow(item) {
  const session = item?.session || {};
  const title = sessionSummaryTitle(item);
  const detail = sessionSummaryDetail(item);
  const previewUrl = sessionSummaryPreviewUrl(item);
  const versionCount = Number(item?.version_count || 0);
  const isCurrent = Boolean(session.id && session.id === state.serverSessionId);
  return `<button class="session-row ${isCurrent ? "active" : ""}" type="button" onclick="restoreSessionFromHistory(${escapeHtml(jsString(session.id || ""))})" ${!session.id ? "disabled" : ""}>
    <span class="session-thumb">${previewUrl ? `<img src="${escapeHtml(previewUrl)}" alt="" loading="lazy" />` : icon("box")}</span>
    <span class="session-main">
      <strong>${escapeHtml(title)}</strong>
      <p>${escapeHtml(detail)}</p>
      <span class="session-meta">
        <span class="session-pill">${escapeHtml(sessionSummaryEngine(item))}</span>
        <span class="session-pill">${escapeHtml(t("versionCount", { count: versionCount }))}</span>
        ${isCurrent ? `<span class="session-pill">${escapeHtml(t("currentSession"))}</span>` : ""}
        <span>${escapeHtml(t("lastUpdated", { time: sessionSummaryTime(item) }))}</span>
      </span>
    </span>
  </button>`;
}

async function openSessionHistory() {
  state.sessionHistoryOpen = true;
  renderSessionHistoryDrawer();
  await loadSessionHistory();
}

function closeSessionHistory() {
  state.sessionHistoryOpen = false;
  renderSessionHistoryDrawer();
}

async function loadSessionHistory() {
  state.sessionHistoryLoading = true;
  state.sessionHistoryError = "";
  renderSessionHistoryDrawer();
  try {
    const result = await fetchJson("/api/sessions?limit=30");
    state.sessionHistoryItems = Array.isArray(result.sessions) ? result.sessions : [];
  } catch (error) {
    state.sessionHistoryItems = [];
    state.sessionHistoryError = error.message || t("log.unknownError");
    log(t("sessionHistoryFailed", { message: state.sessionHistoryError }));
  } finally {
    state.sessionHistoryLoading = false;
    renderSessionHistoryDrawer();
  }
}

async function restoreSessionFromHistory(sessionId) {
  if (!sessionId) return;
  $("applyButton").disabled = true;
  clearGenerationActivity();
  setStatus("loadingVersion");
  try {
    const saved = await fetchJson(`/api/sessions/${encodeURIComponent(sessionId)}`);
    const active = saved.active_version;
    if (!active?.design_state || !active.script) throw new Error(t("sessionHistoryEmpty"));
    state.serverSessionId = sessionId;
    localStorage.setItem(SERVER_SESSION_ID_STORAGE_KEY, sessionId);
    const restored = await applyStoredServerVersion(active, saved.versions || []);
    if (!restored) throw new Error(t("sessionHistoryEmpty"));
    const title = saved.session?.title || sessionSummaryTitle({ session: saved.session, active_version: active });
    state.sessionHistoryOpen = false;
    state.chatMessages.unshift({ role: "assistant", key: "chat.sessionRestored", vars: { title } });
    log(t("log.sessionRestored", { title }));
    setStatus("restored");
  } catch (error) {
    state.sessionHistoryError = error.message || t("log.unknownError");
    setStatus("failed");
    log(t("sessionHistoryFailed", { message: state.sessionHistoryError }));
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

function syncSavedServerVersion(version, fallbackLabel, fallbackDetail) {
  if (!version?.id) return;
  state.activeServerVersionId = version.id;
  const metadata = version.metadata || {};
  state.artifactRefs = artifactRefsFromMetadata(metadata);
  state.documentSummary = metadata.document_summary && typeof metadata.document_summary === "object" ? metadata.document_summary : state.documentSummary;
  const current = state.history.find((item) => item.serverVersionId === version.id);
  const target = current || state.history[0];
  if (target && !target.serverVersionId) {
    target.serverVersionId = version.id;
    target.version = version.version_number;
    target.artifactRefs = artifactRefsFromMetadata(version.metadata);
    if (!target.label && fallbackLabel) target.label = fallbackLabel;
    if (!target.detail && fallbackDetail) target.detail = fallbackDetail;
  }
  renderBottom();
  persistWorkbenchSession();
}

function clearServerSessionReference(options = {}) {
  state.serverSessionId = "";
  state.activeServerVersionId = "";
  localStorage.removeItem(SERVER_SESSION_ID_STORAGE_KEY);
  if (options.persist !== false) persistWorkbenchSession();
}

function resetClientWorkbenchSession() {
  localStorage.removeItem(WORKBENCH_SESSION_STORAGE_KEY);
  clearServerSessionReference({ persist: false });
  state.designState = null;
  state.script = "";
  state.patch = null;
  state.logs = [t("log.workbenchStarting")];
  state.history = [];
  state.artifacts = {};
  state.artifactRefs = {};
  state.previewPng = null;
  state.engine = "cadquery";
  state.freecadVersion = "";
  state.exportStatus = "notReady";
  state.statusKey = "loading";
  state.statusVars = {};
  state.generationActivity = null;
  state.previewMode = "design_state";
  state.generatedPrompt = "";
  state.generatedParameters = [];
  state.documentSummary = null;
  state.selectedGeneratedParameterName = "";
  state.selectedFreeCadObjectName = "";
  state.selectedFreeCadSubelement = null;
  state.selectedFreeCadAssemblyJoint = null;
  state.selectedFreeCadSketchElement = null;
  state.sketchCoincidenceAnchor = null;
  state.sketchGeometryConstraintAnchor = null;
  state.sketchDragPreview = null;
  state.sketchLiveSolve = null;
  state.sketchDryRunReview = null;
  state.sketchEditTool = "select";
  state.sketchSnapEnabled = true;
  state.sketchSnapSize = 1;
  state.assemblyConnectorAnchor = null;
  state.viewMode = "iso";
  state.generatedViewerFitMode = "all";
  state.selectionMode = "feature";
  state.measureMode = "distance";
  state.showBBox = true;
  state.showDims = true;
  state.exploded = false;
  state.selectedFeatureId = "base_plate";
  state.bottomTab = "chat";
  state.viewport = { scale: 1, tx: 0, ty: 0, dragging: false, x: 0, y: 0 };
  state.lastServerVersionSignature = "";
  state.sessionHistoryOpen = false;
  state.sessionHistoryLoading = false;
  state.sessionHistoryItems = [];
  state.sessionHistoryError = "";
  state.chatHistory = [];
  state.chatMessages = [{ role: "assistant", key: "chat.newSessionStarted" }];
}

function isMissingServerSessionError(error) {
  return /session not found|HTTP\s*404|404 Not Found/i.test(String(error?.message || error || ""));
}

async function ensureServerSession() {
  if (state.serverSessionId) return state.serverSessionId;
  const res = await fetchJson("/api/sessions", { title: state.generatedPrompt || "4yi-cad session" });
  state.serverSessionId = res.session.id;
  localStorage.setItem(SERVER_SESSION_ID_STORAGE_KEY, state.serverSessionId);
  persistWorkbenchSession();
  return state.serverSessionId;
}

async function recordServerVersion(intent, userInstruction = "", status = "ok", error = "") {
  if (!state.designState || !state.script) return;
  const payload = versionPayload(intent, userInstruction, status, error);
  const signature = versionSignature(payload);
  if (signature === state.lastServerVersionSignature) return;
  state.lastServerVersionSignature = signature;
  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      const sessionId = await ensureServerSession();
      const saved = await fetchJson(`/api/sessions/${encodeURIComponent(sessionId)}/versions`, payload);
      syncSavedServerVersion(saved.version, intent, userInstruction);
      await refreshFreeCadDocumentSummary(sessionId, saved.version?.id);
      return saved.version;
    } catch (saveError) {
      if (attempt === 0 && isMissingServerSessionError(saveError)) {
        clearServerSessionReference();
        continue;
      }
      console.warn("Unable to persist 4yi-cad server session", saveError);
      break;
    }
  }
  return null;
}

async function refreshFreeCadDocumentSummary(sessionId = state.serverSessionId, versionId = state.activeServerVersionId) {
  if (state.engine !== "freecad" || !sessionId || !versionId || !artifactRef("fcstd")) return null;
  try {
    const inspected = await fetchJson("/api/freecad/document/inspect", {
      session_id: sessionId,
      version_id: versionId,
    });
    if (inspected.ok && inspected.document_summary) {
      state.documentSummary = inspected.document_summary;
      persistWorkbenchSession();
      renderTree();
      renderProperties();
      renderBottom();
      return inspected.document_summary;
    }
  } catch (error) {
    console.warn("Unable to inspect FreeCAD document", error);
  }
  return null;
}

async function applyStoredServerVersion(version, versions = null) {
  if (!version?.design_state || !version.script) return false;
  const metadata = version.metadata || {};
  const refs = artifactRefsFromMetadata(metadata);
  const hydrated = await hydrateArtifactRefs(refs);

  state.designState = version.design_state;
  state.script = version.script;
  state.patch = version.patch || null;
  if (Array.isArray(versions)) state.history = historyItemsFromServerVersions(versions);
  state.artifactRefs = refs;
  state.artifacts = hydrated.artifacts || {};
  state.previewPng = hydrated.previewPng || null;
  state.engine = normalizeEngine(metadata.engine);
  state.freecadVersion = metadata.freecad_version || "";
  state.exportStatus = hasStepStlArtifacts() ? "ready" : "notReady";
  state.previewMode = metadata.preview_mode === "generated" ? "generated" : "design_state";
  state.generatedPrompt = metadata.generated_prompt || "";
  state.generatedParameters = Array.isArray(metadata.generated_parameters) ? metadata.generated_parameters : [];
  state.documentSummary = metadata.document_summary && typeof metadata.document_summary === "object" ? metadata.document_summary : null;
  state.selectedGeneratedParameterName = "";
  state.selectedFreeCadObjectName = "";
  state.selectedFreeCadSubelement = null;
  state.selectedFreeCadAssemblyJoint = null;

async function restoreServerSession() {
  const sessionId = state.serverSessionId || localStorage.getItem(SERVER_SESSION_ID_STORAGE_KEY);
  if (!sessionId) return false;
  try {
    const saved = await fetchJson(`/api/sessions/${encodeURIComponent(sessionId)}`);
    const active = saved.active_version;
    if (!active?.design_state || !active.script) return false;
    state.serverSessionId = sessionId;
    localStorage.setItem(SERVER_SESSION_ID_STORAGE_KEY, sessionId);
    return await applyStoredServerVersion(active, saved.versions || []);
  } catch (error) {
    if (isMissingServerSessionError(error)) clearServerSessionReference();
    console.warn("Unable to restore 4yi-cad server session", error);
    return false;
  }
}

async function fetchJson(url, body) {
  const res = await fetch(url, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.detail || json.error || `HTTP ${res.status}`);
  return json;
}

async function responseErrorMessage(resp) {
  let detail = "";
  try {
    const text = await resp.text();
    if (text) {
      try {
        const json = JSON.parse(text);
        detail = json.detail || json.error || text;
      } catch {
        detail = text;
      }
    }
  } catch {
    detail = "";
  }
  if (Array.isArray(detail)) {
    detail = detail.map((item) => item?.msg || item?.type || String(item)).join("; ");
  } else if (detail && typeof detail === "object") {
    detail = detail.message || JSON.stringify(detail);
  }
  return detail ? `HTTP ${resp.status}: ${detail}` : `HTTP ${resp.status}`;
}

function detectFreeCadImportFormat(filename) {
  const match = String(filename || "").toLowerCase().match(/\.([a-z0-9]+)$/);
  const ext = match ? match[1] : "";
  return new Set(["fcstd", "step", "stp", "iges", "igs", "brep"]).has(ext) ? ext : "";
}

function openFreeCadImportPicker() {
  $("freeCadImportInput").click();
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (!Number.isFinite(value) || value <= 0) return "0 B";
  if (value >= 1024 * 1024) return `${(value / 1024 / 1024).toFixed(value >= 10 * 1024 * 1024 ? 0 : 1)} MB`;
  if (value >= 1024) return `${(value / 1024).toFixed(value >= 10 * 1024 ? 0 : 1)} KB`;
  return `${Math.round(value)} B`;
}

async function freeCadUploadPolicy() {
  if (!freeCadUploadPolicyPromise) {
    freeCadUploadPolicyPromise = fetchJson("/api/freecad/upload_policy")
      .catch(() => ({
        max_bytes: FALLBACK_FREECAD_UPLOAD_MAX_BYTES,
        formats: ["fcstd", "step", "stp", "iges", "igs", "brep"],
      }));
  }
  const policy = await freeCadUploadPolicyPromise;
  const maxBytes = Number(policy?.max_bytes || FALLBACK_FREECAD_UPLOAD_MAX_BYTES);
  return {
    ...policy,
    max_bytes: Number.isFinite(maxBytes) && maxBytes > 0 ? maxBytes : FALLBACK_FREECAD_UPLOAD_MAX_BYTES,
  };
}

async function fileToBase64(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  return bytesToBase64(bytes);
}

function firstFreeCadSelectionName() {
  const shape = freeCadSelectableShapeObjects()[0];
  const object = shape || freeCadDocumentObjects()[0];
  return freeCadObjectKey(object);

async function importFreeCadModelFile(file) {
  if (!file) return false;
  const format = detectFreeCadImportFormat(file.name);
  if (!format) {
    setStatus("patchFailed");
    log(t("log.importUnsupported", { name: file.name || t("notAvailable") }));
    state.chatMessages.unshift({
      role: "assistant",
      key: "chat.importFailed",
      vars: { message: t("log.importUnsupported", { name: file.name || t("notAvailable") }) },
    });
    setBottomTab("chat");
    return false;
  }

  const policy = await freeCadUploadPolicy();
  if (file.size > policy.max_bytes) {
    const message = t("log.importTooLarge", {
      name: file.name || t("notAvailable"),
      size: formatBytes(file.size),
      max: formatBytes(policy.max_bytes),
    });
    setStatus("patchFailed");
    log(message);
    state.chatMessages.unshift({
      role: "assistant",
      key: "chat.importFailed",
      vars: { message },
    });
    setBottomTab("chat");
    renderAll();
    return false;
  }

  $("applyButton").disabled = true;
  $("importButton").disabled = true;
  state.previewMode = "generated";
  state.engine = "freecad";
  state.freecadVersion = "";
  state.generatedPrompt = file.name;
  state.generatedParameters = [];
  state.documentSummary = null;
  state.selectedGeneratedParameterName = "";
  state.selectedFreeCadObjectName = "";
  state.selectedFreeCadSubelement = null;
  state.selectedFreeCadAssemblyJoint = null;
  state.selectedFreeCadSketchElement = null;
  state.sketchCoincidenceAnchor = null;
  state.sketchGeometryConstraintAnchor = null;
  state.sketchDragPreview = null;
  state.sketchLiveSolve = null;
  state.sketchDryRunReview = null;
  state.assemblyConnectorAnchor = null;
  state.previewPng = null;
  state.artifacts = {};
  state.artifactRefs = {};
  state.exportStatus = "rendering";
  state.patch = { op: "import_model", format, filename: file.name };
  setBottomTab("logs");
  setStatus("importingModel");
  log(t("log.importStarted", { name: file.name }));
  renderAll();

  try {
    const dataB64 = await fileToBase64(file);
    const imported = await fetchJson("/api/freecad/import_model", {
      format,
      data_b64: dataB64,
      filename: file.name,
      title: file.name,
      user_instruction: `Import ${file.name}`,
      session_id: state.serverSessionId || null,
    });
    if (!imported.ok) throw new Error(imported.error || t("log.unknownError"));

    const version = imported.version || null;
    const metadata = version?.metadata || {};
    state.designState = version?.design_state || state.designState || fallbackDesignState();
    state.script = version?.script || state.script || "";
    state.patch = version?.patch || { op: "import_model", format, filename: file.name };
    state.previewMode = "generated";
    state.engine = "freecad";
    state.freecadVersion = imported.freecad_version || metadata.freecad_version || "";
    state.generatedPrompt = file.name;
    state.generatedParameters = Array.isArray(imported.parameters) ? imported.parameters : [];
    state.documentSummary = imported.document_summary || metadata.document_summary || null;
    state.selectedGeneratedParameterName = "";
    state.previewPng = imported.preview_png_b64 || null;
    state.artifacts = imported.exports || {};
    state.artifactRefs = imported.artifact_refs || metadata.artifact_refs || {};
    state.exportStatus = hasStepStlArtifacts() ? "ready" : "notReady";
    state.selectedFreeCadObjectName = firstFreeCadSelectionName();
    if (imported.session_id) {
      state.serverSessionId = imported.session_id;
      localStorage.setItem(SERVER_SESSION_ID_STORAGE_KEY, state.serverSessionId);
    }
    addHistory(
      t("history.freecadImport", { name: file.name }),
      t("history.freecadImportDetail", { name: file.name })
    );
    if (version?.id) {
      state.activeServerVersionId = version.id;
      syncSavedServerVersion(
        version,
        t("history.freecadImport", { name: file.name }),
        t("history.freecadImportDetail", { name: file.name })
      );
    }
    state.chatMessages.unshift({ role: "assistant", key: "chat.importOk", vars: { name: file.name } });
    log(t("log.importDone", { name: file.name }));
    setStatus("previewExportReady");
    setBottomTab("chat");
    return true;
  } catch (error) {
    setStatus("patchFailed");
    log(t("log.importFailed", { message: error.message }));
    state.chatMessages.unshift({
      role: "assistant",
      key: "chat.importFailed",
      vars: { message: error.message },
    });
    setBottomTab("chat");
    return false;
  } finally {
    $("applyButton").disabled = false;
    $("importButton").disabled = false;
    renderAll();
  }
}

async function rollbackToServerVersion(versionId) {
  if (!state.serverSessionId || !versionId) return;
  const target = state.history.find((item) => item.serverVersionId === versionId);
  $("applyButton").disabled = true;
  setStatus("rollingBack");
  try {
    const sessionId = encodeURIComponent(state.serverSessionId);
    const rolledBack = await fetchJson(`/api/sessions/${sessionId}/rollback`, {
      version_id: versionId,
      user_instruction: target ? t("history.rollbackDetail", { version: target.version }) : null,
    });
    const saved = await fetchJson(`/api/sessions/${sessionId}`);
    await applyStoredServerVersion(rolledBack.version, saved.versions || []);
    state.chatMessages.unshift({
      role: "assistant",
      key: "chat.rollbackOk",
      vars: { version: target?.version || rolledBack.version.version_number },
    });
    setStatus("restored");
    log(t("log.rolledBack", { version: target?.version || rolledBack.version.version_number }));
  } catch (error) {
    setStatus("patchFailed");
    log(t("log.rollbackFailed", { message: error.message }));
    state.chatMessages.unshift({
      role: "assistant",
      key: "chat.rollbackFailed",
      vars: { message: error.message },
    });
  } finally {
    $("applyButton").disabled = false;
    renderAll();
  }
}

function enabledFeatureIds() {

function generatedViewClass() {

  return `generated-view-${mode}`;

function hashToken(value) {
  return Array.from(String(value || "")).reduce((hash, ch) => ((hash << 5) - hash + ch.charCodeAt(0)) | 0, 0);
}

function generatedParameterValueMatching(patterns) {
  const params = state.generatedParameters || [];
  const match = params.find((param) => {
    const name = String(param.name || "").toLowerCase();
    return patterns.some((pattern) => pattern.test(name));
  });
  return match?.value;
}

function generatedDimensionValues() {
  const bbox = state.documentSummary?.geometry?.bbox?.size;
  if (Array.isArray(bbox) && bbox.length >= 3) {
    return { x: bbox[0], y: bbox[1], z: bbox[2] };
  }
  return {
    x: generatedParameterValueMatching([/(^|_)l$/, /length/, /room_l/, /bed_l/, /wd_l/, /dk_l/]),
    y: generatedParameterValueMatching([/(^|_)w$/, /width/, /room_w/, /bed_w/, /wd_w/, /dk_w/]),
    z: generatedParameterValueMatching([/(^|_)h$/, /height/, /room_h/, /bed_h/, /wd_h/]),
  };
}

function generatedDimensionLabel(axis) {
  const value = generatedDimensionValues()[axis];
  return Number.isFinite(Number(value)) ? `${formatNumber(value)} mm` : axis.toUpperCase();
}

function generatedNumericLabel(value, fallback) {
  return Number.isFinite(Number(value)) ? `${formatNumber(value)} mm` : fallback;
}

function generatedDiameterLabel() {
  const selected = selectedGeneratedParameter();
  const selectedToken = `${selected?.name || ""} ${selected?.label || ""}`.toLowerCase();
  if (selected && /(^|_)d$|diam|radius|hole|孔|直径|半径/.test(selectedToken)) {
    return generatedNumericLabel(selected.value, "dia");
  }
  return generatedNumericLabel(generatedParameterValueMatching([/(^|_)d$/, /diam/, /radius/, /hole/]), "dia");
}

function generatedSelectionMarkerGeometry(param) {
  const rawName = String(param?.name || "");
  const token = `${rawName} ${param?.label || ""} ${generatedParameterGroup(param)}`.toLowerCase();
  if (/(^|_)h$|height|wall_t|厚|高|thick/.test(token)) return { x: 76, y: 51, w: 10, h: 44, kind: "height" };
  if (/(^|_)l$|length|长/.test(token)) return { x: 50, y: 73, w: 42, h: 10, kind: "length" };
  if (/(^|_)w$|width|宽/.test(token)) return { x: 34, y: 58, w: 30, h: 10, kind: "width" };
  if (/(^|_)d$|diam|radius|hole|孔|直径|半径/.test(token)) return { x: 52, y: 50, w: 18, h: 18, kind: "diameter" };
  const seed = Math.abs(hashToken(rawName));
  return {
    x: 24 + (seed % 52),
    y: 28 + (Math.floor(seed / 17) % 42),
    w: 18,
    h: 14,
    kind: "area",
  };
}

function renderGeneratedSelectionMarker(param) {
  if (!param) return "";
  const marker = generatedSelectionMarkerGeometry(param);
  const style = `--marker-x:${marker.x}%;--marker-y:${marker.y}%;--marker-w:${marker.w}%;--marker-h:${marker.h}%`;
  return `<div class="generated-selection-marker generated-marker-${escapeHtml(marker.kind)}" style="${style}"></div>`;
}

function renderGeneratedMeasureOverlay() {
  if (state.measureMode === "diameter") {
    return `<div class="generated-measure generated-measure-diameter"><span>${escapeHtml(generatedDiameterLabel())}</span></div>`;
  }
  if (state.measureMode === "angle") {

  }
  if (!state.showDims) {
    return `<div class="generated-measure generated-measure-distance"><span>${escapeHtml(generatedDimensionLabel("x"))}</span></div>`;
  }
  return "";
}

function renderGeneratedPreviewOverlays(selected) {
  return [

    state.showDims ? `<div class="generated-dim generated-dim-x"><span>${escapeHtml(generatedDimensionLabel("x"))}</span></div>` : "",
    state.showDims ? `<div class="generated-dim generated-dim-y"><span>${escapeHtml(generatedDimensionLabel("y"))}</span></div>` : "",

}

function freeCadDocumentObjects() {

function freeCadShapeObjects() {

function freeCadSelectableShapeObjects() {

function freeCadObjectKey(obj) {

function freeCadObjectByName(name) {

function firstFreeCadSketchObject() {

function firstFreeCadTechDrawPage() {

function freeCadObjectDisplayName(obj) {

function freeCadFeatureIcon(kind, obj) {
  if (kind === "sketch" || freeCadObjectIsSketch(obj)) return "ruler";
  if (kind === "partdesign_body" || kind === "assembly") return "layers";
  if (kind === "techdraw") return "edit";
